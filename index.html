  function buildVagrants() {
    const stand2 = ['.........'].concat(VSTAND.slice(0, 7), VSTAND.slice(8));
    const sit2 = VSIT.slice(); sit2[6] = '.cCCccdSs...'; sit2[7] = '.cCCcccd....';
    const mk = (rows, name) => { const p = new Pix(rows[0].length, rows.length); p.rows(0, 0, rows, VPAL, name); return p.sprite(); };
    S.vagStand = [mk(VSTAND, 'vagStand'), mk(stand2, 'vagStand2')];
    S.vagSit = [mk(VSIT, 'vagSit'), mk(sit2, 'vagSit2')];
    const lg = new Pix(10, 4), w = C.wood;
    lg.rect(1, 0, 8, 1, w[4]); lg.rect(0, 1, 10, 2, w[3]); lg.rect(1, 3, 8, 1, w[2]);
    lg.set(0, 1, '#9C8466'); lg.set(0, 2, '#7E6A50'); lg.set(9, 1, w[2]);
    S.seatLog = lg.sprite();
  }

  // Arquero (mira a la derecha): solo asoma sobre el parapeto de la torre.
  const APAL = {
    g: '#56643A', G: '#6F7E48', q: '#3F4A2A', s: '#C8A286', S: '#A07E66', e: '#2B2521',
    b: '#6E4C30', B: '#8E6A44', w: '#CFC6AE',
  };
  const ARCHER = [
    '...ggg....',
    '..gGGGg...',
    '..gGsss...',
    '..gGses.B.',
    '..qgsss.wb',
    '..qgSS..wb',
    '.qgGGgSssb',
    '.qgGGGg.wb',
    '.qgGGGg.wb',
    '.qgGGgg.B.',
    '.qgggggg..',
    '.qqgggqq..',
  ];
  function buildTower(frame) {
    const W = 28, H = 62, p = new Pix(W, H), w = C.wood, top = 22;
    // patas traseras y tirantes (en sombra)
    for (let y = top; y < H; y++) { p.set(8, y, w[1]); p.set(9, y, w[2]); p.set(18, y, w[1]); p.set(19, y, w[2]); }
    const brace = (x0, y0, x1, y1) => { p.line(x0, y0, x1, y1, w[2]); p.line(x0, y0 + 1, x1, y1 + 1, w[1]); };
    brace(4, top + 4, 23, top + 18); brace(23, top + 4, 4, top + 18);
    brace(4, top + 21, 23, top + 36); brace(23, top + 21, 4, top + 36);
    // travesaños
    p.rect(3, top + 19, 22, 1, w[4]); p.rect(3, top + 20, 22, 1, w[2]);
    // patas delanteras, abiertas hacia el suelo
    for (let y = top; y < H; y++) {
      const o = Math.round(((y - top) / (H - top)) * 2);
      [[2 - o, 0], [23 + o, 1]].forEach(([x]) => { p.set(x, y, w[4]); p.set(x + 1, y, w[3]); p.set(x + 2, y, w[2]); });
    }
    // arquero detrás del parapeto
    const a = frame ? ['..........'].concat(ARCHER.slice(0, 11)) : ARCHER;
    p.rows(9, top - 17, a, APAL, 'archer');
    // parapeto de tablas con puntas
    for (let i = 0; i < 9; i++) {
      const x = 1 + i * 3, h = 8 + (i & 1);
      for (let y = top - 2 - h; y < top - 1; y++) { p.set(x, y, w[4]); p.set(x + 1, y, w[3]); p.set(x + 2, y, w[2]); }
      p.clr(x, top - 2 - h); p.clr(x + 2, top - 2 - h);
      p.set(x + 1, top - 2 - h, w[5]);
    }
    p.rect(0, top - 6, W, 1, w[2]); p.rect(0, top - 5, W, 1, w[1]);
    // plataforma de canto
    p.rect(0, top - 1, W, 1, w[5]); p.rect(0, top, W, 1, w[3]); p.rect(0, top + 1, W, 1, w[1]);
    for (let x = 3; x < W; x += 5) p.set(x, top, w[2]);
    return p.sprite();
  }

  function buildWoodWall() {
    const W = 18, H = 30, p = new Pix(W, H), w = C.wood;
    const hs = [25, 28, 26, 29, 24];
    hs.forEach((h, i) => {
      const x = 1 + i * 3;
      for (let y = H - h; y < H; y++) { p.set(x, y, w[4]); p.set(x + 1, y, w[3]); p.set(x + 2, y, w[2]); }
      p.clr(x, H - h); p.clr(x + 2, H - h); p.set(x + 1, H - h, w[5]);
      p.set(x + 2, H - h + 1, w[3]);
    });
    // dos travesaños atados
    [9, 19].forEach((y) => { p.rect(0, y, W, 1, w[5]); p.rect(0, y + 1, W, 1, w[2]); p.set(0, y + 1, w[3]); });
    // montículo de tierra
    p.rect(0, H - 2, W, 1, C.soil[3]); p.rect(0, H - 1, W, 1, C.soil[2]);
    S.woodWall = p.sprite();
  }

  // Muro defensivo de piedra (26×60, cima en y≈112): lienzo recto de 12 hiladas, cordón saliente bajo
  // tres merlones y zócalo; más alto que la corona del jinete (≈128).
  function buildStoneWall(seed) {
    const W = 26, H = 60, p = new Pix(W, H), cx = (W - 1) / 2, st = C.stone;
    const CORD = 7, PLINTH = H - 4;
    const inside = (x, y) => {
      const dx = Math.abs(x - cx);
      if (y >= PLINTH || (y >= CORD && y < CORD + 3)) return dx <= 12.5; // zócalo y cordón (26 px)
      if (dx > 11.5) return false;                                       // lienzo (24 px)
      if (y < 4) { const u = x - 1; return u % 9 < 6; }                   // merlones de 6 con troneras de 3
      return true;
    };
    stoneFill(p, inside, st, { seed, cw: 7, ch: 5, gap: 0.8, shade: (x) => x > W * 0.64 });
    // cordón y zócalo: arista iluminada arriba y sombra que arrojan sobre el lienzo
    for (let x = 0; x < W; x++) {
      const dark = x > W * 0.64 ? 1 : 0;
      if (p.get(x, CORD)) p.set(x, CORD, st[5 - dark]);
      if (p.get(x, PLINTH)) p.set(x, PLINTH, st[4 - dark]);
      if (x >= 1 && x < W - 1) p.set(x, CORD + 3, st[1]);
    }
    mossOver(p, seed + 3, 1, 0.68);
    return p.sprite();
  }

  // Tiendas: tejadillo de paja, pared trasera en sombra, mostrador y cartel con pictograma.
  // Tienda (36×57): tejado de paja de 14 filas cuyo alero queda por encima de la corona del jinete
  // (y≈128); debajo, cartel, mercancía colgada de una barra y mostrador a la altura de la cintura.
  function buildShop(kind) {
    const W = 36, H = 57, p = new Pix(W, H), w = C.wood, s = C.straw, mid = W / 2;
    const eave = 13;                  // fila del flequillo del alero
    // pared del fondo (en sombra)
    for (let y = eave + 1; y < H - 1; y++) for (let x = 5; x < W - 5; x++) p.set(x, y, (x % 5 === 0) ? w[1] : w[2]);
    // sombra del alero sobre la pared
    for (let x = 5; x < W - 5; x++) { p.set(x, eave + 1, w[0]); if (U.hash(x, 2, 6) < 0.5) p.set(x, eave + 2, w[1]); }
    // postes
    for (let y = eave - 2; y < H; y++) { p.set(2, y, w[4]); p.set(3, y, w[2]); p.set(W - 4, y, w[4]); p.set(W - 3, y, w[2]); }
    // barra de la mercancía y mercancía colgada
    const railY = eave + 12;
    p.rect(4, railY, W - 8, 1, w[3]);
    if (kind === 'hammer') {
      [8, 16, 24].forEach((x, i) => {
        const y = railY + 1 + (i === 1 ? 1 : 0);
        p.rect(x, y, 4, 2, C.iron[3]); p.rect(x, y, 4, 1, C.iron[4]); p.set(x + 3, y + 1, C.iron[2]);
        for (let k = 2; k < 8; k++) p.set(x + 1, y + k, w[5]);
      });
    } else {
      [9, 17, 25].forEach((x, i) => {
        const y = railY + 1 + (i === 1 ? 1 : 0);
        for (let k = 0; k < 11; k++) { const dx = Math.round(Math.sin((k / 10) * Math.PI) * 2); p.set(x - dx, y + k, w[4]); }
        for (let k = 0; k < 11; k++) p.set(x + 1, y + k, '#CFC6AE');
      });
    }
    // mostrador
    const cy = H - 14;
    p.rect(3, cy, W - 6, 1, w[5]); p.rect(3, cy + 1, W - 6, 1, w[3]);
    for (let y = cy + 2; y < H; y++) for (let x = 4; x < W - 4; x++) p.set(x, y, ((y - cy) % 4 === 1) ? w[2] : (x < mid ? w[4] : w[3]));
    for (let y = cy + 2; y < H; y++) p.set(4, y, w[3]);
    if (kind === 'hammer') {
      // yunque sobre el mostrador
      p.rect(9, cy - 3, 7, 1, C.iron[4]); p.rect(10, cy - 2, 5, 1, C.iron[2]); p.rect(11, cy - 1, 3, 1, C.iron[1]);
      p.set(8, cy - 3, C.iron[3]);
    } else {
      // carcaj con flechas
      p.rect(27, cy - 5, 3, 5, '#6A4A34'); p.rect(27, cy - 5, 1, 5, '#84603F');
      [27, 28, 29].forEach((x, i) => { p.set(x, cy - 6 - (i & 1), '#D8D0B8'); p.set(x, cy - 7 - (i & 1), '#B7432F'); });
    }
    // tejado de paja a dos aguas (caballete arriba, alero deshilachado abajo)
    for (let y = 0; y <= eave; y++) {
      const hw = Math.min(mid, Math.round(4 + y * 1.2));
      for (let x = mid - hw; x < mid + hw; x++) {
        const strand = U.hash(x, Math.floor(y / 3), kind === 'hammer' ? 1 : 2), left = x < mid;
        let col = left ? (strand < 0.5 ? s[3] : s[2]) : (strand < 0.5 ? s[2] : s[1]);
        if (y === eave) col = U.hash(x, 9, 4) < 0.35 ? null : s[0];
        else if (y === eave - 1) col = s[1];
        else if (left && x === mid - hw) col = s[4];
        if (y <= 1 && Math.abs(x - (mid - 0.5)) < 4) col = s[4];
        if (col) p.set(x, y, col);
      }
    }
    // cartel colgado del alero
    const bx = mid - 6, by = eave + 1;
    p.set(bx + 2, by, w[1]); p.set(bx + 9, by, w[1]);
    p.rect(bx, by + 1, 12, 8, w[4]); p.rect(bx + 1, by + 2, 10, 6, w[3]); p.rect(bx, by + 8, 12, 1, w[2]);
    const ink = '#E8DDBC';
    if (kind === 'hammer') {
      p.rect(bx + 3, by + 3, 6, 2, ink); p.rect(bx + 5, by + 5, 2, 3, ink);
    } else {
      [[4, 2], [3, 3], [3, 4], [3, 5], [4, 6]].forEach(([x, y]) => p.set(bx + x, by + y, ink));
      for (let y = 2; y < 7; y++) p.set(bx + 6, by + y, ink);
      p.rect(bx + 3, by + 4, 6, 1, ink); p.set(bx + 8, by + 3, ink); p.set(bx + 8, by + 5, ink);
    }
    return p.sprite();
  }

  // Estandarte: mástil de 60 px con travesaño y un paño vertical colgante (13×24, cola de golondrina)
  // del color de la capa, con una corona de 3 puntas centrada. 3 niveles de viento × 4 frames.
  const BANNER = { PH: 60, PC: 8, TOP: 6, BW: 13, BH: 24, LEAN: 7 };
  function buildBanner() {
    const [col, sh] = K.royal.cape, w = C.wood, { PH, PC, BW, BH, LEAN } = BANNER;
    const gold = '#EB9B36', goldL = '#F7C46A', goldD = '#B8742A';
    const pole = new Pix(PC * 2 + 1, PH);
    for (let y = 3; y < PH; y++) { pole.set(PC - 1, y, w[4]); pole.set(PC, y, w[3]); pole.set(PC + 1, y, w[2]); }
    // remate dorado
    pole.set(PC, 0, goldL);
    pole.set(PC - 1, 1, gold); pole.set(PC, 1, goldL); pole.set(PC + 1, 1, goldD);
    pole.set(PC - 1, 2, gold); pole.set(PC, 2, gold); pole.set(PC + 1, 2, goldD);
    // travesaño con pomos dorados
    for (let x = 1; x < PC * 2; x++) { pole.set(x, 4, w[5]); pole.set(x, 5, w[2]); }
    pole.set(0, 4, goldL); pole.set(0, 5, goldD); pole.set(PC * 2, 4, gold); pole.set(PC * 2, 5, goldD);
    S.bannerPole = pole.sprite();
    // Corona: más clara si el paño es anaranjado (el dorado se perdería).
    const [cr, cg] = U.rgb(col), pale = cr > 150 && cg > 100;
    const cMain = pale ? '#F4E6C0' : gold, cHi = pale ? '#FFF6DE' : goldL, cLo = pale ? '#C9B98E' : goldD;
    const lite = U.lerpColor(col, '#FFFFFF', 0.14), dark = U.shade(sh, 0.8), mid = (BW - 1) / 2;
    const CROWN = ['h.h.h', '#####', '#####', 'ddddd'];
    S.banner = [0, 1, 2].map((level) => {
      const lean = [0.3, 2.5, 5.2][level], amp = [0.6, 0.9, 1.1][level];
      const out = [];
      for (let f = 0; f < 4; f++) {
        const p = new Pix(BW + LEAN + 1, BH), ph = (f / 4) * Math.PI * 2;
        // desplazamiento de cada fila: el viento empuja la parte baja y una onda larga baja por el paño
        const off = (v) => { const k = v / (BH - 1); return lean * Math.pow(k, 1.6) + amp * k * Math.sin(ph - v * 0.2); };
        const notch = (u, v) => { const t = v - (BH - 6); return t > 0 && Math.abs(u - mid) < t * 0.8; };
        for (let v = 0; v < BH; v++) {
          const dx = Math.round(off(v));
          for (let u = 0; u < BW; u++) {
            if (notch(u, v)) continue;
            // pliegues verticales (siguen la inclinación del paño) que se desplazan despacio con el viento
            const fold = Math.sin(u * 0.9 - ph * (level ? 0.5 : 0.25) + 1.3);
            let c = fold > 0.72 ? sh : col;
            if (u === 0) c = lite;
            if (u === BW - 1) c = sh;
            if (v === 0) c = dark;                                           // doblez bajo el travesaño
            if (v === BH - 1 || notch(u - 1, v) || notch(u + 1, v)) c = c === col || c === lite ? sh : dark; // bordes de la cola
            p.set(u + dx, v, c);
          }
        }
        CROWN.forEach((r, j) => {
          const v = 5 + j, dx = Math.round(off(v));
          for (let i = 0; i < 5; i++) if (r[i] !== '.') p.set(mid - 2 + i + dx, v, r[i] === 'd' ? cLo : r[i] === 'h' ? cHi : cMain);
        });
        out.push(p.sprite());
      }
      return out;
    });
  }

  // Estatua-monumento (33×72, cima en y≈100): rey coronado de piedra que apoya las manos en la espada,
  // sobre un pedestal de tres cuerpos (cornisa, dado de sillares y zócalo escalonado).
  function buildStatue() {
    const W = 33, H = 72, p = new Pix(W, H), st = C.stone, cx = 16, PT = 53;
    const ped = (x, y) => x >= 0 && x < W && (
      (y >= 66 && y < H) || (y >= 64 && y < 66 && x >= 1 && x < W - 1) ||
      (y >= 56 && y < 64 && x >= 3 && x < W - 3) || (y >= PT && y < 56 && x >= 1 && x < W - 1));
    for (let y = PT; y < H; y++) for (let x = 0; x < W; x++) {
      if (!ped(x, y)) continue;
      let k = 3;
      if (!ped(x, y - 1)) k = 5; else if (!ped(x, y - 2)) k = 4;
      if (!ped(x, y + 1) || y === 56) k = 2;                       // aristas inferiores y sombra de la cornisa
      if (x > W * 0.66) k -= 1;
      if (y >= 57 && y < 64 && (y === 60 || U.mod(x + (y < 60 ? 0 : 4), 8) === 0)) k = 1; // juntas del dado
      if (y >= 67 && U.mod(x + 3, 9) === 0) k = 1;                                         // juntas del zócalo
      p.set(x, y, st[U.clamp(k, 1, 5)]);
    }
    // figura
    const body = (x, y) => {
      const dx = x - cx;
      if (y >= 3 && y <= 12) return (dx / 3.7) ** 2 + ((y - 7.8) / 4.8) ** 2 <= 1;   // cabeza
      if (y === 13) return Math.abs(dx) <= 2;                                          // cuello
      if (y >= 14 && y <= 17) return Math.abs(dx) <= 5.5 + (y - 14);                   // hombros
      if (y >= 18 && y < PT) return Math.abs(dx) <= 8.4 + ((y - 18) / (PT - 18)) ** 1.5 * 3.2; // manto en A
      return false;
    };
    for (let y = 0; y < PT; y++) for (let x = 0; x < W; x++) {
      if (!body(x, y)) continue;
      const dx = x - cx;
      let k = dx < -4 ? 4 : dx < 3 ? 3 : 2;
      if (!body(x, y - 1)) k += 1;
      if (y > 28 && (dx === -5 || dx === 5 || dx === -9 || dx === 9)) k -= 1;         // pliegues del manto
      p.set(x, y, st[U.clamp(k, 1, 5)]);
    }
    // corona de 3 puntas
    [-3, 0, 3].forEach((dx) => { p.set(cx + dx, 0, st[5]); p.set(cx + dx, 1, st[4]); });
    for (let dx = -3; dx <= 3; dx++) { p.set(cx + dx, 2, st[dx < 2 ? 5 : 4]); p.set(cx + dx, 3, st[dx < 2 ? 3 : 2]); }
    // cuencas de los ojos y sombra bajo la barbilla
    p.set(cx - 2, 7, st[1]); p.set(cx + 2, 7, st[1]);
    for (let dx = -2; dx <= 2; dx++) p.set(cx + dx, 13, st[1]);
    // brazos: mangas que convergen en las manos sobre la empuñadura
    p.line(cx - 8, 17, cx - 2, 25, st[4]); p.line(cx - 8, 18, cx - 2, 26, st[3]); p.line(cx - 8, 19, cx - 3, 26, st[3]);
    p.line(cx + 8, 17, cx + 2, 25, st[2]); p.line(cx + 8, 18, cx + 2, 26, st[1]); p.line(cx + 8, 19, cx + 3, 26, st[1]);
    p.rect(cx - 2, 24, 5, 3, st[4]); p.rect(cx - 2, 26, 5, 1, st[2]);
    // espada: pomo y puño sobre las manos, guarda y hoja hasta el pedestal
    p.set(cx, 20, st[5]); p.set(cx - 1, 21, st[4]); p.set(cx, 21, st[5]); p.set(cx + 1, 21, st[3]);
    p.set(cx, 22, st[3]); p.set(cx, 23, st[3]);
    p.rect(cx - 5, 28, 11, 1, st[5]); p.rect(cx - 5, 29, 11, 1, st[2]);
    for (let y = 30; y < PT; y++) { p.set(cx - 1, y, st[5]); p.set(cx, y, st[4]); p.set(cx + 1, y, st[2]); }
    p.set(cx - 1, PT - 1, st[2]); p.set(cx + 1, PT - 1, st[2]);   // punta de la hoja
    mossOver(p, 77, 1.2, 0.62);
    S.statue = p.sprite();
  }

  // Muelle: cubierta a ras de suelo con norays y cuerda; pilotes y tirantes que bajan DENTRO del agua
  // hasta su línea de flotación (WY+14) con algas, y un embarcadero bajo a nivel del agua (y≈186–191).
  // Se parte en dos sprites: lo que queda por encima de WY va en drawBack (y se refleja); lo de WY hacia
  // abajo va en drawOverlay, después del agua, teñido con K.env.mulColor, y tapa el reflejo.
  const DOCK = { FOOT: WY + 14, LOW: 24 };
  function buildDock(len) {
    const y0 = GY - 18, H = WY + DOCK.LOW - y0, p = new Pix(len, H), w = C.wood, m = C.moss;
    const Y = (y) => y - y0;   // fila de pantalla → fila del sprite
    const dk = Y(GY - 1);      // fila superior de la cubierta
    const foot = Y(DOCK.FOOT); // línea de flotación de los pilotes
    const piles = [];
    for (let x = 3; x < len - 3; x += 22) piles.push(x);
    // embarcadero bajo (detrás de los pilotes) entre los dos últimos vanos, con escalera desde la cubierta
    const lx0 = piles[piles.length - 3] + 4, lTop = Y(186);
    for (let x = lx0; x < len; x++) {
      const seam = (x - lx0) % 5 === 4;
      p.set(x, lTop, seam ? w[3] : w[5]); p.set(x, lTop + 1, seam ? w[2] : w[4]); p.set(x, lTop + 2, seam ? w[2] : w[3]);
      p.set(x, lTop + 3, w[1]); p.set(x, lTop + 4, w[0]);
      p.set(x, lTop + 5, U.hash(x, 7, 13) < 0.6 ? m[1] : m[0]);
      if (U.hash(x, 8, 13) < 0.3) p.set(x, lTop + 6, m[0]);
    }
    const ladX = lx0 + 3;
    for (let y = dk + 6; y < lTop; y++) { p.set(ladX, y, w[3]); p.set(ladX + 4, y, w[2]); if ((y - dk) % 3 === 0) for (let i = 1; i < 4; i++) p.set(ladX + i, y, w[4]); }
    // noray bajo sobre el embarcadero
    const bx = len - 8;
    for (let y = lTop - 4; y < lTop; y++) { p.set(bx, y, w[4]); p.set(bx + 1, y, w[3]); p.set(bx + 2, y, w[2]); }
    p.rect(bx, lTop - 2, 3, 1, C.straw[2]);
    // tirantes en zigzag entre pilotes (salvo en los vanos del embarcadero): del larguero al agua
    for (let i = 0; i < piles.length - 1; i++) {
      const a = piles[i] + 4, b = piles[i + 1] - 1;
      if (b > lx0) break;
      const top = Y(GY + 7), bot = Y(WY + 9), [ya, yb] = i & 1 ? [top, bot] : [bot, top];
      p.line(a, ya, b, yb, w[3]); p.line(a, ya + 1, b, yb + 1, w[1]);
    }
    // pilotes: madera mojada (un tono más oscura) cerca del agua y algas en la línea de flotación
    for (const x of piles) {
      for (let y = dk + 6; y < foot; y++) {
        const c = y >= Y(WY + 4) ? [w[2], w[1], w[1], w[0]] : [w[3], w[2], w[2], w[1]];
        for (let i = 0; i < 4; i++) p.set(x + i, y, c[i]);
      }
      for (let i = 0; i < 4; i++) {
        const len2 = 2 + Math.floor(U.hash(x + i, 3, 17) * 4);
        for (let k = 1; k <= len2; k++) p.set(x + i, foot - k, k === len2 ? m[2] : (k & 1 ? m[0] : m[1]));
      }
      for (let i = 0; i < 4; i++) p.set(x + i, dk + 7, w[0]);
    }
    // cubierta: tablones transversales vistos desde arriba
    for (let x = 0; x < len; x++) {
      const plank = Math.floor(x / 6), seam = x % 6 === 5, tone = U.hash(plank, 0, 21) < 0.5 ? 4 : 3;
      for (let y = dk; y < dk + 4; y++) p.set(x, y, seam ? w[2] : y === dk ? w[tone + 1] : y === dk + 3 ? w[tone - 1] : w[tone]);
      p.set(x, dk + 4, w[2]); p.set(x, dk + 5, w[1]);
    }
    for (let x = 4; x < len; x += 22) p.set(x + 1, dk + 4, C.iron[3]);
    // norays con cuerda y cuerda colgante entre ellos
    const posts = [1, Math.round(len / 2) - 2, len - 6];
    posts.forEach((x) => {
      for (let y = 2; y < dk + 4; y++) { p.set(x, y, w[4]); p.set(x + 1, y, w[3]); p.set(x + 2, y, w[3]); p.set(x + 3, y, w[2]); }
      p.clr(x, 2); p.clr(x + 3, 2); p.set(x + 1, 2, w[5]); p.set(x + 2, 2, w[4]);
      p.rect(x, 6, 4, 1, C.straw[3]); p.rect(x, 7, 4, 1, C.straw[1]);
    });
    for (let i = 0; i < posts.length - 1; i++) {
      const a = posts[i] + 4, b = posts[i + 1] - 1;
      for (let x = a; x <= b; x++) { const u = (x - a) / (b - a); p.set(x, 7 + Math.round(Math.sin(u * Math.PI) * 5), C.straw[2]); }
    }
    // parte alta (drawBack, se refleja) y parte sumergida (drawOverlay)
    const split = Y(WY), up = new Pix(len, split), lo = new Pix(len, H - split);
    for (let y = 0; y < H; y++) for (let x = 0; x < len; x++) {
      const c = p.d[y * len + x];
      if (!c) continue;
      if (y < split) up.d[y * len + x] = c; else lo.d[(y - split) * len + x] = c;
    }
    S.dock = up.sprite(); S.dockY0 = y0; S.dockLow = lo.canvas();
    // Sombra de la cubierta sobre la orilla (se aplica con multiply antes del muelle).
    const sc = ['#857D70', '#958E82', '#A69F94', '#B7B1A7', '#C8C3BA', '#DAD6CF'], shade = new Pix(len, sc.length);
    for (let y = 0; y < sc.length; y++) for (let x = 0; x < len; x++) shade.set(x, y, sc[y]);
    S.dockShade = shade.canvas();
    // Onda al pie de cada pilote y del embarcadero, y reflejo corto del pilote bajo su línea de flotación
    // (3 frames). Se dibujan con alfa, así que son lienzos opacos aparte.
    const fl = DOCK.FOOT - WY;
    S.dockRip = []; S.dockRefl = [];
    for (let f = 0; f < 3; f++) {
      const rp = new Pix(len, DOCK.LOW), rf = new Pix(len, DOCK.LOW), foam = '#C9CDB8';
      for (const x of piles) {
        if (f === 0) rp.rect(x - 1, fl, 6, 1, foam);
        else if (f === 1) { rp.rect(x - 2, fl, 8, 1, foam); rp.rect(x, fl + 1, 4, 1, foam); }
        else { rp.rect(x - 3, fl, 2, 1, foam); rp.rect(x + 5, fl, 2, 1, foam); rp.rect(x - 1, fl + 1, 6, 1, foam); }
        for (let y = fl + 1; y < DOCK.LOW; y++) {
          const d = (y - fl) / (DOCK.LOW - fl);
          if (U.hash(x + f * 31, y, 23) < d * 0.8) continue;
          const o = Math.round(Math.sin(y * 1.3 + f * 2.1 + x) * (0.5 + d));
          rf.rect(x + o, y, 4, 1, y === fl + 1 ? w[0] : w[1]);
        }
      }
      for (let x = lx0; x < len; x++) if (U.hash(x >> 2, f, 29) < 0.55) rp.set(x, lTop + 7 - split, foam);
      S.dockRip.push(rp.canvas()); S.dockRefl.push(rf.canvas());
    }
  }

  // Granja: surcos por campo, manojos de trigo (2 variantes × 4 inclinaciones), arroyo y cascada.
  function buildFarm() {
    S.wheat = [0, 1].map((v) => [0, 1, 2, 3].map((lean) => {
      const W = 12, H = 18, p = new Pix(W, H), rr = U.mulberry32(50 + v * 7);
      for (let i = 0; i < 5; i++) {
        const bx = 1 + i * 2, hgt = 11 + Math.floor(rr() * 6);
        for (let j = 0; j < hgt; j++) {
          const u = j / hgt, x = bx + Math.round(lean * u * u), y = H - 1 - j;
          if (j >= hgt - 4) {
            p.set(x, y, j === hgt - 1 ? '#D9C68A' : (j & 1) ? '#E2CC80' : '#C8B060');
            if (j < hgt - 1) p.set(x + 1, y, (j & 1) ? '#A08C48' : '#B89E54');
          } else p.set(x, y, j < 4 ? '#6E6A36' : '#8E8446');
        }
      }
      return p.sprite();
    }));
    // Campos labrados: solo una franja fina en la superficie (y 170–176): tierra oscura con caballones
    // de 1 px y brotes. La cara del talud queda con la tierra del mundo; como mucho, surcos cortos
    // verticales y terrones sueltos justo bajo el borde, nunca bandas horizontales continuas.
    S.fields = [];
    for (const f of FIELDS) {
      const fw = f[1] - f[0], p = new Pix(fw, 9), so = C.soil;
      const ROWS = [2, 1, 3, 1, 1, 3, 1];   // borde lejano, surco, caballón, surcos, caballón, borde cercano
      for (let y = 0; y < ROWS.length; y++) {
        const end = Math.round(U.hash(y, f[0], 5) * 1.5) + (y === 0 ? 2 : y === ROWS.length - 1 ? 1 : 0);
        for (let x = end; x < fw - end; x++) {
          let k = ROWS[y];
          if (k === 3 && U.hash(x, y, 8) < 0.18) k = 2;           // caballón irregular
          if (k === 1 && U.hash(x, y, 9) < 0.08) k = 0;           // hoyos
          p.set(x, y, so[k]);
        }
        // brotes en los caballones
        if (ROWS[y] === 3) for (let x = 2 + y; x < fw - 3; x += 4 + (x & 1)) { p.set(x, y, '#6E7A38'); if (U.hash(x, y, 2) < 0.5) p.set(x, y - 1, '#8A9046'); }
      }
      // bajo el borde: surcos cortos verticales y terrones sueltos
      for (let x = 2; x < fw - 2; x += 3 + Math.floor(U.hash(x, 1, 11) * 4)) {
        p.set(x, ROWS.length, so[0]);
        if (U.hash(x, 2, 11) < 0.45) p.set(x, ROWS.length + 1, so[0]);
        else if (U.hash(x, 3, 11) < 0.5) p.set(x + 1, ROWS.length, so[1]);
      }
      S.fields.push(p.sprite());
    }
    // arroyo con cascada al río (5 frames de corriente)
    S.stream = [];
    const W = 22, H = WY - GY + 2, cxOf = (y) => 11 + Math.round(Math.sin(y * 0.3 + 0.4) * 1.6), hwOf = (y) => 1.6 + y * 0.2;
    for (let f = 0; f < 5; f++) {
      const p = new Pix(W, H);
      for (let y = 0; y < H; y++) {
        const cx = cxOf(y), hw = hwOf(y), fall = y >= H - 6;
        for (let x = 0; x < W; x++) {
          const d = x - cx, ad = Math.abs(d);
          if (ad > hw + 1.2) continue;
          if (ad > hw) { p.set(x, y, fall ? null : (U.hash(x, y, 4) < 0.25 ? '#8C8A7A' : '#3B2B1E')); continue; }
          let c;
          if (!fall) {
            c = d < -hw + 1 ? '#4C5B54' : ad < 1 ? '#6F8379' : '#5E7069';
            if (U.mod(y - f + Math.floor(U.hash(x, 0, 6) * 5), 5) === 0 && ad < hw - 0.6) c = '#9AB0A6';
          } else {
            const v = U.mod(y - f * 2 + Math.floor(U.hash(x, 1, 6) * 5), 5);
            c = v === 0 ? '#DCE6DE' : v < 3 ? '#A9BCB2' : '#7E948A';
            if (y >= H - 2) c = U.hash(x, y + f, 3) < 0.5 ? '#E4ECE4' : '#B8C8BE';
          }
          p.set(x, y, c);
        }
      }
      // piedras en la orilla del fondo (el arroyo sale de detrás)
      p.blob(cxOf(0) - 4, 1, 2, 1, (dx, dy) => (dy < 0 ? C.stone[4] : C.stone[3]));
      p.blob(cxOf(0) + 4, 1, 2, 1, (dx, dy) => (dy < 0 ? C.stone[4] : C.stone[2]));
      S.stream.push(p.sprite());
    }
    S.streamCX = 11;
    // puentecillo de tablones por donde pasa el camino
    const b = new Pix(18, 6), w = C.wood;
    for (let x = 0; x < 18; x++) {
      const seam = x % 4 === 3;
      b.set(x, 1, seam ? w[3] : w[5]); b.set(x, 2, seam ? w[2] : w[4]); b.set(x, 3, w[2]); b.set(x, 4, w[1]);
    }
    [0, 16].forEach((x) => { b.rect(x, 0, 2, 6, w[3]); b.set(x, 0, w[5]); b.set(x + 1, 5, w[1]); });
    S.bridge = b.sprite();
  }

  // Conejos (miran a la derecha): sentado, mordisqueando, salto estirado y aterrizaje.
  const RPAL = { b: '#8A7862', B: '#A6937A', d: '#66573F', w: '#E6DECE', k: '#231C17', e: '#7C6A56', E: '#B89484', n: '#C49A8A' };
  const RABBIT = [
    [
      '......ee...',
      '......eE...',
      '......BBb..',
      '....BBBbkb.',
      '..BBbbbbbbn',
      '.wbbbbbbbb.',
      '..bbbbbbd..',
      '..ddd.dd...',
    ],
    [
      '...........',
      '.....ee....',
      '......eBb..',
      '....BBBbkb.',
      '..BBbbbbbbn',
      '.wbbbbbbbb.',
      '..bbbbbbd..',
      '..ddd.dd...',
    ],
    [
      '...........',
      '.......ee..',
      '..BBBBBeBb.',
      '.wBbbbbbbkb',
      '..bbbbbbbbn',
      '.dd...ddd..',
      'dd.........',
      '...........',
    ],
    [
      '.......e...',
      '......eE...',
      '....BBBBb..',
      '..BBbbbbkb.',
      '.wbbbbbbbbn',
      '..bbbbbbb..',
      '..ddd..dd..',
      '...........',
    ],
  ];
  function buildRabbits() {
    S.rabbit = RABBIT.map((rows, i) => { const p = new Pix(11, 8); p.rows(0, 0, rows, RPAL, 'rabbit' + i); return p.sprite(); });
  }

  // ------------------------------------------------------------------ disposición y estado
  // Campos de cultivo [x0, x1] dentro de la granja.
  const FIELDS = [[804, 872], [884, 952], [964, 1032]];
  const objs = [], lights = [], sparks = [], rabbits = [];
  const rr = U.mulberry32(9137);
  let bannerPh = 0, dockX0 = null;

  // Dibuja el sprite con su columna de anclaje ax en la x del mundo y su base (exclusiva) en la fila by.
  function put(ctx, s, wx, ax, by, dir = 1) {
    const x = K.sx(wx) - (dir < 0 ? s.w - 1 - ax : ax);
    if (x >= K.W || x + s.w <= 0) return;
    ctx.drawImage(dir < 0 ? s.l : s.r, x, by - s.h);
  }
  const frame = (fps, n, off = 0) => Math.floor(K.t * fps + off) % n;

  function layout() {
    objs.length = 0; lights.length = 0; dockX0 = null;
    const add = (x0, x1, z, draw) => objs.push({ x0, x1, z, draw });
    let towerN = 0, wallN = 0, torchN = 0;
    for (const t of K.MAP.things) {
      switch (t.type) {
        case 'portal':
          add(t.x - 24, t.x + 24, 0, (ctx) => { put(ctx, S.portalSwirl[frame(7, 8)], t.x, 23, GY + 2); put(ctx, S.portal, t.x, 23, GY + 2); });
          break;
        case 'camp': {
          const tx = t.x - 22, fx = t.x + 7, sitX = t.x - 6, standX = t.x + 21;
          lights.push({ type: 'fire', x: fx, y: GY - 8, power: 0.6 });
          add(t.x - 40, t.x + 30, 8, (ctx) => {
            put(ctx, S.tent, tx, 14, GY + 1);
            put(ctx, S.campBack, fx, 10, GY + 2);
            put(ctx, S.campFlame[frame(10, 8)], fx, 7, GY - 1);
            put(ctx, S.campFront, fx, 10, GY + 2);
            put(ctx, S.seatLog, sitX, 5, GY + 2);
            put(ctx, S.vagSit[frame(1.3, 2)], sitX, 5, GY);
            put(ctx, S.vagStand[frame(1.1, 2, 0.5)], standX, 4, GY + 1, -1);
          });
          sparkSrc.push({ x: fx, y: GY - 12, rate: 2.5, spread: 3, vy: 16 });
          break;
        }
        case 'woodWall':
          add(t.x - 9, t.x + 9, 3, (ctx) => put(ctx, S.woodWall, t.x, 9, GY + 2));
          break;
        case 'tower': {
          const dir = towerN++ === 0 ? -1 : 1, x = dir < 0 ? t.x : t.x - 2, ph = towerN * 0.37;
          add(x - 14, x + 14, 1, (ctx) => put(ctx, S.tower[frame(0.8, 2, ph)], x, 13, GY + 2, dir));
          break;
        }
        case 'farm':
          add(t.x0, t.x1, 5, (ctx) => drawFarm(ctx, t));
          break;
        case 'stoneWall': {
          // el muro derecho se aparta 5 px para no tapar la pata de la torre vecina
          const s = S.stoneWall[wallN++ % 2], x = wallN === 2 ? t.x + 5 : t.x;
          add(x - 14, x + 14, 3, (ctx) => put(ctx, s, x, 13, GY + 2));
          break;
        }
        case 'torch': {
          const x = torchN++ === 1 ? t.x - 2 : t.x, ph = torchN * 3.3;
          lights.push({ type: 'torch', x, y: GY - 26, power: 1 });
          add(x - 8, x + 8, 7, (ctx) => { put(ctx, S.torchFlame[frame(6, 8, ph)], x, 4, GY - 19); put(ctx, S.torch, x, 7, GY + 2); });
          break;
        }
        case 'shopHammer':
          add(t.x - 18, t.x + 18, 2, (ctx) => put(ctx, S.shopHammer, t.x, 18, GY + 2));
          break;
        case 'shopBow':
          add(t.x - 18, t.x + 18, 2, (ctx) => put(ctx, S.shopBow, t.x, 18, GY + 2));
          break;
        case 'campfire':
          lights.push({ type: 'fire', x: t.x, y: GY - 18, power: 1 });
          sparkSrc.push({ x: t.x, y: GY - 26, rate: 9, spread: 7, vy: 26 });
          add(t.x - 20, t.x + 20, 6, (ctx) => {
            put(ctx, S.fireBack, t.x, 18, GY + 3);
            put(ctx, S.fireFlame[frame(10, 8)], t.x, 12, GY - 1);
            put(ctx, S.fireFront, t.x, 18, GY + 3);
          });
          break;
        case 'banner':
          add(t.x - BANNER.PC - 1, t.x + BANNER.BW + BANNER.LEAN, 4, (ctx) => {
            const wind = K.env.wind, lv = wind < 0.3 ? 0 : wind < 0.6 ? 1 : 2;
            const top = GY + 2 - BANNER.PH, s = S.banner[lv][Math.floor(bannerPh) % 4];
            put(ctx, S.bannerPole, t.x, BANNER.PC, GY + 2);
            put(ctx, s, t.x, (BANNER.BW - 1) / 2, top + BANNER.TOP + s.h);
          });
          break;
        case 'statue':
          add(t.x - 17, t.x + 17, 4, (ctx) => put(ctx, S.statue, t.x, 16, GY + 2));
          break;
        case 'dock':
          dockX0 = t.x0;
          add(t.x0, t.x1, 4, (ctx) => {
            const x = K.sx(t.x0);
            ctx.globalCompositeOperation = 'multiply';
            ctx.drawImage(S.dockShade, x, GY + 5);
            ctx.globalCompositeOperation = 'source-over';
            ctx.drawImage(S.dock.r, x, S.dockY0);
          });
          break;
      }
    }
    objs.sort((a, b) => a.z - b.z);
    // conejos en cada pradera
    rabbits.length = 0;
    for (const z of K.MAP.zones) {
      if (z.type !== 'meadow') continue;
      const n = z.x1 - z.x0 > 300 ? 6 : 5;
      for (let i = 0; i < n; i++) {
        rabbits.push({
          zx0: z.x0 + 6, zx1: z.x1 - 6, x: z.x0 + 20 + ((i + rr() * 0.8) / n) * (z.x1 - z.x0 - 40),
          y: GY + 1 + Math.floor(rr() * 3), dir: rr() < 0.5 ? -1 : 1, st: 'idle', t: rr() * 3, k: 0, jy: 0,
          hx0: 0, hx1: 0, dur: 0.3, hh: 3, flee: 0, nib: 0,
        });
      }
    }
  }
  const sparkSrc = [];

  function drawFarm(ctx, t) {
    const sx = t.streamX;
    // campos labrados
    FIELDS.forEach((f, i) => { if (K.sx(f[1]) > -4 && K.sx(f[0]) < K.W + 4) ctx.drawImage(S.fields[i].r, K.sx(f[0]), GY); });
    // arroyo, cascada y puentecillo
    put(ctx, S.stream[frame(8, 5)], sx, S.streamCX, WY + 1);
    put(ctx, S.bridge, sx, 8, GY + 4);
    // trigo que se mece con el viento (ola que recorre el campo)
    const wind = U.clamp(K.env.wind, 0, 1), tt = K.t;
    for (const f of FIELDS) {
      if (K.sx(f[1]) < -12 || K.sx(f[0]) > K.W + 12) continue;
      let v = 0;
      for (let x = f[0] + 1; x < f[1] - 8; x += 5) {
        const wave = 0.5 + 0.5 * Math.sin(tt * 2.4 - x * 0.07);
        const lean = U.clamp(Math.round(wind * (0.6 + wave * 2.4)), 0, 3);
        const s = S.wheat[(v++ + (x >> 3)) & 1][lean];
        ctx.drawImage(s.r, K.sx(x), GY + 3 - s.h);
      }
    }
  }

  // ------------------------------------------------------------------ fauna
  function hop(b, dist, dur, hh) {
    let to = b.x + b.dir * dist;
    if (to < b.zx0 || to > b.zx1) { b.dir = -b.dir; to = b.x + b.dir * dist; }
    b.st = 'hop'; b.k = 0; b.hx0 = b.x; b.hx1 = U.clamp(to, b.zx0, b.zx1); b.dur = dur; b.hh = hh;
  }
  function updateRabbit(b, dt) {
    const p = K.player, dist = p ? Math.abs(p.x - b.x) : 1e9;
    if (b.st === 'hidden') {
      b.t -= dt;
      if (b.t <= 0 && dist > 120) {
        b.x = U.lerp(b.zx0 + 10, b.zx1 - 10, rr()); b.st = 'idle'; b.t = 1 + rr() * 2;
        if (p && Math.abs(p.x - b.x) < 90) b.st = 'hidden';
      }
      return;
    }
    if (b.st === 'hop') {
      b.k += dt / b.dur;
      const k = Math.min(1, b.k);
      b.x = U.lerp(b.hx0, b.hx1, k); b.jy = -Math.sin(Math.PI * k) * b.hh;
      if (k >= 1) {
        b.st = 'idle'; b.jy = 0; b.t = 0.6 + rr() * 2.8;
        if (b.flee > 0) b.t = 0.02;
      }
      return;
    }
    b.flee = Math.max(0, b.flee - dt);
    b.nib = Math.max(0, b.nib - dt);
    if (p && dist < 40) {
      // huye: si está acorralado contra el borde de la pradera, se esconde en la madriguera
      b.dir = p.x > b.x ? -1 : 1; b.flee = 1.4;
      const room = b.dir < 0 ? b.x - b.zx0 : b.zx1 - b.x;
      if (room < 10) { b.st = 'hidden'; b.t = 3 + rr() * 4; return; }
      hop(b, 11 + rr() * 5, 0.2, 4);
      return;
    }
    b.t -= dt;
    if (b.t <= 0) {
      if (b.flee > 0 && dist < 90) { hop(b, 11 + rr() * 5, 0.2, 4); return; }
      const r = rr();
      if (r < 0.5) { if (rr() < 0.4) b.dir = -b.dir; hop(b, 4 + rr() * 5, 0.26, 2); }
      else if (r < 0.8) { b.nib = 0.4 + rr() * 0.8; b.t = 0.8 + rr() * 2; }
      else b.t = 0.8 + rr() * 2.5;
    }
  }
  function drawRabbit(ctx, b) {
    if (b.st === 'hidden') return;
    let f = 0;
    if (b.st === 'hop') f = b.k < 0.55 ? 2 : 3;
    else if (b.nib > 0) f = Math.floor(K.t * 6) & 1;
    put(ctx, S.rabbit[f], b.x, 5, Math.round(b.y + b.jy), b.dir);
  }

  // ------------------------------------------------------------------ chispas de las fogatas
  function updateSparks(dt) {
    const camC = K.camX + K.W / 2;
    for (const s of sparkSrc) {
      if (Math.abs(s.x - camC) > K.W) continue;
      s.acc = (s.acc || 0) + dt * s.rate;
      while (s.acc >= 1 && sparks.length < 60) {
        s.acc -= 1;
        sparks.push({ x: s.x + (rr() - 0.5) * s.spread * 2, y: s.y + rr() * 6, vx: (rr() - 0.5) * 6, vy: -(s.vy * (0.6 + rr() * 0.8)), life: 0, max: 0.7 + rr() * 1.3, ph: rr() * 6 });
      }
      if (s.acc >= 1) s.acc = 0;
    }
    const wind = K.env.wind;
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life >= s.max) { sparks.splice(i, 1); continue; }
      s.x += (s.vx + wind * 9 + Math.sin(s.life * 7 + s.ph) * 6) * dt;
      s.y += s.vy * dt; s.vy *= 1 - dt * 0.6;
    }
  }
  function drawSparks(ctx) {
    for (const s of sparks) {
      const u = s.life / s.max, x = K.sx(s.x), y = Math.round(s.y);
      if (x < -1 || x > K.W) continue;
      ctx.globalAlpha = u < 0.7 ? 1 : (1 - u) / 0.3;
      ctx.fillStyle = u < 0.25 ? '#FFF1B8' : u < 0.55 ? '#FFB347' : '#E0602C';
      ctx.fillRect(x, y, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------ vista de depuración (?view=props)
  K.views.props = (ctx) => {
    let x = 4, y = 4, rowH = 0;
    const show = (s) => {
      if (x + s.w > K.W - 4) { x = 4; y += rowH + 4; rowH = 0; }
      ctx.drawImage(s.r, x, y); x += s.w + 4; rowH = Math.max(rowH, s.h);
    };
    [S.portal, S.portalSwirl[0], S.tent, S.vagStand[0], S.vagStand[1], S.vagSit[0], S.vagSit[1], S.seatLog,
      S.woodWall, S.tower[0], S.tower[1], S.stoneWall[0], S.stoneWall[1], S.torch, S.shopHammer, S.shopBow,
      S.bannerPole, S.statue].forEach(show);
    S.torchFlame.forEach(show); S.fireFlame.forEach(show); show(S.fireBack); show(S.fireFront);
    S.campFlame.forEach(show); show(S.campBack); show(S.campFront);
    S.banner.forEach((l) => l.forEach(show));
    S.rabbit.forEach(show); S.wheat.forEach((v) => v.forEach(show)); S.stream.forEach(show); show(S.bridge);
  };

  K.register('props', {
    order: 11,
    init() {
      buildPortal(); buildTorch(); buildCampfire(); buildTent(); buildVagrants(); buildWoodWall();
      S.tower = [buildTower(0), buildTower(1)];
      S.stoneWall = [buildStoneWall(41), buildStoneWall(58)];
      S.shopHammer = buildShop('hammer'); S.shopBow = buildShop('bow');
      buildBanner(); buildStatue(); buildDock(152); buildFarm(); buildRabbits();
      sparkSrc.length = 0;
      layout();
      for (const b of rabbits) b.t = rr() * 2;
    },
    update(dt) {
      for (const L of lights) K.lights.push(L);
      bannerPh += dt * (2.5 + 7 * U.clamp(K.env.wind, 0, 1));
      updateSparks(dt);
      for (const b of rabbits) updateRabbit(b, dt);
    },
    drawBack(ctx) {
      const W = K.W;
      for (const o of objs) {
        if (K.sx(o.x1) < -4 || K.sx(o.x0) > W + 4) continue;
        o.draw(ctx);
      }
      for (const b of rabbits) { const x = K.sx(b.x); if (x > -12 && x < W + 12) drawRabbit(ctx, b); }
      drawSparks(ctx);
    },
    // Parte sumergida del muelle: va después del agua (tapa el reflejo) y, como la oscuridad ya se aplicó,
    // se multiplica por K.env.mulColor.
    drawOverlay(ctx) {
      if (dockX0 === null || !S.dockLow) return;
      const x = K.sx(dockX0);
      if (x >= K.W || x + S.dockLow.width <= 0) return;
      const m = K.env.mulColor, f = Math.floor(K.t * 5) % 3;
      ctx.globalAlpha = 0.3; ctx.drawImage(U.multiplyTint(S.dockRefl[f], m), x, WY);
      ctx.globalAlpha = 1; ctx.drawImage(U.multiplyTint(S.dockLow, m), x, WY);
      ctx.globalAlpha = 0.5; ctx.drawImage(U.multiplyTint(S.dockRip[f], m), x, WY);
      ctx.globalAlpha = 1;
    },
  });
})(window.K);

</script>
<script>
/* src/20_horse.js */
// 20_horse.js — caballo y monarca: estado, estamina, marcha procedural, animaciones y efectos.
(function (K) {
  const U = K.util, C = K.CONFIG, P = K.params;
  const GY = K.GROUND_Y;
  const RY = K.royal;

  // ================================================================ paletas
  // Pelajes por tabla: las matrices usan letras y cada pelaje pone sus colores.
  // L luz, B base, S sombra, D sombra profunda, N hocico, E ojo, M/m/K crin y cola, W/w calcetín, H casco.
  const COATS = {
    gray: {
      L: '#ADAEB7', B: '#8A8A94', S: '#5E5F6E', D: '#464758', N: '#61616E', E: '#16151B',
      M: '#3B3A44', m: '#57565F', K: '#27262E', W: '#D8D4CC', w: '#A7A39C', H: '#3A3433',
    },
    chestnut: {
      L: '#96665F', B: '#7B4E53', S: '#623128', D: '#47221C', N: '#52302A', E: '#170D0B',
      M: '#462823', m: '#673F30', K: '#2B1512', W: '#F0D8CE', w: '#C5A99F', H: '#382622',
    },
  };
  // Monarca: corona g/y/o, cara f/F/h/k, túnica t/T/u, pierna y bota p/P/b, capa c/C/v.
  const ROYAL = {
    g: '#EB9B36', y: '#FFD37C', o: '#A65C1E',
    f: RY.skin, F: U.shade(RY.skin, 0.8), h: '#4A2F24', k: '#231918',
    t: '#5F4FA0', T: '#433779', u: '#7C6DC2',
    p: '#EEE9D6', P: '#BDB6A0', b: '#3A2A25',
    c: RY.cape[0], C: RY.cape[1], v: U.lerpColor(RY.cape[0], '#FFFFFF', 0.2),
  };

  // ================================================================ matrices (coords locales)
  // Origen = centro del caballo sobre GROUND_Y, mirando a la derecha. ax/ay = esquina sup-izq.
  const part = (ax, ay, rows) => ({ ax, ay, rows });
  const pad = (rows) => { const w = Math.max(...rows.map((r) => r.length)); return rows.map((r) => r.padEnd(w, '.')); };

  // Tronco en barril: anca y hombro como masas redondas (luz arriba, línea de sombra delante del muslo y tras la espalda).
  const BODY = part(-15, -23, [
    '....LLLLLL',
    '..LLLLLLLLLLLLLLLLLLLLL',
    '.LLLLLLLBBBBBBBBBBSBBBBL',
    'BLLLLLBBBBSBBBBBBBSBBBLLB',
    'BBLLLBBBBSBBBBBBBBSBBBLBBB',
    'SBBBBBBBSBBBBBBBBSBBBBBBBB',
    'SBBBBBBSBBBBBBBBBSBBBBBBBS',
    'SBBBBBBSBBBBBBBBSBBBBBBBBS',
    'SBBBBBSBBBSSSSSSSBBBBBBBSS',
    '.SBBBBSSSSSSSSSSSBBBBBBSS',
    '.DSBBSSSSSSSSSSSSSBBBBSD',
    '..DSBBS.DDDDDDDDD.SBBSD',
    '...DSBS...........SBBS',
  ]);
  // Cuello grueso y arqueado; la franja clara bajo la crin marca la luz cenital.
  const NECK = part(1, -28, [
    '..........BBBS',
    '........BBBBBS',
    '......BBBBBBBS',
    '....BBBBBBLLLS',
    '..BBBBBBLLBBSS',
    '.BBBBBLLBBBBSS',
    '.BBBLLBBBBBBSS',
    '.BLLBBBBBBBBSS',
    '.LBBBBBBBBBSS',
    '.BBBBBBBBBBSS',
    '..BBBBBBBBSS',
    '...BBBBBBBSS',
    '....BBBBBSS',
    '.....BBBBSS',
    '......SSSS',
  ]);
  // Cabeza grande: frente clara, carrillo redondo, hocico oscuro, ojo de 1 px bajo el copete.
  const HEAD = part(10, -30, [
    '....L',
    '...SBL',
    '..MSBB',
    '..MBMML',
    '..BLmML',
    '.BBLBMLL',
    '.BBEBBLL',
    '.BBBBBBLL',
    '.SBBBBBBL',
    '.SSBBBBBBL',
    '..SSBBBBBLL',
    '...SSSBBBBL',
    '.....DSNNNN',
    '......DNNDN',
    '......DDNNN',
    '........DD',
  ]);
  // Pastando: cuello en arco que baja hasta el suelo y cabeza casi vertical.
  const NECK_LOW = part(1, -25, [
    '....BB',
    '..BBBBBBB',
    '.BBBBBBBBB',
    '.BBBBBBBBBB',
    '.BBBBBBBBBBB',
    '.BBBLLLLBBBB',
    '.BLLBBBBLLBBB',
    '..BBBBBBBBLLB',
    '...SBBBBBBBBLL',
    '....SBBBBBBBBB',
    '.....SSBBBBBBBL',
    '.......SSBBBBBB',
    '.........SSBBBB',
    '...........SBBB',
    '............SBB',
  ]);
  const HEAD_LOW = part(12, -14, [
    '...L',
    '..SBL',
    '.MMBBL',
    '.MmMBL',
    'BBMBBBL',
    'SBEBBBL',
    'SBBBBBL',
    '.SBBBBB',
    '.SSBBBL',
    '..SBBBB',
    '..SSBBB',
    '...DNNN',
    '...DNNN',
    '....DND',
  ]);
  const KING = part(-4, -41, [
    '..y.y.y',
    '..gygyg',
    '..ogggo',
    '..hffff',
    '..hffkf',
    '..hFffff',
    '...FFFF',
    '...Ttu',
    '..Ttuut',
    '..Tttuu',
    '..Ttttu',
    '..TttTt',
    '..TttTtt',
    '..TtttTtf',
    '..Tttt',
    '..TTtt',
    '..Tooo',
    '.TTtttt',
    '.TTTtttt',
  ]);
  // Variante inclinada al galope: cabeza y corona 1 px hacia delante.
  const KING_LEAN = part(-4, -41, KING.rows.map((r, i) => (i < 7 ? '.' + r : r)));
  const LEG = part(-1, -23, [
    '.ppp',
    '.pppp',
    '.PPPp',
    '...Pp',
    '...Pp',
    '...bb',
    '...bb',
    '...bbb',
    '...ooo',
  ]);
  const EYE = [13, -24], EYE_LOW = [14, -9];       // para el parpadeo
  const HAND = [5, -28], BIT = [16, -17], BIT_LOW = [15, -3];

  // ================================================================ rejilla y rasterizado
  function grid(w, h) {
    const a = Array.from({ length: h }, () => new Array(w).fill('.'));
    return {
      w, h,
      set(x, y, ch) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < w && y < h) a[y][x] = ch; },
      rows() { return a.map((r) => r.join('')); },
    };
  }
  // Relleno de polígono por filas (centros de píxel), sin antialiasing.
  function polyFill(g, pts, ch) {
    let y0 = Infinity, y1 = -Infinity;
    for (const q of pts) { y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
      const yc = y + 0.5, xs = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + ((yc - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
      }
      xs.sort((m, n) => m - n);
      for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) g.set(x, y, ch);
    }
  }

  // ---- Crin: mechones sobre la línea de la cruz; con viento se levantan y se van hacia atrás.
  const CREST = [[1, -22], [2, -23], [3, -24], [4, -24], [5, -25], [6, -25], [7, -26], [8, -26], [9, -27], [10, -27], [11, -28], [12, -28], [13, -28]];
  const CREST_LOW = [[2, -23], [3, -24], [4, -24], [5, -25], [6, -25], [7, -24], [8, -24], [9, -24], [10, -23], [11, -22], [12, -21], [13, -19], [14, -17]];
  const LOCK = [2, 1, 1, 2, 3, 1, 1, 2, 1, 0, 1, 0, 0]; // largo extra de cada mechón
  function manePart(crest, lift, ph) {
    const gx = -4, gy = -36, g = grid(22, 22);
    crest.forEach(([x, cy], i) => {
      const up = lift > 0 ? Math.max(1, Math.round(lift * (1.8 + Math.sin(x * 1.3 + ph) * 1.3))) : 0;
      const ext = lift > 0 ? (LOCK[i] >> 1) : LOCK[i];
      const top = cy - 1 - up, bot = cy + 1 + ext;
      for (let y = top; y <= bot; y++) {
        const lean = y < cy - 1 ? Math.round((cy - 1 - y) * 0.9) : 0; // al viento las puntas van hacia atrás
        const ch = y === top ? 'm' : y === bot && ext >= 2 ? 'K' : (y === top + 1 && (i & 1)) ? 'm' : 'M';
        g.set(x - lean - gx, y - gy, ch);
      }
    });
    return part(gx, gy, g.rows());
  }

  // ---- Cola: línea central que cae desde el nacimiento; ancho variable y mechones claro/oscuro.
  function tailPart(lift, swish, ph) {
    const gx = -28, gy = -28, g = grid(20, 32);
    let x = -14, y = -21;
    const th0 = U.lerp(1.5, 2.25, lift), th1 = U.lerp(0.1, 0.8, lift);
    const len = U.lerp(19, 18, lift), step = 0.3, n = Math.ceil(len / step);
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const th = th1 + (th0 - th1) * Math.pow(1 - t, U.lerp(5, 1.7, lift)) + swish * Math.sin(Math.PI * t) * 0.5 + lift * Math.sin(t * 8 - ph) * 0.32 * t;
      const dx = -Math.sin(th), dy = Math.cos(th), nx = dy, ny = -dx;
      // Fino en el nacimiento, abundante abajo y con la punta abierta.
      const w = t < 0.08 ? 2 : Math.max(2, Math.round(2.2 + 3 * Math.sin(Math.PI * Math.min(1, 0.1 + t * 0.95))));
      for (let j = 0; j < w; j++) {
        const off = j - (w - 1) / 2;
        const ch = j === 0 ? 'm' : j === w - 1 ? 'K' : (j === 2 && ((i >> 2) & 1)) ? 'm' : 'M';
        g.set(x + nx * off - gx, y + ny * off - gy, ch);
      }
      x += dx * step; y += dy * step;
    }
    return part(gx, gy, g.rows());
  }
  // Variantes: [alzada, latigazo, fase]. 0 reposo, 1-2 latigazo, 3-5 paso, 6-8 galope.
  const TAIL_V = [[0, 0.15, 0], [0, 0.8, 0], [0, -0.45, 0], [0.25, -0.15, 0], [0.25, 0.1, 0], [0.25, 0.3, 0], [1, 0, 0], [1, 0, 2.1], [1, 0, 4.2]];

  // ---- Capa: polígono entre la pose en reposo (cae sobre la grupa) y al viento; pliegues radiales.
  const CAPE_REST = [[-1, -34], [-3, -34.5], [-5, -31.5], [-7.5, -28], [-10, -25.5], [-12.5, -23.5], [-14, -21], [-13.5, -18.5], [-10.5, -18], [-7.5, -18.5], [-4.5, -19], [-2.5, -23], [-1, -30]];
  const CAPE_FLY = [[-1, -34], [-3, -35], [-7, -35], [-11, -34.5], [-14.5, -33.5], [-17.5, -32.5], [-18.5, -30.5], [-15.5, -29], [-12, -27.5], [-8.5, -26.5], [-5, -25.5], [-2.5, -25], [-1, -30]];
  function capePart(a, ph) {
    const gx = -23, gy = -38, W = 24, H = 27, g = grid(W, H);
    const pts = CAPE_REST.map((q, i) => {
      const r = CAPE_FLY[i];
      let x = U.lerp(q[0], r[0], a), y = U.lerp(q[1], r[1], a);
      if (i >= 4 && i <= 10) { const s = Math.sin(ph * 2.1 + i * 1.3) * (0.3 + a * 1.1); y += s; x -= s * 0.5 * a; }
      return [x - gx, y - gy];
    });
    polyFill(g, pts, 'c');
    const rows = g.rows(), out = rows.map((r) => r.split(''));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (rows[y][x] !== 'c') continue;
      const up = y > 0 ? rows[y - 1][x] : '.', dn = y < H - 1 ? rows[y + 1][x] : '.';
      const lx = x + gx + 2, ly = y + gy + 34; // relativo al hombro
      const fold = Math.sin(Math.atan2(ly, -lx) * 10 + ph * 0.8 + Math.hypot(lx, ly) * 0.15);
      out[y][x] = up === '.' ? 'v' : dn === '.' ? 'C' : fold > 0.55 ? 'C' : 'c';
    }
    return part(gx, gy, out.map((r) => r.join('')));
  }

  // ================================================================ juegos de sprites por pelaje
  const sets = {};
  function setFor(coat) {
    coat = COATS[coat] ? coat : 'gray';
    if (sets[coat]) return sets[coat];
    const pal = Object.assign({}, COATS[coat], ROYAL);
    const mk = (pt, name) => ({ s: U.sprite(pad(pt.rows), pal, 'horse.' + name), ax: pt.ax, ay: pt.ay });
    const st = { pal, rear: [] };
    st.body = mk(BODY, 'body');
    st.neck = mk(NECK, 'neck');
    st.head = mk(HEAD, 'head');
    st.neckLow = mk(NECK_LOW, 'neckLow');
    st.headLow = mk(HEAD_LOW, 'headLow');
    st.king = mk(KING, 'king');
    st.kingLean = mk(KING_LEAN, 'kingLean');
    st.leg = mk(LEG, 'leg');
    st.mane = [mk(manePart(CREST, 0, 0), 'mane0'), mk(manePart(CREST, 1, 0), 'mane1'), mk(manePart(CREST, 1, 2.6), 'mane2')];
    st.maneLow = mk(manePart(CREST_LOW, 0, 0), 'maneLow');
    st.tail = TAIL_V.map((v, i) => mk(tailPart(v[0], v[1], v[2]), 'tail' + i));
    st.cape = [];
    [0, 0.3, 0.62, 1].forEach((a) => { for (let k = 0; k < 3; k++) st.cape.push(mk(capePart(a, k * 2.1), 'cape')); });
    // Colores de patas: [0] cercanas, [1] lejanas (más oscuras).
    st.legCol = [
      { ub: pal.S, uf: pal.B, sb: pal.w, sf: pal.W, hoof: pal.H },
      { ub: pal.D, uf: pal.S, sb: U.shade(pal.w, 0.78), sf: pal.w, hoof: pal.K },
    ];
    return (sets[coat] = st);
  }

  // ================================================================ dibujo en coords locales
  let OX = 0, OY = 0, DR = 1; // origen en pantalla y dirección del dibujo en curso
  const at = (x, y, d) => { OX = x; OY = y; DR = d; };
  function spr(ctx, pt, dx = 0, dy = 0) {
    const s = pt.s;
    ctx.drawImage(DR > 0 ? s.r : s.l, DR > 0 ? OX + pt.ax + dx : OX - pt.ax - dx - s.w, OY + pt.ay + dy);
  }
  function box(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(DR > 0 ? OX + x : OX - x - w, OY + y, w, h); }
  // Sprite partido en dos mitades con distinto desplazamiento vertical (cabeceo del cuerpo).
  function sprSplit(ctx, pt, splitX, dyBack, dyFront) {
    const s = pt.s, cut = splitX - pt.ax, y = OY + pt.ay;
    if (DR > 0) {
      ctx.drawImage(s.r, 0, 0, cut, s.h, OX + pt.ax, y + dyBack, cut, s.h);
      ctx.drawImage(s.r, cut, 0, s.w - cut, s.h, OX + pt.ax + cut, y + dyFront, s.w - cut, s.h);
    } else {
      ctx.drawImage(s.l, s.w - cut, 0, cut, s.h, OX - pt.ax - cut, y + dyBack, cut, s.h);
      ctx.drawImage(s.l, 0, 0, s.w - cut, s.h, OX - pt.ax - s.w, y + dyFront, s.w - cut, s.h);
    }
  }
  function line(ctx, x0, y0, x1, y1, col) {
    ctx.fillStyle = col;
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    for (let n = 0; n < 200; n++) {
      ctx.fillRect(DR > 0 ? OX + x0 : OX - x0 - 1, OY + y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
  }

  // ================================================================ patas (IK de dos segmentos)
  // rx/ry = raíz (columna izquierda de la pata de 2 px); bend +1 rodilla adelante, -1 corvejón atrás.
  const LEGS = {
    HF: { rx: -13, ry: -11, l1: 5.8, l2: 6, bend: -1, far: 1 },
    FF: { rx: 3, ry: -11, l1: 5.5, l2: 5.6, bend: 1, far: 1 },
    HN: { rx: -11, ry: -11, l1: 5.8, l2: 6, bend: -1, far: 0 },
    FN: { rx: 5, ry: -11, l1: 5.5, l2: 5.6, bend: 1, far: 0 },
  };
  function ik(rx, ry, fx, fy, l1, l2, bend) {
    const dx = fx - rx, dy = fy - ry, d = Math.hypot(dx, dy);
    if (d >= l1 + l2 - 0.01 || d < 0.01) { const k = l1 / (l1 + l2); return [rx + dx * k, ry + dy * k]; }
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ux = dx / d, uy = dy / d;
    return [rx + ux * a + uy * h * bend, ry + uy * a - ux * h * bend];
  }
  // Segmento de 2 px: columna trasera/delantera (o fila inferior/superior si es casi horizontal).
  // thick = píxeles iniciales con una tercera columna de músculo (delante en la mano, detrás en la pata).
  function seg(ctx, ax, ay, bx, by, cb, cf, sock, sb, sf, thick, side) {
    const dx = bx - ax, dy = by - ay, n = Math.max(1, Math.round(Math.max(Math.abs(dx), Math.abs(dy))));
    const vert = Math.abs(dy) >= Math.abs(dx);
    for (let i = 0; i <= n; i++) {
      const x = Math.round(ax + (dx * i) / n), y = Math.round(ay + (dy * i) / n);
      const s = i > n - sock, b = s ? sb : cb, f = s ? sf : cf;
      if (vert) {
        box(ctx, x, y, 1, 1, b); box(ctx, x + 1, y, 1, 1, f);
        if (i < thick) box(ctx, side > 0 ? x + 2 : x - 1, y, 1, 1, side > 0 ? f : b);
      } else { box(ctx, x, y, 1, 1, f); box(ctx, x, y + 1, 1, 1, b); }
    }
  }
  function drawLeg(ctx, st, key, pose, dyRoot) {
    const L = LEGS[key], c = st.legCol[L.far];
    const ry = L.ry + dyRoot, fx = L.rx + pose[0], fy = -pose[1];
    const [jx, jy] = ik(L.rx, ry, fx, fy, L.l1, L.l2, L.bend);
    seg(ctx, L.rx, ry, jx, jy, c.ub, c.uf, 0, 0, 0, L.bend > 0 ? 3 : 4, L.bend);
    seg(ctx, jx, jy, fx, fy, c.ub, c.uf, 4, c.sb, c.sf, 0, 0);
    const hx = Math.round(fx), hy = Math.round(fy);
    if (Math.abs(fx - jx) > Math.abs(fy - jy) * 1.3) box(ctx, hx - (fx < jx ? 1 : 0), hy, 2, 2, c.hoof); // casco doblado
    else { box(ctx, hx, hy + 1, 2, 1, c.hoof); box(ctx, hx, hy + 2, 3, 1, c.hoof); }
  }

  // ================================================================ tablas de marcha
  // [dx del casco respecto a la raíz, alzada] por frame propio de la pata (0 = apoyo recién puesto).
  // Paso: 4 frames de apoyo (4 px/frame = zancada 32) y 4 de vuelo; la mano dobla la rodilla al alzarse.
  const WALK_F = [[6, 0], [2, 0], [-2, 0], [-6, 0], [-5, 3], [-1, 4], [3, 3], [6, 1]];
  const WALK_H = [[6, 0], [2, 0], [-2, 0], [-6, 0], [-4, 2], [-1, 3], [3, 2], [5, 1]];
  const GAL_F = [[5.4, 0], [0, 0], [-5.4, 0], [-9, 2], [-7, 6], [-1, 8], [7, 5], [10, 2]];
  const GAL_H = [[5.4, 0], [0, 0], [-5.4, 0], [-9, 2], [-6, 5], [0, 6], [6, 4], [9, 1]];
  const OFF = { walk: { HN: 0, FN: 2, HF: 4, FF: 6 }, gallop: { HN: 0, HF: 1, FF: 3, FN: 4 } };
  const STRIDE_W = 32, STRIDE_G = 43;
  const WALK_DY = [0, -1, -1, 0, 0, -1, -1, 0], WALK_HEAD = [0, 0, 1, 1, 0, 0, 1, 1];
  const GAL_DR = [0, 1, 1, 0, 0, -1, -1, -1], GAL_DF = [-1, -1, 0, 0, 1, 1, 0, -1];
  const GAL_HEAD = [0, 0, 1, 1, 0, 0, -1, -1], GAL_K = [0, 1, 0, 0, 0, 1, 0, 0];
  const IDLE_LEGS = { HF: [-1, 0], FF: [-1, 0], HN: [1, 0], FN: [1, 0] };
  const GRAZE_LEGS = { HF: [-1, 0], FF: [-3, 0], HN: [1, 0], FN: [2, 0] };
  // Encabritarse: ángulo de cada frame, secuencia (10 fps) y manos recogidas.
  const REAR_ANG = [15, 25, 35, 30, 20];
  const REAR_SEQ = [0, 1, 2, 2, 2, 3, 4];
  const REAR_LEN = REAR_SEQ.length / 10;
  const REAR_FORE = [
    { FN: [-2, 6], FF: [0, 4] }, { FN: [-1, 8], FF: [-3, 6] }, { FN: [1, 8], FF: [-2, 8] },
    { FN: [-1, 7], FF: [1, 7] }, { FN: [-2, 5], FF: [-1, 6] },
  ];
  const REAR_HIND = { HN: [2, 0], HF: [0, 0] };

  // slide = px que el cuerpo ya avanzó dentro del frame: los cascos apoyados retroceden lo mismo y quedan quietos en el mundo.
  function gaitLegs(TF, TH, off, f, slide = 0) {
    const L = {};
    for (const k in LEGS) {
      const q = (k[0] === 'F' ? TF : TH)[(f - off[k] + 8) & 7];
      L[k] = q[1] === 0 && slide ? [q[0] - slide, 0] : q;
    }
    return L;
  }
  // Pose = todo lo necesario para dibujar un frame (la usan el juego y la hoja de depuración).
  function makePose(anim, f, o = {}) {
    const pz = { anim, f, dyR: 0, dyF: 0, dyN: 0, dyH: 0, dyK: 0, legs: IDLE_LEGS, tail: 0, mane: 0, cape: 0, low: false, blink: !!o.blink, pant: false, lean: false };
    if (anim === 'walk') {
      pz.dyR = pz.dyF = pz.dyK = WALK_DY[f]; pz.dyH = WALK_HEAD[f];
      pz.legs = gaitLegs(WALK_F, WALK_H, OFF.walk, f, o.slide);
      pz.tail = 3 + [1, 2, 2, 1, 1, 0, 0, 1][f]; pz.cape = o.cape ?? 3 + (f >> 1) % 3;
    } else if (anim === 'gallop') {
      pz.dyR = GAL_DR[f]; pz.dyF = GAL_DF[f]; pz.dyH = GAL_HEAD[f]; pz.dyK = GAL_DF[f] + GAL_K[f];
      pz.legs = gaitLegs(GAL_F, GAL_H, OFF.gallop, f, o.slide);
      pz.tail = 6 + (o.tph ?? f % 3); pz.mane = 1 + (o.mph ?? (f >> 1) & 1); pz.cape = o.cape ?? 9 + f % 3; pz.lean = true;
    } else if (anim === 'graze') {
      pz.low = true; pz.dyH = f; pz.legs = GRAZE_LEGS; pz.tail = o.swish ?? 0; pz.cape = o.cape ?? 0;
    } else if (anim === 'pant') {
      pz.dyN = f; pz.dyH = 1 + f; pz.pant = f === 1; pz.cape = o.cape ?? 0;
    } else if (anim === 'idle') {
      pz.tail = o.swish ?? 0; pz.cape = o.cape ?? 0; pz.dyH = o.nod ? 1 : 0; // cabeceo ocasional
    }
    return pz;
  }

  // ================================================================ composición del jinete
  function drawNeckHead(ctx, st, pz) {
    const d = pz.dyF;
    if (pz.low) {
      spr(ctx, st.neckLow, 0, d); spr(ctx, st.maneLow, 0, d); spr(ctx, st.headLow, 0, d + pz.dyH);
      if (pz.blink) box(ctx, EYE_LOW[0], EYE_LOW[1] + d + pz.dyH, 1, 1, st.pal.S);
    } else {
      spr(ctx, st.neck, 0, d + pz.dyN); spr(ctx, st.mane[pz.mane], 0, d + pz.dyN); spr(ctx, st.head, 0, d + pz.dyH);
      if (pz.blink) box(ctx, EYE[0], EYE[1] + d + pz.dyH, 1, 1, st.pal.S);
      if (pz.pant) { box(ctx, 16, -15 + d + pz.dyH, 2, 1, st.pal.E); box(ctx, 18, -14 + d + pz.dyH, 2, 1, st.pal.D); } // boca abierta
    }
  }
  function drawRider(ctx, st, pz) {
    const d = pz.dyK;
    spr(ctx, st.cape[pz.cape], 0, d);
    spr(ctx, pz.lean ? st.kingLean : st.king, 0, d);
    spr(ctx, st.leg, 0, d);
  }
  function drawReins(ctx, st, pz) {
    const b = pz.low ? BIT_LOW : BIT;
    line(ctx, HAND[0], HAND[1] + pz.dyK, b[0], b[1] + pz.dyF + pz.dyH, st.pal.h);
  }
  function drawHorse(ctx, x, y, dir, pz, st) {
    at(x, y, dir);
    if (pz.anim === 'rear') { spr(ctx, rearFrame(st, pz.f)); return; }
    const L = pz.legs;
    drawLeg(ctx, st, 'HF', L.HF, pz.dyR);
    drawLeg(ctx, st, 'FF', L.FF, pz.dyF);
    spr(ctx, st.tail[pz.tail], 0, pz.dyR);
    sprSplit(ctx, st.body, -3, pz.dyR, pz.dyF);
    if (pz.pant) box(ctx, -6, -11 + pz.dyF, 8, 1, st.pal.D); // flancos que se hinchan
    drawLeg(ctx, st, 'HN', L.HN, pz.dyR);
    drawLeg(ctx, st, 'FN', L.FN, pz.dyF);
    drawNeckHead(ctx, st, pz);
    drawRider(ctx, st, pz);
    drawReins(ctx, st, pz);
  }

  // ---- Encabritarse: frames pre-renderizados y rotados con vecino más cercano.
  function blitRot(dst, src, cx, cy, ang, tx, ty) {
    const w = src.width, h = src.height, sd = src.getContext('2d').getImageData(0, 0, w, h).data;
    const tmp = U.canvas(w, h), img = tmp.x.createImageData(w, h), d = img.data;
    const cs = Math.cos(ang), sn = Math.sin(ang);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const X = x + 0.5 - tx, Y = y + 0.5 - ty;
      const sx = Math.floor(X * cs - Y * sn + cx), sy = Math.floor(X * sn + Y * cs + cy);
      if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
      const o = (sy * w + sx) * 4;
      if (sd[o + 3] === 0) continue;
      const q = (y * w + x) * 4;
      d[q] = sd[o]; d[q + 1] = sd[o + 1]; d[q + 2] = sd[o + 2]; d[q + 3] = 255;
    }

  }
  function rearFrame(st, i) {
    if (st.rear[i]) return st.rear[i];
    const ang = (REAR_ANG[i] * Math.PI) / 180, CX = 32, CY = 56, PX = -10, PYv = -11;
    const pz = makePose('idle', 0); pz.legs = Object.assign({}, REAR_HIND, REAR_FORE[i]); pz.mane = 1 + (i & 1); pz.tail = 0; pz.cape = 3 + (i % 3);
    const rot = (x, y, a) => { const cs = Math.cos(a), sn = Math.sin(a), X = x - PX, Y = y - PYv; return [PX + X * cs + Y * sn, PYv - X * sn + Y * cs]; };
    const saveO = [OX, OY, DR];
    // Bloque del caballo (sin patas traseras ni cola), rotado entero sobre la cadera.
    const A = U.canvas(64, 64);
    at(CX, CY, 1);
    drawLeg(A.x, st, 'FF', pz.legs.FF, 0);
    spr(A.x, st.body);
    drawLeg(A.x, st, 'FN', pz.legs.FN, 0);
    drawNeckHead(A.x, st, pz);
    // Jinete: gira menos para mantenerse erguido.
    const B = U.canvas(64, 64);
    drawRider(B.x, st, pz);
    const out = U.canvas(64, 64), o = out.x;
    drawLeg(o, st, 'HF', REAR_HIND.HF, 0);
    const [tx, ty] = rot(-14.5, -20.5, ang);
    spr(o, st.tail[0], Math.round(tx + 14.5), Math.round(ty + 20.5));
    blitRot(o, A.c, CX + PX, CY + PYv, ang, CX + PX, CY + PYv);
    drawLeg(o, st, 'HN', REAR_HIND.HN, 0);
    const [sx, sy] = rot(0, -22, ang), ak = ang * 0.35;
    blitRot(o, B.c, CX, CY - 22, ak, CX + sx, CY + sy);
    // Riendas: de la mano (girada con el jinete) al bocado (girado con el caballo).
    const hx = HAND[0], hy = HAND[1] + 22;
    const hand = [sx + hx * Math.cos(ak) + hy * Math.sin(ak), sy - hx * Math.sin(ak) + hy * Math.cos(ak)];
    const bit = rot(BIT[0], BIT[1], ang);
    line(o, hand[0], hand[1], bit[0], bit[1], st.pal.h);

  const p = K.player = {
    x: typeof P.x === 'number' ? P.x : 1160, y: GY, dir: P.dir === -1 ? -1 : 1, vx: 0, state: 'idle',
    stamina: typeof P.stamina === 'number' ? U.clamp(P.stamina, 0, 1) : 1,
    boost: typeof P.boost === 'number' ? Math.max(0, P.boost) : 0,
  };
  const LEFT = new Set(['KeyA', 'ArrowLeft']), RIGHT = new Set(['KeyD', 'ArrowRight']);
  // Límite del mundo según la figura real (medida en todas las poses): cola a −28 px y hocico a +20 px

  const EDGE = 30;
  const S = { phase: 0, frame: -1, still: 0, grazeT: -1, rearT: -1, tapDir: 0, tapT: -9, tapGallop: 0, prevWant: false, glow: 0, trailAcc: 0, trailK: 0, pose: makePose('idle', 0) };
  const rng = U.mulberry32((K.seed | 0) + 2020);
  const parts = []; // partículas: polvo, estela y destellos (x del mundo, y de pantalla)
  const DUST = { cobble: '#A39E92', coast: '#C9BB93', farm: '#9C8561' };

  function reward() {
    p.stamina = 1; p.boost = C.boostSeconds; S.glow = 1.6;
    for (let i = 0; i < 18; i++) {
      spawn({ kind: 'spark', x: p.x + (rng() * 40 - 20), y: GY - 4 - rng() * 32, vx: (rng() - 0.5) * 6, vy: -5 - rng() * 9, life: 0.7 + rng() * 0.9, max: 1.6, seed: rng() * 10 });
    }

  function gamePose(st) {
    const t = K.t, o = {}, fixed = P.frame !== undefined ? P.frame | 0 : -1;
    const wind = (K.env && K.env.wind) || 0.3, spd = Math.abs(p.vx);
    o.blink = t % 3.7 < 0.13;

    if (st === 'rear') {

      const d = RIGHT.has(tp.code) ? 1 : LEFT.has(tp.code) ? -1 : 0;
      if (!d) continue;
      if (d === S.tapDir && tp.t - S.tapT < 0.3) { S.tapGallop = d; S.tapDir = 0; } else { S.tapDir = d; S.tapT = tp.t; }
    }
    let dirIn = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (S.tapGallop && dirIn !== S.tapGallop) S.tapGallop = 0;
    let want = dirIn !== 0 && (inp.gallop || S.tapGallop === dirIn);
    if (F) { dirIn = F === 'walk' || F === 'gallop' ? p.dir : 0; want = F === 'gallop'; }

    }

    else if (spd > 0.5) { st = galloping ? 'gallop' : 'walk'; S.still = 0; S.grazeT = -1; }
    else {
      S.still += dt;
      if (F) st = F === 'walk' || F === 'gallop' ? 'idle' : F;

        const ter = K.terrainAt(p.x), grassy = ter === 'meadow' || ter === 'grass';
        const hungry = p.stamina < 1 || p.boost < C.boostSeconds - 0.5;

      for (const k in LEGS) {
        if (((pz.f - OFF.gallop[k] + 8) & 7) !== 0) continue;

      }

      S.trailAcc += dt * TRAIL_RATE;

      }

      const q = parts[i];

    order: 20,

    update,
    drawPlayer(ctx) {

      drawParticles(ctx, true);

  });

  // ================================================================ hoja de depuración (?view=horse)
  K.views.horse = (ctx) => {
    const rng8 = [0, 1, 2, 3, 4, 5, 6, 7];
    ['gray', 'chestnut'].forEach((coat, ci) => {
      const st = setFor(coat);
      const rows = [
        rng8.map((f) => makePose('walk', f)).concat([makePose('idle', 0), makePose('idle', 0, { blink: true, swish: 1 })]),
        rng8.map((f) => makePose('gallop', f)).concat([makePose('graze', 0), makePose('graze', 1)]),
        [makePose('pant', 0), makePose('pant', 1)].concat([0, 1, 2, 3, 4].map((f) => makePose('rear', f)), [makePose('idle', 0, { swish: 2, cape: 2 }), makePose('graze', 0, { swish: 1, blink: true })]),
      ];

    });
  };

<script>
/* src/30_water.js */
// 30_water.js — el río: reflejo invertido de las filas 110–189, ondas "a saltos" a 10 Hz,
// columnas de luz cálida, orilla, destellos de día y peces que saltan.
(function (K) {
  const U = K.util, C = K.CONFIG, P = K.params;
  const W = K.W, WY = K.WATER_Y, WH = K.H - K.WATER_Y; // 80 filas de agua
  const SRC_Y = WY - WH;                                // 110: primera fila que se refleja
  const CW = 16, NCX = W / CW;                          // trozos de 16×1 px, 30 por fila
  const BASE = '#686C53', LIGHT = '#FC8F53';

  // Multiplica un color por otro (lo dibujado tras la oscuridad no queda oscurecido).
  const mul = (hex, m) => { const a = U.rgb(hex), b = U.rgb(m); return U.hex(a[0] * b[0] / 255, a[1] * b[1] / 255, a[2] * b[2] / 255); };

  // ---- Lienzos de trabajo
  const still = U.canvas(W, WH);                  // agua compuesta sin ondas
  const out = still.x.createImageData(W, WH);     // franja final con ondas
  const out32 = new Uint32Array(out.data.buffer);

  // Oscurecimiento hacia abajo: hasta 40 % de negro en bandas de 4 px.
  const bands = U.canvas(W, WH);
  { const nb = WH / 4;
    for (let i = 0; i < nb; i++) { bands.x.fillStyle = `rgba(0,0,0,${(0.4 * i / (nb - 1)).toFixed(3)})`; bands.x.fillRect(0, i * 4, W, 4); } }

  // ---- Columnas de luz: destello vertical hecho de guiones horizontales (uno por fila),
  // núcleo intenso en el centro, bordes escalonados y huecos que crecen hacia abajo.
  function makeColumn(w, h, seed, col) {
    const { c, x } = U.canvas(w, h);
    const img = x.createImageData(w, h), d = img.data, [r, g, b] = U.rgb(col);
    const half = w / 2;
    for (let y = 0; y < h; y++) {
      const v = y / (h - 1);
      const iv = Math.min(1, (y + 2) / 6) * Math.pow(1 - v, 0.75);
      const gap = U.hash(y, 1, seed) < 0.1 + 0.4 * v;      // fila partida por una ola
      const L = half * (1 - 0.5 * v) * (0.5 + 0.5 * U.hash(y, 2, seed)); // media longitud del guion
      const off = w > 8 ? Math.round((U.hash(y, 3, seed) - 0.5) * 2) : 0;
      for (let i = 0; i < w; i++) {
        const e = Math.abs(i + 0.5 - half - off) / Math.max(1, L);
        if (e >= 1) continue;
        let a = iv * (e < 0.34 ? 1 : e < 0.7 ? 0.55 : 0.28);
        if (gap) a *= e < 0.34 ? 0.45 : 0;
        a = Math.round(a * 4) / 4; // 4 escalones de alfa
        if (a <= 0) continue;
        const o = (y * w + i) * 4;
        d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = Math.round(a * 255);
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }
  // 3 variantes de cada columna que se alternan a 10 Hz (brillo "a saltos" aun sin viento).
  const variants = (w, s, col) => [0, 1, 2].map((v) => makeColumn(w, 48, s + v * 101, col));
  const COL_S = variants(8, 11, LIGHT), COL_L = variants(24, 23, LIGHT);
  // Sin columna para las luciérnagas: son de 1 px y ya se ven en el reflejo (filas 110–189);
  // una franja de 8×48 las haría parecer pilares fantasma.
  const COLUMN = { torch: [COL_S, 1], fire: [COL_L, 1], moon: [COL_L, 1], sun: [COL_L, 1] };

  // ---- Tabla de ondas: (dx, dy) por trozo de 16×1, ruido suave con celdas de ~32×4 px.
  const NT = NCX * WH;
  const TX = new Int8Array(NT), TY = new Int8Array(NT), TN = new Float32Array(NT);
  const sparks = []; // destellos de día { x, y, w }
  let tick = -1;
  function buildTable(tk) {
    const env = K.env, t = tk / 10, wind = env.wind, ox = K.camX * 1.5;
    const day = U.clamp(1 - env.darkness / 0.12, 0, 1) * U.clamp((wind - 0.25) / 0.35, 0, 1);
    const sunX = env.sunVis ? env.sunX : -9999;
    sparks.length = 0;
    for (let y = 0; y < WH; y++) {
      const amp = 0.8 + 0.4 * y / (WH - 1); // 50 % mayor al fondo que arriba
      const ax = wind * 6 * amp, ay = wind * 12 * amp;
      const Y1 = (y - t * 5) / 4, Y2 = (y - t * 9) / 3; // deriva vertical lenta
      for (let c = 0; c < NCX; c++) {
        const X = (c * CW + 8 + ox) / 32;
        const n = U.noise2(X + t * 0.04, Y1, 301) * 0.62 + U.noise2(X * 1.3 - t * 0.07, Y2, 302) * 0.38;
        const m = U.noise2(X * 0.9 + 17, Y1 + 5, 303) * 0.62 + U.noise2(X * 1.4 + 9, Y2 - 3, 304) * 0.38;
        const k = y * NCX + c;
        TX[k] = Math.round(U.clamp((n - 0.5) * 3, -1, 1) * ax);
        TY[k] = Math.round(U.clamp((m - 0.5) * 3, -1, 1) * ay);
        TN[k] = n;
        // Destellos de día donde el ruido supera un umbral; se agrupan bajo el sol.
        if (day > 0 && y > 3) {
          const cx = c * CW + 8, q = (cx - sunX) / 56, near = Math.exp(-q * q);
          if (n > 0.75 - 0.13 * near && U.hash(c, y, tk) < 0.04 + 0.26 * near) {
            const h = U.hash(c, y, tk + 7);
            sparks.push({ x: c * CW + Math.floor(h * 13), y, w: 2 + (h > 0.6 ? 1 : 0) });
          }
        }
      }
    }
  }

  // ---- Peces: sprites pequeños (arriba, plano, abajo), salpicaduras y ondas.
  const FP = { d: '#3F4C47', b: '#7E8C81', l: '#C4CABB', t: '#5B6961', e: '#9FAB9F', k: '#262D2A' };
  const UP = ['........be', '......dkbl', '....ddbbl.', '...dbbl...', 't.dbl.....', '.tt.......'];
  const FISH = {
    up: U.sprite(UP, FP, 'pez arriba'),
    flat: U.sprite(['...dd.....', 't.ddddddd.', '.tbbbbbkbe', 't..lllll..'], FP, 'pez plano'),
    down: U.sprite(UP.slice().reverse(), Object.assign({}, FP, { d: FP.l, l: FP.d }), 'pez abajo'),
  };
  const SP = { w: '#E2E7DC', s: '#A9B8AE' };
  const SPLASH = [
    ['...........', '.....w.....', '....wsw....', '...ws.sw...', '..sss.sss..'],
    ['...w...w...', '...........', '..w.....w..', '.ws.....sw.', 'ss.......ss'],
    ['...........', '.w.......w.', '...........', 'w.........w', 's.........s'],
  ].map((rows, i) => U.sprite(rows, SP, 'salpicadura ' + i));
  // Ondas en la superficie: elipses planas 1 px que se abren.
  const RIPPLE = [3, 5, 7, 9, 11].map((rx) => U.paint(rx * 2 + 1, 3, (x, w) => {
    x.fillStyle = '#C9D0C4';
    x.fillRect(2, 0, w - 4, 1); x.fillRect(0, 1, 2, 1); x.fillRect(w - 2, 1, 2, 1); x.fillRect(2, 2, w - 4, 1);
  }));
  const FXW = 64, FXH = 44, OX = 32, OY = 26; // lienzo del pez; (OX, OY) = punto de la superficie
  const fx = U.canvas(FXW, FXH);
  const fishes = [];
  const rnd = U.mulberry32((K.seed ^ 0x51f15e) >>> 0);

  // El salto nunca sube por encima de la orilla (y - h ≥ WY + 4).
  function spawnFish(x, y, age) {
    const h = Math.min(7 + Math.floor(rnd() * 6), y - WY - 4);

  }

      g.globalAlpha = 0.3; g.setTransform(1, 0, 0, -1, 0, 2 * OY + 1);

  K.register('water', {
    order: 30,
    update(dt) {
      for (const f of fishes) f.age += dt;
      for (let i = fishes.length - 1; i >= 0; i--) if (fishes[i].age > fishes[i].dur + 1.1) fishes.splice(i, 1);
      if (forced) {
        if (K.t >= forced.t) {
          const px = P.fishx ?? (K.player ? K.player.x + 70 : K.camX + 300);

      }

      if (nextFish <= 0) {
        nextFish = 3 + rnd() * 6;
        spawnFish(K.camX + 40 + rnd() * (W - 80), WY + 14 + Math.floor(rnd() * 42), 0);
      }
    },
    drawWater(ctx) {
      const env = K.env;
      const base = U.lerpColor(BASE, env.darkColor, env.darkness);
      // 1. Agua sin ondas: color base, bandas, reflejo volteado y columnas de luz.
      const s = still.x;
      s.setTransform(1, 0, 0, 1, 0, 0);
      s.globalCompositeOperation = 'source-over'; s.globalAlpha = 1;
      s.fillStyle = base; s.fillRect(0, 0, W, WH);
      s.drawImage(bands.c, 0, 0);
      s.globalAlpha = C.reflectivity;
      s.setTransform(1, 0, 0, -1, 0, WH); // la fila 189 queda pegada a la 190
      s.drawImage(K.buf, 0, SRC_Y, W, WH, 0, 0, W, WH);
      s.setTransform(1, 0, 0, 1, 0, 0);
      const k = env.darkness * 0.8 * Math.min(1, env.wind * 10);
      const tk = Math.floor(K.t * 10);
      if (k > 0.003) {
        s.globalCompositeOperation = 'lighter';
        for (const L of K.lights) {
          const def = COLUMN[L.type];
          if (!def) continue;
          const spr = def[0][(tk + Math.floor(U.hash(Math.round(L.x), 5) * 3)) % 3];
          const x0 = (L.screen ? Math.round(L.x) : K.sx(L.x)) - (spr.width >> 1);
          const top = Math.round((WY - L.y) * 0.3);

      // 2–3. Ondas: tabla regenerada a 10 Hz; cada trozo 16×1 se copia desplazado.
      if (tk !== tick) { tick = tk; buildTable(tk); }
      const src = new Uint32Array(s.getImageData(0, 0, W, WH).data.buffer);
      for (let y = 0, k2 = 0; y < WH; y++) {
        const row = y * W;
        for (let c = 0; c < NCX; c++, k2++) {
          let sy = y + TY[k2];

          const srow = sy * W, x0 = c * CW, dx = TX[k2];
          for (let i = 0; i < CW; i++) {
            let sx = x0 + i - dx;
            sx = sx < 0 ? 0 : sx >= W ? W - 1 : sx;
            out32[row + x0 + i] = src[srow + sx];
          }
        }
      }
      ctx.putImageData(out, 0, WY);

      // 4. Orilla: línea húmeda 1 px más oscura y espuma mínima que late con la tabla.
      U.rect(ctx, 0, WY, W, 1, U.shade(base, 0.72));
      ctx.fillStyle = U.lerpColor(base, mul('#C9CDB8', env.mulColor), 0.4);
      ctx.globalAlpha = 0.35 + 0.45 * Math.min(1, env.wind);
      for (let c = 0; c < NCX; c++) {
        if (TN[c] < 0.6) continue;
        const h = U.hash(c, tick, 9);
        ctx.fillRect(c * CW + Math.floor(h * 9), WY + 1, 2 + Math.floor(U.hash(c, tick, 10) * 5), 1);
      }
      ctx.globalAlpha = 1;

      // Destellos de día (invención propia).
      const day = U.clamp(1 - env.darkness / 0.12, 0, 1) * U.clamp((env.wind - 0.25) / 0.35, 0, 1);
      if (day > 0.02 && sparks.length) {
        ctx.globalAlpha = 0.7 * day;
        ctx.fillStyle = U.lerpColor(env.haze, '#FFFFFF', 0.5);
        for (const p of sparks) ctx.fillRect(p.x, WY + p.y, p.w, 1);
        ctx.globalAlpha = 1;
      }

      for (const f of fishes) drawFish(ctx, f);

  });

  // Vista de depuración: ?view=water (columnas, peces y salpicaduras a escala 1).
  K.views.water = (ctx) => {
    COL_S.forEach((c, i) => ctx.drawImage(c, 4 + i * 10, 10));
    COL_L.forEach((c, i) => ctx.drawImage(c, 4 + i * 28, 62));
    let x = 60;
    for (const s of [FISH.up, FISH.flat, FISH.down]) { U.draw(ctx, s, x, 12, 1); U.draw(ctx, s, x, 24, -1); x += 14; }
    x = 60;
    for (const s of SPLASH) { U.draw(ctx, s, x, 40, 1); x += 14; }
    x = 60;
    for (const r of RIPPLE) { U.draw(ctx, r, x, 52, 1); x += r.w + 3; }
  };
})(window.K);

<script>
/* src/40_light.js */
// 40_light.js — ciclo día/noche, cielo, sol y luna, estrellas, oscuridad con halos,
// luciérnagas y número del día. Publica K.env para el resto de módulos.
(function (K) {
  const U = K.util, C = K.CONFIG, P = K.params;
  const W = K.W, H = K.H;
  const PH = C.phases;
  const CYCLE = PH.reduce((s, p) => s + p.len, 0);
  const START = []; { let a = 0; for (const p of PH) { START.push(a); a += p.len; } }
  const NIGHT = PH.findIndex((p) => p.name === 'night');
  const SUN_SPAN = CYCLE - PH[NIGHT].len; // amanecer + día + atardecer

  const env = K.env = {
    phase: 'day', phaseIndex: 1, phaseT: 0, cycleT: 0, day: 1,
    sky: '#98BEEC', horizon: '#C4DAF1', haze: '#F3F1E8', sun: '#FFF766',
    darkness: 0, darkColor: C.darkColor, mulColor: '#FFFFFF', wind: 1,
    night: 0, bloodMoon: !!(P.blood || P.phase === 'blood'), timeScale: 1,
    sunX: 0, sunY: 0, sunVis: 0, moonX: 0, moonY: 0, moonVis: 0,
  };

  // Tiempo absoluto del ciclo: 0 = inicio del primer amanecer.
  let cycleT = C.startCycleT;
  if (P.phase) {
    const name = P.phase === 'blood' ? 'night' : P.phase;
    const i = PH.findIndex((p) => p.name === name);
    if (i >= 0) cycleT = START[i] + PH[i].blend + (PH[i].len - PH[i].blend) * 0.5;
  }
  if (P.cyc !== undefined) cycleT = P.cyc;

  const presetOf = (i) => (PH[i].name === 'night' && env.bloodMoon ? C.presets.blood : C.presets[PH[i].name]);

  function computeEnv() {
    const t = U.mod(cycleT, CYCLE);
    let i = 0;
    for (let k = 0; k < PH.length; k++) if (t >= START[k]) i = k;
    const u = t - START[i];
    const cur = presetOf(i), prev = presetOf((i + PH.length - 1) % PH.length);
    const b = U.smoothstep(u / PH[i].blend);
    env.phase = PH[i].name; env.phaseIndex = i; env.phaseT = u; env.cycleT = t;
    env.day = 1 + Math.floor(cycleT / CYCLE);
    env.sky = U.lerpColor(prev.sky, cur.sky, b);
    env.horizon = U.lerpColor(prev.horizon, cur.horizon, b);
    env.haze = U.lerpColor(prev.haze, cur.haze, b);
    env.sun = U.lerpColor(prev.sun, cur.sun, b);
    env.darkness = U.lerp(prev.darkness, cur.darkness, b);
    env.darkColor = U.lerpColor(prev.darkColor || C.darkColor, cur.darkColor || C.darkColor, b);
    env.wind = P.wind !== undefined ? P.wind : U.lerp(prev.wind, cur.wind, b);
    env.mulColor = U.lerpColor('#FFFFFF', env.darkColor, env.darkness);
    // Cuánto "es de noche" (estrellas, luna, luciérnagas).
    env.night = i === NIGHT ? b : (i + PH.length - 1) % PH.length === NIGHT ? 1 - b : 0;

    // Sol y luna fijos a la pantalla, en arco.
    if (i !== NIGHT) {
      const s = U.mod(t - START[0], CYCLE) / SUN_SPAN;
      env.sunX = Math.round(34 + s * (W - 68));
      env.sunY = Math.round(178 - Math.sin(Math.PI * s) * 150);
      env.sunVis = 1; env.moonVis = 0;
    } else {
      const s = u / PH[NIGHT].len;
      env.moonX = Math.round(34 + s * (W - 68));
      env.moonY = Math.round(178 - Math.sin(Math.PI * s) * 140);
      env.moonVis = 1; env.sunVis = 0;

  }

  // ---- Estrellas (fijas a la pantalla)
  const rs = U.mulberry32(991);
  const stars = Array.from({ length: 80 }, () => ({ x: Math.floor(rs() * W), y: Math.floor(rs() * 118) + 2, p: rs() * 6.28, big: rs() < 0.12 }));

  // ---- Luciérnagas: nacen sobre bosque y pradera
  const flies = [];
  { const rf = U.mulberry32(4242);
    for (const z of K.MAP.zones) {
      if (z.type !== 'forest' && z.type !== 'meadow') continue;
      const n = Math.round((z.x1 - z.x0) / 22);
      for (let k = 0; k < n; k++) flies.push({ x0: z.x0 + rf() * (z.x1 - z.x0), y0: 128 + rf() * 48, s: Math.floor(rf() * 1000), x: 0, y: 0, a: 0 });
    }
  }
  let flyAmount = 0;

  // ---- Halos escalonados (4–5 anillos) para la capa de oscuridad: elipses achatadas (la luz se extiende

  function makeHalo(w, h, color, rings = 5) {
    const { c, x } = U.canvas(w, h), rx = w / 2, ry = h / 2;
    x.fillStyle = color;
    for (let k = 0; k < rings; k++) {
      const f = 1 - k / rings, ax = rx * f - 1, ay = ry * f - 1;

  const HALO_TOP = 100;   // los halos no suben al cielo

    firefly: { c: makeHalo(64, 48, '#C8FFD2', 4), power: 0.5 },
    torch:   { c: makeHalo(128, 72, '#FFC48A'), power: 0.95, core: 6, coreC: '#FFE0B0' },
    fire:    { c: makeHalo(256, 140, '#FFB070'), power: 1, core: 14, coreC: '#FFD8A8' },
