<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tambores junto al río</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
  canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ayuda { position: absolute; left: 8px; bottom: 6px; color: #cfd3c4; font: 12px monospace; opacity: .75; }
</style>
</head>
<body>
<canvas id="pantalla"></canvas>
<div id="ayuda">A = PATA · D = PON · al ritmo · PATA PATA PATA PON = marchar · PON PON PATA PON = atacar · N = noche · V = viento</div>
<script src="agua.js"></script>
<script>
(() => {
  const W = 480, H = 270, WY = 190, GY = 176;       // buffer, línea del agua, suelo donde pisan
  const P = new URLSearchParams(location.search);
  const pantalla = document.getElementById('pantalla'), pctx = pantalla.getContext('2d');
  const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
  const ctx = buf.getContext('2d', { willReadFrequently: true });
  const agua = crearAgua({ ancho: W, alto: H, yAgua: WY });

  // ---- Utilidades de pixel
  const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  function disco(g, cx, cy, r, c) {
    g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
    for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
  }
  const hash = (x, s = 0) => { let h = (x * 374761393 + s * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h = Math.imul(h ^ (h >>> 16), 2246822519); return ((h ^ (h >>> 13)) >>> 0) / 4294967296; };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (c1, c2, t) => { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    const ch = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, t));
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };

  // ---- Estado
  let t = 0, camX = 0, noche = P.has('noche') ? 1 : 0, nocheObj = noche, viento = 0.5;
  const BEAT = 0.5;                          // un golpe de tambor cada medio segundo
  let dtDibujo = 1 / 60;
  let combo = [], orden = null, ordenFin = 0, textos = [];
  const tropa = [0, 1, 2, 3, 4, 5].map((i) => ({ i, x: 150 - i * 20, fase: hash(i, 3) * 6, porta: i === 0 ? 'bandera' : i === 3 ? 'antorcha' : 'lanza' }));

  // ---- Sonido (tambores sintetizados)
  let ac = null;
  function tambor(frec, dur = 0.12, vol = 0.35) {
    try {
      ac = ac || new AudioContext();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(frec, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(frec * 0.5, ac.currentTime + dur);
      g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (_) {}
  }

  // ---- Ritmo: cada golpe debe caer cerca de un pulso
  function golpe(tipo) {
    tambor(tipo === 'PATA' ? 180 : 120);
    const fase = (t % BEAT) / BEAT, cerca = fase < 0.25 || fase > 0.75;
    textos.push({ s: tipo === 'PATA' ? '¡PATA!' : '¡PON!', x: tipo === 'PATA' ? 170 : 290, y: 40, a: 0, ok: cerca });
    if (!cerca || orden) { combo = []; return; }
    for (const g of tropa) g.salto = 0.22;
    combo.push(tipo); if (combo.length > 4) combo.shift();
    const k = combo.join(' ');
    if (k === 'PATA PATA PATA PON') { orden = 'marchar'; ordenFin = t + BEAT * 4; combo = []; }
    if (k === 'PON PON PATA PON')   { orden = 'atacar';  ordenFin = t + BEAT * 4; combo = []; }
  }
  addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'KeyA' || e.code === 'KeyJ') golpe('PATA');
    if (e.code === 'KeyD' || e.code === 'KeyK') golpe('PON');
    if (e.code === 'KeyN') nocheObj = nocheObj ? 0 : 1;
    if (e.code === 'KeyV') viento = viento > 0.9 ? 0.1 : viento + 0.3;
  });

  // ---- Fondo
  const sx = (x, f) => Math.round(x - camX * f);
  function cielo() {
    const top = mix('#6FA3C9', '#0E1630', noche), hor = mix('#E8D7A8', '#27304A', noche);
    for (let y = 0; y < WY; y++) { const k = Math.pow(y / WY, 1.4); ctx.fillStyle = mixRGB(top, hor, k); ctx.fillRect(0, y, W, 1); }
    if (noche > 0.3) for (let i = 0; i < 60; i++) { ctx.globalAlpha = (noche - 0.3) * (0.5 + 0.5 * Math.sin(t * 2 + i)); rect(Math.floor(hash(i, 1) * W), Math.floor(hash(i, 2) * 110), 1, 1, '#E8EEFF'); }
    ctx.globalAlpha = 1;
    disco(ctx, 380, 50, 9, noche > 0.5 ? '#E9ECF2' : '#FFF1C2');
  }
  function mixRGB(a, b, k) { // a y b son 'rgb(r,g,b)'
    const pa = a.match(/\d+/g).map(Number), pb = b.match(/\d+/g).map(Number);
    return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], k))).join(',')})`;
  }
  function sierra(f, y0, alto, paso, col, seed) {
    ctx.fillStyle = col;
    const off = ((camX * f) % paso + paso) % paso, base = Math.floor(camX * f / paso);
    for (let x = -paso; x < W + paso; x++) {
      const wx = x + off, i = Math.floor(wx / paso), u = (wx % paso) / paso;
      const h0 = hash(i + base, seed), h1 = hash(i + base + 1, seed);
      const h = Math.round(lerp(h0, h1, u * u * (3 - 2 * u)) * alto);
      ctx.fillRect(x, y0 - h, 1, WY - (y0 - h));
    }
  }
  function arboles(f, y0, col, seed, sep) {
    for (let k = -1; k < W / sep + 2; k++) {
      const i = k + Math.floor(camX * f / sep), x = i * sep - camX * f + hash(i, seed) * sep * 0.6;
      const h = 26 + Math.floor(hash(i, seed + 1) * 22);
      rect(x, y0 - h, 3, h, col);
      disco(ctx, x + 1, y0 - h, 8 + Math.floor(hash(i, seed + 2) * 5), col);
    }
  }
  function suelo() {
    const hierba = mix('#6E8A3C', '#26301F', noche), tierra = mix('#5A3E26', '#1E1712', noche), tierra2 = mix('#46301D', '#171210', noche);
    rect(0, GY, W, WY - GY, tierra);
    for (let x = 0; x < W; x += 8) { const i = Math.floor((x + camX) / 8); rect(x - ((camX % 8 + 8) % 8), GY + 5 + Math.floor(hash(i, 7) * 7), 4, 2, tierra2); }
    rect(0, GY, W, 2, hierba);
    for (let x = 0; x < W; x++) { const i = Math.floor(x + camX); if (hash(i, 9) < 0.35) rect(x, GY - 1 - Math.floor(hash(i, 10) * 3 * (0.6 + 0.4 * Math.sin(t * 3 * viento + i * 0.3))), 1, 3, hierba); }
  }

  // ---- Guerreros stickman: esqueleto + cinemática inversa, dibujado con líneas de 1 px.
  // Medidas en píxeles: cabeza r3, torso 9, muslo 6, pierna 6, brazo 5, antebrazo 5.
  const NEGRO = '#15131A', METAL = '#C9CCD2';
  const TORSO = 9, MUSLO = 6, PIERNA = 6, BRAZO = 5, ANTEB = 5;
  const VEL = 30;                      // px/s que avanza el mundo al marchar
  const ZANCADA = VEL * BEAT / 2;      // lo que recorre un pie apoyado: 7.5 px (así no patina)
  const smooth = (u) => u * u * (3 - 2 * u);
  const easeOut = (u) => 1 - (1 - u) * (1 - u);
  // Línea de Bresenham: píxeles enteros, sin antialiasing.
  function linea(x0, y0, x1, y1, c) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    ctx.fillStyle = c;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx2 = x0 < x1 ? 1 : -1, sy2 = y0 < y1 ? 1 : -1;
    let e = dx + dy;
    for (;;) {
      ctx.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx2; }
      if (e2 <= dx) { e += dx; y0 += sy2; }
    }
  }
  // IK de 2 huesos (ley de cosenos). dobla = -1 dobla hacia delante (rodilla), +1 hacia atrás (codo).
  function ik(ax, ay, bx, by, l1, l2, dobla) {
    let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 0.001;
    const max = l1 + l2 - 0.01;
    if (d > max) { bx = ax + dx / d * max; by = ay + dy / d * max; d = max; }
    const a = Math.atan2(by - ay, bx - ax);
    const c = Math.max(-1, Math.min(1, (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d)));
    const ang = a + dobla * Math.acos(c);
    return { jx: ax + Math.cos(ang) * l1, jy: ay + Math.sin(ang) * l1, ex: bx, ey: by };
  }
  function miembro(ax, ay, bx, by, l1, l2, dobla) {
    const r = ik(ax, ay, bx, by, l1, l2, dobla);
    linea(ax, ay, r.jx, r.jy, NEGRO); linea(r.jx, r.jy, r.ex, r.ey, NEGRO);
    return r;
  }

  function guerrero(g, px, dt) {
    // Pesos que se mezclan suave para pasar de una animación a otra sin saltos.
    const quiereMarcha = orden === 'marchar' ? 1 : 0, quiereAtaque = orden === 'atacar' ? 1 : 0;
    g.wm = (g.wm ?? 0) + (quiereMarcha - (g.wm ?? 0)) * Math.min(1, dt * 14);
    g.wa = (g.wa ?? 0) + (quiereAtaque - (g.wa ?? 0)) * Math.min(1, dt * 14);
    const wm = g.wm, wa = g.wa;
    const p = (t % BEAT) / BEAT;                 // fase dentro del pulso: 0 = golpe de tambor

    // Salto corto cuando el jugador acierta un golpe
    g.salto = Math.max(0, (g.salto ?? 0) - dt);
    const hop = g.salto > 0 ? Math.sin(Math.PI * (1 - g.salto / 0.22)) * 3 : 0;

    // Cadera: rodillas algo dobladas; al marchar baja 1 px en cada apoyo; en reposo respira.
    const respira = Math.sin(t * 2.2 + g.fase) * 0.5 + 0.5;
    let hx = px, hy = GY - (MUSLO + PIERNA) + 1;
    hy += wm * (0.5 + 0.5 * Math.cos(4 * Math.PI * p)) - hop;
    hx += wa * (attackLunge(p) * 2);

    // Piernas: un ciclo = un pulso. El pie apoyado retrocede exactamente a la velocidad del suelo.
    const pies = [0, 1].map((k) => {
      const u = (p + k * 0.5) % 1;
      let rel, lift;
      if (u < 0.5) { const s2 = u / 0.5; rel = ZANCADA / 2 - ZANCADA * s2; lift = 0; }
      else { const s2 = (u - 0.5) / 0.5; rel = -ZANCADA / 2 + ZANCADA * smooth(s2); lift = 3 * Math.sin(Math.PI * s2); }
      const reposo = k ? 3 : -2;               // postura abierta en reposo
      const ataque = k ? 5 : -4;               // zancada de estocada
      const fx = px + wm * rel + (1 - wm) * (wa * ataque + (1 - wa) * reposo);
      const fy = GY - 1 - wm * lift - Math.max(0, hop - 1.5);
      return [fx, fy];
    });
    // pierna de atrás primero
    for (const [fx, fy] of pies) {
      const r = miembro(hx, hy, fx, fy, MUSLO, PIERNA, -1);
      linea(r.ex, r.ey, r.ex + 1, r.ey, NEGRO);                     // pie de 2 px
    }

    // Torso y cabeza
    const incl = wm * 1 + wa * attackLunge(p) * 2;
    const shx = hx + incl, shy = hy - TORSO + Math.round((1 - wm) * (1 - wa) * respira);
    linea(hx, hy, shx, shy, NEGRO);
    linea(hx + 1, hy - 1, shx + 1, shy + 1, NEGRO);                  // torso de 2 px para dar peso
    const cx = Math.round(shx + incl * 0.3), cy = Math.round(shy - 4);
    disco(ctx, cx, cy, 3, NEGRO);
    rect(cx, cy - 1, 2, 2, '#F4F1E6');                               // ojo
    rect(cx + 1, cy - (wa > 0.5 ? 1 : 0), 1, 1, NEGRO);              // pupila (entornada al atacar)
    if (wa > 0.5) rect(cx - 1, cy - 2, 4, 1, NEGRO);                 // ceja de enfado

    // Brazo de atrás: se balancea opuesto a la pierna delantera
    const bal = Math.sin(2 * Math.PI * p);
    miembro(shx, shy + 1, shx - 1 - wm * 3 * bal, shy + 1 + 8 - wm * Math.abs(bal), BRAZO, ANTEB, 1);

    // Brazo de delante y objeto
    let luz = null;
    if (g.porta === 'lanza') {
      // En reposo/marcha la lanza va vertical; al atacar pasa a horizontal y se clava en el golpe.
      const ang = -Math.PI / 2 * (1 - wa) - 0.15 * wm * (1 - wa);   // -90° vertical → 0° horizontal
      const empuje = wa * attackThrust(p);
      const hxm = shx + 4 + empuje, hym = shy + 5 - wa * 1;
      const r = miembro(shx, shy + 1, hxm, hym, BRAZO, ANTEB, 1);
      const ux = Math.cos(ang), uy = Math.sin(ang);
      linea(r.ex - ux * 7, r.ey - uy * 7, r.ex + ux * 17, r.ey + uy * 17, NEGRO);
      linea(r.ex + ux * 17, r.ey + uy * 17, r.ex + ux * 20, r.ey + uy * 20, METAL);
    } else if (g.porta === 'bandera') {
      const r = miembro(shx, shy + 1, shx + 4, shy + 4, BRAZO, ANTEB, 1);
      const bx = Math.round(r.ex), top = Math.round(r.ey) - 20;
      linea(bx, r.ey + 8, bx, top, NEGRO);
      for (let i = 0; i < 9; i++) {                                     // tela que ondea columna a columna
        const ond = Math.round(Math.sin(t * 8 - i * 0.7) * (i / 9) * 1.5);
        rect(bx + 1 + i, top + ond, 1, i < 7 ? 6 : 6 - (i - 6) * 2, '#B8322A');
      }
      disco(ctx, bx + 5, top + 3 + Math.round(Math.sin(t * 8 - 3) * 0.6), 1, '#F2C14E');
    } else if (g.porta === 'antorcha') {
      const r = miembro(shx, shy + 1, shx + 4, shy - 3 + Math.round(wm * bal * 0.8), BRAZO, ANTEB, 1);
      const ax = Math.round(r.ex), ay = Math.round(r.ey);
      linea(ax, ay + 4, ax, ay - 5, '#5B4430');
      const fl = Math.floor(t * 10 + g.fase) % 3;
      rect(ax - 1, ay - 9 - (fl === 1 ? 1 : 0), 3, 4 + (fl === 1 ? 1 : 0), '#F2A33A');
      rect(ax, ay - 8 - fl % 2, 1, 2, '#FFE39A');
      luz = { x: ax, y: ay - 8, tam: 'chica', fuerza: 1 };
    }
    return luz;
  }
  // Estocada: preparar (0–0.4), clavar justo después del golpe siguiente (0.4–0.55), sostener, volver.
  function attackThrust(p) {
    if (p < 0.4) return -3 * easeOut(p / 0.4);
    if (p < 0.55) return -3 + 11 * easeOut((p - 0.4) / 0.15);
    if (p < 0.7) return 8;
    return 8 - 8 * smooth((p - 0.7) / 0.3);
  }
  const attackLunge = (p) => attackThrust(p) / 8;

  // ---- Oscuridad con halos elípticos (misma técnica que la escena del reino)
  const capa = document.createElement('canvas'); capa.width = W; capa.height = H; const cx2 = capa.getContext('2d');
  function halo(w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#FFB070';
    for (let k = 0; k < 5; k++) { const f = 1 - k / 5, ax = w / 2 * f - 1, ay = h / 2 * f - 1; x.globalAlpha = k ? 0.24 : 0.12;
      for (let yy = -Math.floor(ay); yy <= Math.floor(ay); yy++) { const hw = Math.floor(ax * Math.sqrt(1 - yy * yy / (ay * ay))); x.fillRect(Math.round(w / 2 - hw), Math.round(h / 2 + yy), hw * 2, 1); } }
    return c;
  }
  const HALO = halo(160, 90);
  function oscuridad(luces) {
    if (noche < 0.01) return;
    cx2.globalCompositeOperation = 'source-over'; cx2.globalAlpha = 1;
    cx2.fillStyle = mix('#FFFFFF', '#5A6894', noche); cx2.fillRect(0, 0, W, H);
    cx2.globalCompositeOperation = 'screen';
    for (const L of luces) { cx2.globalAlpha = noche * (0.85 + 0.15 * Math.sin(t * 17 + L.x)); cx2.drawImage(HALO, Math.round(L.x - 80), Math.round(L.y - 45)); disco(cx2, L.x, L.y, 5, '#FFD8A8'); }
    // luna y estrellas no se oscurecen: se "perforan" en blanco (multiplicar por blanco no cambia nada)
    cx2.globalCompositeOperation = 'source-over'; cx2.globalAlpha = noche;
    disco(cx2, 380, 50, 9, '#FFFFFF'); cx2.fillStyle = '#FFFFFF';
    for (let i = 0; i < 60; i++) cx2.fillRect(Math.floor(hash(i, 1) * W), Math.floor(hash(i, 2) * 110), 1, 1);
    ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(capa, 0, 0); ctx.globalCompositeOperation = 'source-over';
  }

  // ---- Bucle
  function paso(dt) {
    t += dt;
    noche += (nocheObj - noche) * Math.min(1, dt * 1.5);
    if (orden && t >= ordenFin) orden = null;
    if (orden === 'marchar') camX += VEL * dt;
    dtDibujo = dt;
    for (const s of textos) s.a += dt;
    textos = textos.filter((s) => s.a < 0.6);
    // metrónomo suave
    const b = Math.floor(t / BEAT); if (b !== paso.b) { paso.b = b; if (!P.has('shot')) tambor(orden ? 90 : 60, 0.05, orden ? 0.12 : 0.05); }
  }
  function dibujar() {
    cielo();
    sierra(0.1, 130, 40, 60, mix('#8FA7B8', '#1E2740', noche), 1);
    arboles(0.3, 168, mix('#5D7A6A', '#18212A', noche), 20, 26);
    sierra(0.5, 172, 10, 30, mix('#4E6B45', '#141C18', noche), 2);
    suelo();
    // piedras y postes del camino (plano de juego)
    for (let k = -1; k < W / 90 + 2; k++) { const i = k + Math.floor(camX / 90), x = sx(i * 90 + hash(i, 4) * 50, 1);
      if (hash(i, 5) < 0.5) { disco(ctx, x, GY - 2, 4, mix('#7B7D78', '#2A2C33', noche)); } else { rect(x, GY - 16, 2, 16, mix('#5B4430', '#1B1510', noche)); } }
    const luces = [];
    for (const g of tropa) { const l = guerrero(g, g.x, dtDibujo); if (l) luces.push(l); }
    // tambores que se ven arriba
    for (const s of textos) { ctx.globalAlpha = 1 - s.a / 0.6; texto(s.s, s.x, s.y - Math.round(s.a * 12), s.ok ? '#FFF1C2' : '#8C8C8C'); }
    ctx.globalAlpha = 1;
    // pulso en el borde
    const pulso = Math.max(0, 1 - ((t % BEAT) / BEAT) * 3);
    ctx.globalAlpha = 0.5 * pulso; rect(0, 0, W, 2, '#FFFFFF'); rect(0, H - 2, W, 2, '#FFFFFF'); ctx.globalAlpha = 1;
    oscuridad(luces);
    agua.dibujar(ctx, { t, camX, viento, oscuridad: noche, colorNoche: '#141A2E', luces });
  }
  // Fuente mínima 3×5 para los gritos
  const G = { 'P': [7,5,7,4,4], 'A': [2,5,7,5,5], 'T': [7,2,2,2,2], 'O': [7,5,5,5,7], 'N': [5,7,7,7,5], '!': [2,2,2,0,2], '¡': [2,0,2,2,2], ' ': [0,0,0,0,0] };
  function texto(s, x, y, c) {
    ctx.fillStyle = c; let px = x - s.length * 4;
    for (const ch of s) { const g = G[ch] || G[' ']; for (let r = 0; r < 5; r++) for (let b = 0; b < 3; b++) if (g[r] & (4 >> b)) ctx.fillRect(px + b * 2, y + r * 2, 2, 2); px += 8; }
  }

  function ajustar() {
    const k = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
    pantalla.width = W * k; pantalla.height = H * k;
    pantalla.style.left = ((innerWidth - W * k) >> 1) + 'px'; pantalla.style.top = ((innerHeight - H * k) >> 1) + 'px';
    pctx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', ajustar); ajustar();

  // ?shot=1 simula unos segundos y deja la imagen en #out (para capturas automáticas)
  if (P.has('shot')) {
    if (P.get('orden')) { orden = P.get('orden'); ordenFin = 99; }
    const n = Math.round((+P.get('sim') || 1.5) * 60);
    for (let i = 0; i < n; i++) { paso(1 / 60); dibujar(); }
    const pre = document.createElement('pre'); pre.id = 'out'; pre.textContent = buf.toDataURL(); document.body.appendChild(pre);
    return;
  }
  let last = performance.now();
  requestAnimationFrame(function frame(now) {
    paso(Math.min(0.05, (now - last) / 1000)); last = now;
    dibujar();
    pctx.drawImage(buf, 0, 0, pantalla.width, pantalla.height);
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
