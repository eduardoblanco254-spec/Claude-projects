  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fondo: #0d0f16; } }
  :root[data-theme="dark"] { --fondo: #0d0f16; }
  html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden; touch-action: none; user-select: none; }

<canvas id="pantalla"></canvas>
<script>
// ---- agua.js
// agua.js — agua pixel art reutilizable (reflejo invertido, ondas "a saltos" a 10 Hz,
// columnas de luz y espuma en la orilla). Sin dependencias: copia este archivo a tu juego.
//
// Uso mínimo (ver demo.html):
//   const agua = crearAgua({ ancho: 480, alto: 270, yAgua: 190 });
//   // ...dibuja cielo, fondo y personajes en tu buffer (canvas de 480×270)...
//   agua.dibujar(ctxBuffer, { t: segundos, camX, viento: 0.5, oscuridad: 0, luces: [...] });
//
// Idea: las filas justo encima de la línea del agua se copian volteadas debajo de ella; luego se
// trocean en tiras de 16×1 px y cada tira se desplaza unos píxeles según una tabla de ruido que solo
// cambia 10 veces por segundo. Ese "salto" discreto es lo que da el aspecto pixel art.
(function (global) {
  // ---- Utilidades (ruido determinista y color)
  function hash(x, y = 0, s = 0) {
    let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function noise2(x, y, s = 0) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  const mezcla = (c1, c2, t) => { const a = rgb(c1), b = rgb(c2); return hex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)); };
  const oscurece = (c, f) => { const a = rgb(c); return hex(a[0] * f, a[1] * f, a[2] * f); };
  function lienzo(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return { c, x: c.getContext('2d') }; }

  function crearAgua(op = {}) {
    const W = op.ancho ?? 480, H = op.alto ?? 270, WY = op.yAgua ?? 190;
    const WH = H - WY;                 // filas de agua
    const SRC_Y = Math.max(0, WY - WH); // primera fila que se refleja
    const CW = op.trozo ?? 16, NCX = Math.ceil(W / CW);
    const BASE = op.color ?? '#686C53';          // color del río
    const LUZ = op.colorLuz ?? '#FC8F53';        // columnas de luz
    const REFLEJO = op.reflejo ?? 0.3;           // 30 % de reflectividad
    const HZ = op.hz ?? 10;                      // frecuencia de las ondas

    const quieta = lienzo(W, WH);
    const salida = quieta.x.createImageData(W, WH);
    const out32 = new Uint32Array(salida.data.buffer);

    // Oscurecimiento hacia el fondo: hasta 40 % de negro en bandas de 4 px.
    const bandas = lienzo(W, WH);
    { const nb = Math.ceil(WH / 4);
      for (let i = 0; i < nb; i++) { bandas.x.fillStyle = `rgba(0,0,0,${(0.4 * i / Math.max(1, nb - 1)).toFixed(3)})`; bandas.x.fillRect(0, i * 4, W, 4); } }

    // Columna de luz: guiones horizontales, núcleo intenso, huecos que crecen hacia abajo.
    function columna(w, h, seed) {
      const { c, x } = lienzo(w, h), img = x.createImageData(w, h), d = img.data, [r, g, b] = rgb(LUZ), half = w / 2;
      for (let y = 0; y < h; y++) {
        const v = y / (h - 1), iv = Math.min(1, (y + 2) / 6) * Math.pow(1 - v, 0.75);
        const hueco = hash(y, 1, seed) < 0.1 + 0.4 * v;
        const L = half * (1 - 0.5 * v) * (0.5 + 0.5 * hash(y, 2, seed));
        const off = w > 8 ? Math.round((hash(y, 3, seed) - 0.5) * 2) : 0;
        for (let i = 0; i < w; i++) {
          const e = Math.abs(i + 0.5 - half - off) / Math.max(1, L);
          if (e >= 1) continue;
          let a = iv * (e < 0.34 ? 1 : e < 0.7 ? 0.55 : 0.28);
          if (hueco) a *= e < 0.34 ? 0.45 : 0;
          a = Math.round(a * 4) / 4;
          if (a <= 0) continue;
          const o = (y * w + i) * 4; d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = Math.round(a * 255);
        }
      }
      x.putImageData(img, 0, 0);
      return c;
    }
    const variantes = (w, s) => [0, 1, 2].map((k) => columna(w, 48, s + k * 101));
    const COL = { chica: variantes(8, 11), grande: variantes(24, 23) };

    // Tabla de ondas: desplazamiento (dx, dy) por trozo de CW×1 px.
    const NT = NCX * WH, TX = new Int8Array(NT), TY = new Int8Array(NT), TN = new Float32Array(NT);
    let tick = -1;
    function tabla(tk, camX, viento) {
      const t = tk / HZ, ox = camX * 1.5;
      for (let y = 0; y < WH; y++) {
        const amp = 0.8 + 0.4 * y / Math.max(1, WH - 1); // más amplitud al fondo
        const ax = viento * 6 * amp, ay = viento * 12 * amp;
        const Y1 = (y - t * 5) / 4, Y2 = (y - t * 9) / 3;
        for (let c = 0; c < NCX; c++) {
          const X = (c * CW + 8 + ox) / 32;
          const n = noise2(X + t * 0.04, Y1, 301) * 0.62 + noise2(X * 1.3 - t * 0.07, Y2, 302) * 0.38;
          const m = noise2(X * 0.9 + 17, Y1 + 5, 303) * 0.62 + noise2(X * 1.4 + 9, Y2 - 3, 304) * 0.38;
          const k = y * NCX + c;
          TX[k] = Math.round(clamp((n - 0.5) * 3, -1, 1) * ax);
          TY[k] = Math.round(clamp((m - 0.5) * 3, -1, 1) * ay);
          TN[k] = n;
        }
      }
    }

    // ctx: el buffer donde ya dibujaste la escena (se lee de él para el reflejo y se escribe el agua).
    // e: { t, camX, viento (0–1), oscuridad (0–1), colorNoche, luces: [{ x, y, tam: 'chica'|'grande', fuerza }] }
    //    x de las luces en coordenadas de pantalla.
    function dibujar(ctx, e = {}) {
      const t = e.t ?? 0, camX = e.camX ?? 0, viento = e.viento ?? 0.5, osc = e.oscuridad ?? 0;
      const base = mezcla(BASE, e.colorNoche ?? '#141A2E', osc * 0.8);
      const s = quieta.x;
      // 1. Agua quieta: color, bandas, reflejo volteado, columnas de luz.
      s.setTransform(1, 0, 0, 1, 0, 0); s.globalCompositeOperation = 'source-over'; s.globalAlpha = 1;
      s.fillStyle = base; s.fillRect(0, 0, W, WH);
      s.drawImage(bandas.c, 0, 0);
      s.globalAlpha = REFLEJO;
      s.setTransform(1, 0, 0, -1, 0, WH); // la fila justo encima del agua queda pegada a ella
      s.drawImage(ctx.canvas, 0, SRC_Y, W, WY - SRC_Y, 0, WH - (WY - SRC_Y), W, WY - SRC_Y);
      s.setTransform(1, 0, 0, 1, 0, 0);
      const tk = Math.floor(t * HZ);
      const k = osc * 0.8 * Math.min(1, viento * 10);
      if (k > 0.003 && e.luces) {
        s.globalCompositeOperation = 'lighter';
        for (const L of e.luces) {
          const set = COL[L.tam ?? 'chica'];
          const spr = set[(tk + Math.floor(hash(Math.round(L.x * 7), 5) * 3)) % 3];
          const x0 = Math.round(L.x) - (spr.width >> 1), top = Math.round((WY - L.y) * 0.3);
          if (x0 + spr.width < 0 || x0 > W || top >= WH) continue;
          s.globalAlpha = clamp(k * (L.fuerza ?? 1), 0, 1);
          s.drawImage(spr, x0, top);
        }
        s.globalCompositeOperation = 'source-over'; s.globalAlpha = 1;
      }
      s.globalAlpha = 1;

      // 2. Ondas: la tabla cambia a HZ; cada trozo se copia desplazado (vecino más cercano, sin mezcla).
      if (tk !== tick) { tick = tk; tabla(tk, camX, viento); }
      const src = new Uint32Array(s.getImageData(0, 0, W, WH).data.buffer);
      for (let y = 0, k2 = 0; y < WH; y++) {
        const row = y * W;
        for (let c = 0; c < NCX; c++, k2++) {
          let sy = y + TY[k2]; sy = sy < 0 ? 0 : sy >= WH ? WH - 1 : sy;
          const srow = sy * W, x0 = c * CW, dx = TX[k2];
          for (let i = 0; i < CW && x0 + i < W; i++) {
            let sx = x0 + i - dx; sx = sx < 0 ? 0 : sx >= W ? W - 1 : sx;
            out32[row + x0 + i] = src[srow + sx];
          }
        }
      }
      ctx.putImageData(salida, 0, WY);

      // 3. Orilla: línea húmeda y espuma que late con la tabla.
      ctx.fillStyle = oscurece(base, 0.72); ctx.fillRect(0, WY, W, 1);
      ctx.fillStyle = mezcla(base, '#C9CDB8', 0.4 * (1 - osc * 0.6));
      ctx.globalAlpha = 0.35 + 0.45 * Math.min(1, viento);
      for (let c = 0; c < NCX; c++) {
        if (TN[c] < 0.6) continue;
        ctx.fillRect(c * CW + Math.floor(hash(c, tick, 9) * 9), WY + 1, 2 + Math.floor(hash(c, tick, 10) * 5), 1);
      }
      ctx.globalAlpha = 1;
    }

    return { dibujar, yAgua: WY };
  }

  global.crearAgua = crearAgua;
})(window);

</script>
<script>
// ---- 00_nucleo.js
// 00_nucleo.js — espacio de nombres G, utilidades, dibujo pixel, fuente 3×5, eventos y registro de módulos.
window.G = (() => {
  const G = {
    W: 480, H: 270, WY: 190, GY: 176, BEAT: 0.5,
    t: 0, dt: 1 / 60, camX: 0,
    P: new URLSearchParams(location.search),
    estado: 'titulo',
    luces: [],
  };
  G.prueba = G.P.has('shot') || G.P.has('prueba') || G.P.has('auto') || G.P.has('bench');

  // ---- Eventos
  const ev = {};
  G.on = (n, f) => (ev[n] = ev[n] || []).push(f);
  G.emit = (n, a) => { for (const f of ev[n] || []) f(a); };

  // ---- Utilidades numéricas y de color
  const U = G.u = {};
  U.hash = (x, y = 0, s = 0) => {
    let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h = Math.imul(h ^ (h >>> 16), 2246822519);
    return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
  };
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.smooth = (u) => { u = U.clamp(u, 0, 1); return u * u * (3 - 2 * u); };
  U.easeOut = (u) => 1 - (1 - u) * (1 - u);
  U.rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  U.hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(U.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  U.mix = (a, b, t) => { const x = U.rgb(a), y = U.rgb(b); return U.hex(U.lerp(x[0], y[0], t), U.lerp(x[1], y[1], t), U.lerp(x[2], y[2], t)); };
  U.shade = (c, f) => { const x = U.rgb(c); return U.hex(x[0] * f, x[1] * f, x[2] * f); };
  U.noise1 = (x, s = 0) => { const i = Math.floor(x), f = x - i; return U.lerp(U.hash(i, 0, s), U.hash(i + 1, 0, s), f * f * (3 - 2 * f)); };
  U.rng = (seed) => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // ---- Lienzos
  G.lienzo = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return { c, x: c.getContext('2d', { willReadFrequently: true }) }; };
  const buf = G.lienzo(G.W, G.H);
  G.buf = buf.c; G.ctx = buf.x;

  // ---- Dibujo en píxeles enteros
  const D = G.d = {};
  D.rect = (x, y, w, h, c, g = G.ctx) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  D.disco = (cx, cy, r, c, g = G.ctx) => {
    g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
    for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
  };
  // Línea de Bresenham; grosor g ≥ 1 dibuja cuadrados g×g en cada punto.
  D.linea = (x0, y0, x1, y1, c, gr = 1, g = G.ctx) => {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    g.fillStyle = c;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, o = gr >> 1;
    let e = dx + dy, n = 0;
    for (;;) {
      g.fillRect(x0 - o, y0 - o, gr, gr);
      if ((x0 === x1 && y0 === y1) || ++n > 2000) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  };

  // ---- Fuente pixel 3×5 (cada fila: 3 bits)
  const F = {
    A: [2, 5, 7, 5, 5], B: [6, 5, 6, 5, 6], C: [3, 4, 4, 4, 3], D: [6, 5, 5, 5, 6], E: [7, 4, 6, 4, 7], F: [7, 4, 6, 4, 4],
    G: [3, 4, 5, 5, 3], H: [5, 5, 7, 5, 5], I: [7, 2, 2, 2, 7], J: [1, 1, 1, 5, 2], K: [5, 5, 6, 5, 5], L: [4, 4, 4, 4, 7],
    M: [5, 7, 7, 5, 5], N: [6, 5, 5, 5, 5], O: [2, 5, 5, 5, 2], P: [6, 5, 6, 4, 4], Q: [2, 5, 5, 6, 3], R: [6, 5, 6, 5, 5],
    S: [3, 4, 2, 1, 6], T: [7, 2, 2, 2, 2], U: [5, 5, 5, 5, 7], V: [5, 5, 5, 5, 2], W: [5, 5, 7, 7, 5], X: [5, 5, 2, 5, 5],
    Y: [5, 5, 2, 2, 2], Z: [7, 1, 2, 4, 7],
    0: [7, 5, 5, 5, 7], 1: [2, 6, 2, 2, 7], 2: [6, 1, 2, 4, 7], 3: [6, 1, 2, 1, 6], 4: [5, 5, 7, 1, 1], 5: [7, 4, 6, 1, 6],
    6: [3, 4, 7, 5, 7], 7: [7, 1, 2, 2, 2], 8: [7, 5, 7, 5, 7], 9: [7, 5, 7, 1, 6],
    '!': [2, 2, 2, 0, 2], '¡': [2, 0, 2, 2, 2], '?': [6, 1, 2, 0, 2], '¿': [2, 0, 2, 4, 3], '.': [0, 0, 0, 0, 2], ',': [0, 0, 0, 2, 4],
    ':': [0, 2, 0, 2, 0], '-': [0, 0, 7, 0, 0], '+': [0, 2, 7, 2, 0], '/': [1, 1, 2, 4, 4], '×': [0, 5, 2, 5, 0], '%': [5, 1, 2, 4, 5],
    "'": [2, 2, 0, 0, 0], '(': [1, 2, 2, 2, 1], ')': [4, 2, 2, 2, 4], '<': [1, 2, 4, 2, 1], '>': [4, 2, 1, 2, 4], '=': [0, 7, 0, 7, 0],
    '·': [0, 0, 2, 0, 0], ' ': [0, 0, 0, 0, 0],
  };
  const limpia = (s) => String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  D.anchoTexto = (s, e = 1) => limpia(s).length * 4 * e - e;
  // alin: 'izq' | 'centro' | 'der'; sombra: color de la sombra 1 px abajo
  D.texto = (s, x, y, c = '#FFFFFF', e = 1, alin = 'izq', sombra = null, g = G.ctx) => {
    s = limpia(s);
    let px = Math.round(alin === 'centro' ? x - D.anchoTexto(s, e) / 2 : alin === 'der' ? x - D.anchoTexto(s, e) : x);
    y = Math.round(y);
    if (sombra) D.texto(s, px + (alin === 'izq' ? 0 : 0), y + e, sombra, e, 'izq', null, g);
    g.fillStyle = c;
    for (const ch of s) {
      const f = F[ch] || F[' '];
      for (let r = 0; r < 5; r++) for (let b = 0; b < 3; b++) if (f[r] & (4 >> b)) g.fillRect(px + b * e, y + r * e, e, e);
      px += 4 * e;
    }
  };

  // ---- Módulos: G.registrar(nombre, { orden, iniciar, actualizar(dt), ... })
  G.mods = [];
  G.registrar = (nombre, m) => { m.nombre = nombre; G.mods.push(m); G.mods.sort((a, b) => (a.orden || 0) - (b.orden || 0)); return m; };
  G.llamar = (fn, ...a) => { for (const m of G.mods) if (m[fn]) m[fn](...a); };

  // ---- Estados de pantalla (los define la UI)
  G.cambiarEstado = (e, datos) => { const antes = G.estado; G.estado = e; G.emit('estado', { antes, ahora: e, datos }); };

  return G;
})();

</script>
<script>
// ---- 10_audio.js
// 10_audio.js — música y sonidos sintetizados con Web Audio (sin archivos).
// El reloj del audio es el reloj del juego: G.t = ac.currentTime - desfase. Así notas, pasos y golpes
// nunca se separan. Las notas se programan con 0.15 s de margen (planificador sin cortes).
(function (G) {
  const U = G.u, BEAT = G.BEAT, CORCHEA = BEAT / 2;
  const N = { G2: 98, A2: 110, C3: 130.8, D3: 146.8, E3: 164.8, G3: 196, A3: 220, C4: 261.6, D4: 293.7, E4: 329.6,
    G4: 392, A4: 440, C5: 523.3, D5: 587.3, E5: 659.3, G5: 784, A5: 880 };
  // Temas: melodía en corcheas (32 = 4 compases) y bajo por pulso (16). null = silencio.
  const _ = null;
  const TEMAS = [
    { mel: ['E4', _, _, 'G4', 'A4', _, _, _, 'G4', _, 'E4', _, 'D4', _, _, _, 'E4', _, _, 'G4', 'A4', _, 'C5', _, 'A4', _, _, _, _, _, _, _],
      bajo: ['A2', _, 'E3', _, 'C3', _, 'G2', _, 'A2', _, 'E3', _, 'C3', _, 'E3', _], vol: 0.05 },
    { mel: ['A4', _, 'C5', 'A4', 'G4', _, 'E4', _, 'D4', 'E4', 'G4', _, 'A4', _, _, _, 'A4', _, 'C5', 'D5', 'E5', _, 'D5', 'C5', 'A4', _, 'G4', 'E4', 'A4', _, _, _],
      bajo: ['A2', 'A2', 'E3', 'A2', 'C3', 'C3', 'G3', 'E3', 'A2', 'A2', 'E3', 'A2', 'D3', 'D3', 'E3', 'E3'], vol: 0.065 },
    { mel: ['E5', _, 'D5', _, 'C5', _, 'A4', _, 'C5', _, 'D5', 'E5', 'D5', _, _, _, 'G4', _, 'A4', _, 'C5', _, 'D5', _, 'C5', 'A4', 'G4', _, 'A4', _, _, _],
      bajo: ['A2', _, 'A2', 'E3', 'G2', _, 'G2', 'D3', 'C3', _, 'C3', 'G3', 'E3', _, 'E3', 'A2'], vol: 0.06 },
    { mel: ['A4', 'A4', _, 'C5', _, 'A4', 'G4', _, 'E4', _, 'G4', 'A4', _, _, 'E4', _, 'D4', 'D4', _, 'E4', _, 'G4', 'A4', _, 'C5', _, 'A4', _, 'E4', _, _, _],
      bajo: ['A2', 'A2', 'A2', 'G2', 'E3', 'E3', 'D3', 'C3', 'A2', 'A2', 'A2', 'G2', 'E3', 'E3', 'E3', 'E3'], vol: 0.065 },
    { mel: ['A4', _, 'A4', 'C5', 'E5', _, 'D5', 'C5', 'A4', _, 'A4', 'C5', 'D5', _, 'E5', _, 'G5', _, 'E5', 'D5', 'C5', _, 'D5', 'E5', 'A4', _, 'C5', _, 'A4', _, _, _],
      bajo: ['A2', 'E3', 'A2', 'E3', 'G2', 'D3', 'G2', 'D3', 'C3', 'G3', 'C3', 'G3', 'E3', 'E3', 'E3', 'E3'], vol: 0.07 },
  ];
  // Contramelodía de fiebre: arpegio en corcheas una octava arriba.
  const FIEBRE = ['A5', 'E5', 'C5', 'E5', 'G5', 'E5', 'D5', 'E5'];
  const CANTOS = {

<script>
// ---- 11_ritmo.js
// 11_ritmo.js — juicio de golpes, secuencias de 4 tambores, órdenes, combo y modo fiebre.
// Ciclo estilo Patapon: el jugador toca 4 golpes seguidos (uno por pulso); la tropa cumple la orden
// durante los 4 pulsos siguientes y la canta; después el jugador vuelve a tocar para mantener el combo.
(function (G) {
  const U = G.u, BEAT = G.BEAT;

    'PATA PATA PATA PON': 'marchar',
    'PON PON PATA PON': 'atacar',
    'CHAKA CHAKA PATA PON': 'defender',
    'PON PATA PON PATA': 'retroceder',
    'PON PON CHAKA CHAKA': 'cargar',

  const R = G.ritmo = {
    ORDENES, sec: [], ejec: null, combo: 0, fiebre: false, ultimo: -99, pulsoActual: -1, perfectos: 0, fallos: 0,
    reiniciar() { R.sec = []; R.ejec = null; R.combo = 0; R.fiebre = false; R.ultimo = -99; R.perfectos = 0; R.fallos = 0; G.audio.fiebre(false); },
    latencia: () => (G.prog ? G.prog.datos.latencia : 0) / 1000,
    romper(motivo) {
      if (R.combo > 0 || R.fiebre) G.emit('combo_roto', motivo);
      R.combo = 0;
      if (R.fiebre) { R.fiebre = false; G.audio.fiebre(false); }
    },

      const info = { tipo, juicio, err, b };

      if (R.ejec && b < R.ejec.pulso0 + 4) {
        info.juicio = 'espera'; G.emit('golpe', info); R.romper('espera'); R.fallos++; return info;
      }

      }

      if (ult && b === ult.b) { R.sec = []; info.juicio = 'fallo'; R.fallos++; G.emit('golpe', info); R.romper('doble golpe'); return info; }
      if (ult && b !== ult.b + 1) R.sec = [];

        }

    actualizar() {
      const b = Math.floor(G.t / BEAT);

      if (R.ejec && G.t >= R.ejec.fin) { G.emit('fin_orden', R.ejec); R.ultimo = R.ejec.pulso0 + 3; R.ejec = null; }

})(window.G);

<script>
// ---- 12_entrada.js
// 12_entrada.js — teclado, táctil y mando. Emite:
//   'tambor' (PATA | PON | CHAKA | DON) durante el juego, y 'tecla' (izq | der | arriba | abajo | ok | atras | pausa)
// para los menús. La UI decide qué hacer según G.estado.
(function (G) {
  const TAMBORES = { KeyA: 'PATA', KeyJ: 'PATA', ArrowLeft: 'PATA', KeyD: 'PON', KeyL: 'PON', ArrowRight: 'PON',
    KeyW: 'CHAKA', KeyI: 'CHAKA', ArrowUp: 'CHAKA', KeyS: 'DON', KeyK: 'DON', ArrowDown: 'DON' };
  const MENU = { ArrowLeft: 'izq', KeyA: 'izq', ArrowRight: 'der', KeyD: 'der', ArrowUp: 'arriba', KeyW: 'arriba',
    ArrowDown: 'abajo', KeyS: 'abajo', Enter: 'ok', Space: 'ok', KeyJ: 'ok', Escape: 'atras', Backspace: 'atras',
    KeyP: 'pausa' };
  const E = G.entrada = { tactil: false, ultima: 0 };

  function primerGesto() { G.audio.iniciar(); }
  addEventListener('keydown', (e) => {
    if (e.repeat) return;
    primerGesto();
    E.ultima = performance.now();
    if (G.estado === 'juego') {
      if (e.code === 'Escape' || e.code === 'KeyP') { G.emit('tecla', 'pausa'); e.preventDefault(); return; }
      const t = TAMBORES[e.code];
      if (t) { G.emit('tambor', t); e.preventDefault(); }
      return;
    }
    if (G.estado === 'calibrar' && TAMBORES[e.code]) { G.emit('tambor', TAMBORES[e.code]); e.preventDefault(); }
    const m = MENU[e.code];
    if (m) { G.emit('tecla', m); e.preventDefault(); }
  });

  // ---- Táctil / ratón: la UI define zonas en coordenadas del buffer (480×270)
  E.zonas = [];   // [{ x, y, w, h, tambor?, tecla?, accion? }]
  function aBuffer(ev) {
    const c = G.pantalla, r = c.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / r.width * G.W, y: (ev.clientY - r.top) / r.height * G.H };
  }
  function toque(ev) {
    primerGesto();
    if (ev.pointerType === 'touch') E.tactil = true;
    const p = aBuffer(ev);
    for (const z of E.zonas) {
      if (p.x >= z.x && p.x < z.x + z.w && p.y >= z.y && p.y < z.y + z.h) {
        if (z.tambor) G.emit('tambor', z.tambor);
        else if (z.tecla) G.emit('tecla', z.tecla);
        else if (z.accion) z.accion();
        ev.preventDefault();
        return;
      }
    }
    if (G.estado !== 'juego') G.emit('tecla', 'ok');   // tocar en cualquier sitio = aceptar
  }
  addEventListener('DOMContentLoaded', () => {
    G.pantalla.addEventListener('pointerdown', toque);
    G.pantalla.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  // ---- Mando: X=PATA, B=PON, Y=CHAKA, A=DON, Start=pausa; cruceta para menús
  const antes = {};
  E.actualizar = () => {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) {
      if (!p) continue;
      const bot = (i) => p.buttons[i] && p.buttons[i].pressed;
      const mapa = G.estado === 'juego'
        ? { 2: ['tambor', 'PATA'], 1: ['tambor', 'PON'], 3: ['tambor', 'CHAKA'], 0: ['tambor', 'DON'], 9: ['tecla', 'pausa'] }
        : { 14: ['tecla', 'izq'], 15: ['tecla', 'der'], 12: ['tecla', 'arriba'], 13: ['tecla', 'abajo'], 0: ['tecla', 'ok'], 1: ['tecla', 'atras'], 9: ['tecla', 'ok'] };
      for (const k in mapa) {
        const id = p.index + ':' + k, on = bot(+k);
        if (on && !antes[id]) { primerGesto(); G.emit(mapa[k][0], mapa[k][1]); }

})(window.G);

// 13_progreso.js — guardado local (niveles superados, récords, ajustes). Si el navegador no deja guardar,
// el juego sigue igual sin guardar.
(function (G) {

  const base = () => ({ desbloqueado: 1, records: {}, latencia: 0, musica: true, vistoTutorial: false });

  P.cargar = () => {
    if (G.prueba) return;

  };

})(window.G);

// ---- 20_esqueleto.js
// 20_esqueleto.js — stickman pixel art reutilizable (tropa, enemigos y jefe).
// Cadera → torso → cabeza; piernas y brazos de 2 huesos resueltos con IK (ley de cosenos).

(function (G) {

// ---- 21_tropa.js

    for (const u of T.unidades) if (u.vivo) { const l = dibujarUnidad(u, dt); if (l) G.luces.push(l); }
  };

// ---- 30_enemigos.js
// 30_enemigos.js — enemigos con IA sencilla que actúan al pulso, empalizadas y el jefe gigante.
(function (G) {
  const U = G.u, D = G.d, BEAT = G.BEAT;

    lancero:    { hp: 26, dano: 9, alcance: 20, vel: 22, aggro: 200, ancho: 6, puntos: 120 },
    arquero:    { hp: 20, dano: 5, alcance: 150, vel: 14, aggro: 210, ancho: 6, puntos: 120 },
    empalizada: { hp: 70, dano: 0, alcance: 0, vel: 0, aggro: 0, ancho: 14, puntos: 80 },

  };
  const E = G.enem = { lista: [], TIPOS };

  E.reiniciar = (defs) => {
    E.lista = defs.map((d, i) => {
      const t = TIPOS[d.tipo];

          escala: d.tipo === 'jefe' ? 2.4 : 1, oido: 0.3 });

    let mejor = null, dm = 1e9;

      const d = e.x - e.ancho / 2 - u.x;

  G.on('pulso', (b) => {

      if (e.estado === 'espera' && ob.d < aggro) e.estado = 'avanza';

          else if (Math.abs(e.x - e.ancho / 2 - e.ataque.obj.x) <= t.alcance + 4) G.combate.danar(e.ataque.obj, t.dano, e);
          e.ataque = null; e.cooldown = e.tipo === 'arquero' ? 2 : 1;
        }

      if (e.cooldown > 0 && !e.ataque) e.cooldown--;

      if (e.tipo === 'lancero' && e.estado === 'avanza' && ob.d < 110 && ob.d > 30 && !e.carga) e.carga = 2;
      else if (e.carga) e.carga--;

  });

  function pulsoJefe(e, b, ob) {
    if (!ob) return;
    if (e.estado === 'espera' && ob.d < TIPOS.jefe.aggro) { e.estado = 'activo'; G.emit('jefe_despierta'); }

    const DUR = { camina: furia ? 2 : 3, golpe: 3, pisoton: 2 };

  function dibujarEmpalizada(e) {

      hipW: e.x, vx: e.vx, dt, hop: jefe && e.fase === 'pisoton' && e.pulsosEnFase < 2 ? U.smooth(p) * 3 : 0,

      // garrote enorme

        if (Math.floor(G.t * 8) % 2 === 0) D.texto('!', r.cx, r.cy - 22, '#FF5A3A', 3, 'centro', '#2A0E0E');

        G.ctx.globalAlpha = 0.25 + 0.2 * Math.sin(G.t * 20);

    for (const e of E.lista) {

<script>
// ---- 31_combate.js
// 31_combate.js — daño, proyectiles (flechas en arco, ondas del jefe), partículas y textos flotantes.
(function (G) {
  const U = G.u, D = G.d, GRAV = 150;
  const C = G.combate = { proy: [], part: [], textos: [] };
  G.temblor = 0;

  C.reiniciar = () => { C.proy = []; C.part = []; C.textos = []; G.temblor = 0; };

  C.danar = (obj, cantidad, fuente) => {
    if (!obj.vivo) return 0;
    const m = obj.bando === 'tropa' ? G.tropa.mult(obj) : 1;
    const d = Math.round(cantidad * m);
    if (d <= 0) {
      G.audio.sfx('escudo');
      C.texto('BLOQ', obj.x - G.camX, G.GY - 36, '#C9CCD2');
      return 0;
    }
    obj.hp -= d; obj.herido = 0.08; obj.verVida = 2.5;
    C.texto(String(d), obj.x - G.camX, G.GY - 38, obj.bando === 'tropa' ? '#FF8A6A' : '#FFF1C2');
    G.audio.sfx(m < 0.5 ? 'escudo' : 'golpe', 0.8);
    for (let k = 0; k < 5; k++) C.part.push({ x: obj.x, y: G.GY - 16, vx: (Math.random() - 0.5) * 60, vy: -30 - Math.random() * 40, vida: 0.4, col: '#E8E4DA' });
    if (obj.hp <= 0) morir(obj);
    return d;
  };
  function morir(obj) {
    obj.vivo = false; obj.hp = 0;
    G.audio.sfx('muerte');
    // se deshace en píxeles del color del cuerpo
    const col = obj.bando === 'tropa' ? '#15131A' : obj.tipo === 'empalizada' ? '#6A4A30' : '#3A1616';
    const alto = obj.tipo === 'jefe' ? 70 : 28, n = obj.tipo === 'jefe' ? 90 : 26;
    for (let k = 0; k < n; k++) {
      C.part.push({ x: obj.x + (Math.random() - 0.5) * (obj.tipo === 'jefe' ? 30 : 8), y: G.GY - Math.random() * alto,
        vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 50, vida: 0.8 + Math.random() * 0.8, col, suelo: true });
    }

  }
  C.texto = (s, x, y, col) => C.textos.push({ s, x, y, col, vida: 0.8 });
  C.polvo = (x, n) => { for (let k = 0; k < n; k++) C.part.push({ x: x + (Math.random() - 0.5) * 40, y: G.GY - 1, vx: (Math.random() - 0.5) * 50, vy: -10 - Math.random() * 30, vida: 0.6, col: '#8A7A60' }); };

  // Flecha balística que apunta a donde estará el objetivo (tiempo de vuelo fijo 0.7 s)
  C.flecha = (x, y, obj, bando, dano) => {
    const T = 0.7, tx = obj.x + (obj.vx || 0) * T, ty = G.GY - 14;
    C.proy.push({ tipo: 'flecha', x, y, vx: (tx - x) / T, vy: (ty - y) / T - 0.5 * GRAV * T, bando, dano, vivo: true, clavada: 0 });
    G.audio.sfx('flecha');
  };
  C.onda = (x, vx, dano, bando) => C.proy.push({ tipo: 'onda', x, vx, dano, bando, vivo: true, vida: 2.2, tocados: new Set() });

  C.actualizar = (dt) => {
    G.temblor = Math.max(0, G.temblor - dt);
    for (const p of C.proy) {
      if (!p.vivo) continue;
      if (p.tipo === 'flecha') {
        if (p.clavada > 0) { p.clavada -= dt; if (p.clavada <= 0) p.vivo = false; continue; }
        p.vy += GRAV * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        const blancos = p.bando === 'tropa' ? G.enem.lista : G.tropa.unidades;
        for (const b of blancos) {
          if (!b.vivo) continue;
          const alto = b.tipo === 'jefe' ? 70 : b.tipo === 'empalizada' ? 26 : 30;
          if (Math.abs(p.x - b.x) < b.ancho / 2 + 2 && p.y > G.GY - alto && p.y < G.GY) { C.danar(b, p.dano, p); p.vivo = false; break; }
        }
        if (p.vivo && p.y >= G.GY - 1) { p.y = G.GY - 1; p.clavada = 1.2; }
      } else if (p.tipo === 'onda') {
        p.x += p.vx * dt; p.vida -= dt;
        if (p.vida <= 0) p.vivo = false;
        for (const u of G.tropa.unidades) {
          if (u.vivo && !p.tocados.has(u) && Math.abs(u.x - p.x) < 6) {
            p.tocados.add(u);
            if (u.salto > 0.05) C.texto('ESQUIVA', u.x - G.camX, G.GY - 36, '#C9CCD2');   // saltar la esquiva

      }
    }
    C.proy = C.proy.filter((p) => p.vivo);
    for (const q of C.part) {
      q.vida -= dt; q.vy += GRAV * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.y > G.GY - 1) { q.y = G.GY - 1; q.vx *= 0.5; q.vy = 0; }
    }
    C.part = C.part.filter((q) => q.vida > 0);
    for (const s of C.textos) { s.vida -= dt; s.y -= 16 * dt; }
    C.textos = C.textos.filter((s) => s.vida > 0);
  };

  C.dibujar = () => {
    for (const p of C.proy) {
      if (p.tipo === 'flecha') {
        const x = p.x - G.camX, ang = p.clavada > 0 ? 0.6 * Math.sign(p.vx) : Math.atan2(p.vy, p.vx);
        const ux = Math.cos(ang), uy = Math.sin(ang);

    G.ctx.globalAlpha = 1;
  };
  C.dibujarTextos = () => {
    for (const s of C.textos) { G.ctx.globalAlpha = U.clamp(s.vida * 2.5, 0, 1); D.texto(s.s, s.x, s.y, s.col, 1, 'centro', '#15131A'); }
    G.ctx.globalAlpha = 1;
  };
})(window.G);

// ---- 40_escena.js
// 40_escena.js — cielo, parallax, suelo, hogueras, meta, clima, oscuridad con halos y el agua reutilizada.
(function (G) {

    noche: { cielo: '#23335E', hor: '#50608E', mont: '#2A3656', arb: '#1F2A38', mat: '#1A241E', astro: '#EEF2FF', osc: 1, mul: '#5A6894' },
  };

    S.fase = d.fase || 'dia'; S.clima = d.clima || 'despejado'; S.viento = VIENTO[S.clima];

    for (let i = 0; i < 16; i++) { const ond = Math.round(Math.sin(G.t * 5 - i * 0.5) * (i / 16) * 2); D.rect(x + 2 + i, GY - 56 + ond, 1, 12, i % 8 < 4 ? '#F4F1E6' : '#E4DCC8'); }

    const f = F();

      for (let i = 0; i < 70; i++) c.fillRect(Math.floor(U.hash(i, 1) * W), Math.floor(U.hash(i, 2) * 110), 1, 1);
    }

  // ---- Niebla baja (antes del agua, así también se refleja)
  S.niebla = () => {
    if (S.clima !== 'niebla') return;

    for (let k = 0; k < 3; k++) {
      ctx.globalAlpha = 0.16 + k * 0.05;

  };

    const f = F();
    const luces = [];
    for (const L of G.luces) { const h = HALOS[L.tipo]; if (h) luces.push({ x: L.x - G.camX, y: L.y, tam: h.tam, fuerza: 1 }); }

  };

  // ---- Lluvia (después del agua: gotas en el aire y ondas en la superficie)
  S.lluvia = (dt) => {
    if (S.clima !== 'lluvia' && S.clima !== 'tormenta') return;
    const inc = S.clima === 'tormenta' ? 0.35 : 0.2;
    ctx.fillStyle = S.fase === 'noche' ? '#6E7FA0' : '#A8B8D0';
    ctx.globalAlpha = 0.55;
    for (const g of gotas) {
      g.y += g.v * dt; g.x -= g.v * inc * dt;
      if (g.y > H) { g.y -= H + 10; g.x = Math.random() * (W + 60); }
      if (g.x < -10) g.x += W + 60;
      const x = Math.round(g.x), y = Math.round(g.y);
      ctx.fillRect(x, y, 1, 3); ctx.fillRect(x - 1, y + 3, 1, 1);
      if (y > WY + 2 && Math.random() < 0.02) ondas.push({ x, y, v: 0 });
    }
    if (Math.random() < (S.clima === 'tormenta' ? 0.9 : 0.5)) ondas.push({ x: Math.random() * W, y: WY + 3 + Math.random() * 74, v: 0 });
    ctx.globalAlpha = 0.5;
    for (const o of ondas) { o.v += dt; const r = 1 + Math.floor(o.v * 10); ctx.fillRect(Math.round(o.x - r), Math.round(o.y), 1, 1); ctx.fillRect(Math.round(o.x + r), Math.round(o.y), 1, 1); }
    ondas = ondas.filter((o) => o.v < 0.35);
    ctx.globalAlpha = 1;
  };

  S.actualizar = (dt) => {
    S.relampago = Math.max(0, S.relampago - dt);
    if (S.clima === 'tormenta') {
      S.proxRayo -= dt;
      if (S.proxRayo <= 0) { S.relampago = 0.18; S.proxRayo = 6 + Math.random() * 7; G.audio.sfx('jefe', 0.5); }
    }
  };
})(window.G);

      enemigos: [e('arquero', 460), e('bruto', 500), e('lancero', 720), e('empalizada', 920), e('arquero', 955), e('bruto', 1160),
        e('bruto', 1200), e('lancero', 1420), e('arquero', 1470)], fogatas: [380, 1090] },
    { nombre: 'Noche en el río', sub: 'Defiende cuando apunten', fase: 'noche', clima: 'lluvia', largo: 2000, meta: 1940, tema: 3,
      enemigos: [e('bruto', 420), e('arquero', 470), e('lancero', 700), e('lancero', 745), e('empalizada', 960), e('arquero', 995),
        e('arquero', 1030), e('bruto', 1260), e('bruto', 1300), e('lancero', 1520), e('arquero', 1570), e('bruto', 1610)],
      fogatas: [150, 620, 1150, 1720] },
    { nombre: 'El gigante del río', sub: 'Salta su onda y defiende su garrote', fase: 'noche', clima: 'tormenta', largo: 900, meta: null, tema: 4, jefe: true,
      enemigos: [e('jefe', 620)], fogatas: [120, 460, 820] },
  ];

  const N = G.nivel = null;
  G.NIVELES = NIVELES;

  G.iniciarNivel = (idx) => {
    const d = NIVELES[idx];
    G.nivel = { idx, datos: d, puntos: 0, bajas: 0, tiempo: 0, fin: null, maxCombo: 0 };
    G.escena.configurar(d);
    G.tropa.reiniciar(60);
    G.enem.reiniciar(d.enemigos);
    G.combate.reiniciar();
    G.ritmo.reiniciar();
    G.audio.tema(d.tema);
    G.camX = 0;
  };

  G.on('muere', (o) => {
    const n = G.nivel; if (!n || n.fin) return;
    if (o.bando === 'enem') { n.puntos += G.enem.TIPOS[o.tipo].puntos; n.bajas++; }
  });
  G.on('golpe', (g) => { const n = G.nivel; if (n && !n.fin && g.juicio === 'perfecto') n.puntos += 10; });
  G.on('orden', () => { const n = G.nivel; if (n && !n.fin) { n.puntos += 20 * G.ritmo.combo; n.maxCombo = Math.max(n.maxCombo, G.ritmo.combo); } });

  G.actualizarNivel = (dt) => {
    const n = G.nivel; if (!n || n.fin) return;
    n.tiempo += dt;
    const ab = G.tropa.abanderado();
    if (!ab.vivo || G.tropa.vivas().length === 0) { n.fin = 'derrota'; G.emit('fin_nivel', n); return; }
    const d = n.datos;
    const gana = d.jefe ? !G.enem.jefe().vivo : G.tropa.ej.x + 40 >= d.meta;
    if (gana) {
      n.puntos += G.tropa.vivas().length * 150 + Math.max(0, 600 - Math.floor(n.tiempo) * 3);
      n.fin = 'victoria'; G.emit('fin_nivel', n);
    }
  };

  // Cámara: sigue al ejército con el abanderado a un tercio de la pantalla
  G.actualizarCamara = (dt) => {
    const n = G.nivel; if (!n) return;
    let objetivo = G.tropa.ej.x - 150;
    const j = n.datos.jefe && G.enem.jefe();
    if (j && j.vivo && j.estado === 'activo') objetivo = Math.min(objetivo + 60, j.x - 380);
    objetivo = G.u.clamp(objetivo, 0, n.datos.largo - G.W);
    G.camX += (objetivo - G.camX) * Math.min(1, dt * 4);
  };
})(window.G);

<script>
// ---- 60_ui.js
// 60_ui.js — pantallas (título, mapa, juego, pausa, calibración, victoria, derrota, créditos) y marcador.
(function (G) {

  const UI = G.ui = { sel: 0, menu: 0, juicios: [], avisoCombo: 0, finT: 0, calib: null, volverA: 'mapa', creditosY: 0, tInicio: 0 };

  // ---- Fondo de título: la tropa descansando junto al río al atardecer

  });

  G.on('tecla', (k) => {

      const max = Math.min(G.prog.datos.desbloqueado, G.NIVELES.length) - 1;

  function terminarCalibracion() {

    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      for (let k = 0; k <= 20; k += 2) D.rect(U.lerp(ax, bx, k / 20), U.lerp(ay, by, k / 20), 2, 2, i + 1 < G.prog.datos.desbloqueado ? '#C8B080' : '#4A4F66');
    }
    pts.forEach(([x, y], i) => {
      const abierto = i < G.prog.datos.desbloqueado, hecho = G.prog.datos.records[i + 1] !== undefined, sel = i === UI.sel;
      D.disco(x, y, 9, abierto ? '#C8B080' : '#3A3F55');
      D.disco(x, y, 7, abierto ? (i === 3 ? '#6A2020' : '#2E4A30') : '#23263A');
      D.texto(i === 3 ? '!' : String(i + 1), x + 1, y - 2, abierto ? '#FFF1C2' : '#5A5F75', 1, 'centro');
      if (hecho) { D.rect(x + 7, y - 20, 1, 12, '#15131A'); D.rect(x + 8, y - 20, 6, 4, '#B8322A'); }
      if (sel && parpadeo(3)) { D.rect(x - 12, y + 12, 24, 1, '#FFF1C2'); D.rect(x - 1, y + 13, 3, 2, '#FFF1C2'); }
    });
    const d = G.NIVELES[UI.sel];
    panel(40, 206, 400, 50, 0.7);
    D.texto(d.nombre, 52, 214, '#FFF1C2', 2, 'izq');
    D.texto(d.sub, 52, 230, '#C8D0E0');
    const rec = G.prog.datos.records[UI.sel + 1];
    D.texto(rec !== undefined ? 'RECORD ' + rec : 'SIN SUPERAR', 428, 214, '#F2C14E', 1, 'der');
    D.texto(G.entrada.tactil ? 'TOCA PARA JUGAR' : 'A/D ELEGIR · ENTER JUGAR · W AJUSTES', 52, 244, '#9AA0B4');
    G.entrada.zonas = [];
    pts.forEach(([x, y], i) => { if (i < G.prog.datos.desbloqueado) G.entrada.zonas.push({ x: x - 14, y: y - 14, w: 28, h: 28, accion: () => { if (UI.sel === i) { G.iniciarNivel(i); G.cambiarEstado('juego', 'nuevo'); } else UI.sel = i; } }); });
    G.entrada.zonas.push({ x: 0, y: 0, w: 80, h: 30, accion: () => { UI.volverA = 'mapa'; G.cambiarEstado('ajustes'); } });
    D.texto('AJUSTES', 8, 8, '#9AA0B4');
  }
  function pausa(titulo, ops) {
    ctx.globalAlpha = 0.6; D.rect(0, 0, W, H, '#0D0F16'); ctx.globalAlpha = 1;
    D.texto(titulo, W / 2, 30, '#FFF1C2', 3, 'centro');
    menuLista(ops, 170, 70, UI.menu);
    libroOrdenes(W / 2 - 75, 140);
    D.texto('LATENCIA: ' + G.prog.datos.latencia + ' MS', W / 2, 200, '#9AA0B4', 1, 'centro');
    G.entrada.zonas = ops.map((_, i) => ({ x: 160, y: 66 + i * 12, w: 160, h: 12, accion: () => { UI.menu = i; G.emit('tecla', 'ok'); } }));
  }
  function calibrar() {
    for (let y = 0; y < H; y++) { ctx.fillStyle = U.mix('#1B2238', '#0D0F16', y / H); ctx.fillRect(0, y, W, 1); }
    const c = UI.calib, p = (G.t % BEAT) / BEAT;
    D.texto('CALIBRAR RITMO', W / 2, 30, '#FFF1C2', 2, 'centro');
    D.texto('TOCA CUALQUIER TAMBOR JUSTO CON CADA CLIC', W / 2, 60, '#C8D0E0', 1, 'centro');
    D.disco(W / 2, 110, Math.round(10 + 10 * Math.max(0, 1 - p * 4)), '#F2C14E');
    D.texto(c.errores.length + ' / 8', W / 2, 140, '#FFF1C2', 2, 'centro');
    if (c.resultado !== undefined) {
      D.texto('RESULTADO: ' + c.resultado + ' MS', W / 2, 170, '#6ACB6A', 1, 'centro');
      D.texto('ENTER PARA GUARDAR', W / 2, 184, '#9AA0B4', 1, 'centro');
    } else D.texto('ESC PARA SALIR', W / 2, 184, '#9AA0B4', 1, 'centro');
    G.entrada.zonas = [{ x: 0, y: 0, w: W, h: H - 40, tambor: 'DON' }, { x: 0, y: H - 40, w: W, h: 40, tecla: c.resultado !== undefined ? 'ok' : 'atras' }];
  }
  function fin(victoria) {
    const n = G.nivel;
    ctx.globalAlpha = 0.72; D.rect(0, 40, W, 150, '#0D0F16'); ctx.globalAlpha = 1;
    D.texto(victoria ? '¡VICTORIA!' : 'DERROTA', W / 2, 54, victoria ? '#F2C14E' : '#E0503A', 4, 'centro', '#15131A');
    const filas = [['PUNTOS', n.puntos], ['ENEMIGOS VENCIDOS', n.bajas], ['COMBO MAXIMO', n.maxCombo], ['GOLPES PERFECTOS', G.ritmo.perfectos], ['TIEMPO', Math.floor(n.tiempo) + ' S']];
    filas.forEach(([k, v], i) => { D.texto(k, W / 2 - 90, 92 + i * 11, '#C8D0E0'); D.texto(String(v), W / 2 + 90, 92 + i * 11, '#FFF1C2', 1, 'der'); });
    if (victoria) { if (parpadeo(1.5)) D.texto('PULSA PARA CONTINUAR', W / 2, 160, '#FFFFFF', 1, 'centro'); G.entrada.zonas = []; }
    else {
      menuLista(['REINTENTAR', 'VOLVER AL MAPA'], 180, 152, UI.menu);
      G.entrada.zonas = [0, 1].map((i) => ({ x: 170, y: 148 + i * 12, w: 160, h: 12, accion: () => { UI.menu = i; G.emit('tecla', 'ok'); } }));
    }
  }
  function creditos(dt) {
    ctx.globalAlpha = 0.7; D.rect(0, 0, W, H, '#0D0F16'); ctx.globalAlpha = 1;
    UI.creditosY -= 18 * dt;
    const lineas = ['¡EL GIGANTE HA CAIDO!', '', 'EL RIO VUELVE A ESTAR EN PAZ', '', '', 'TAMBORES JUNTO AL RIO', '', 'IDEA Y DIRECCION', 'EDUARDO', '', 'PROGRAMACION Y ARTE', 'CLAUDE', '', 'AGUA PIXEL ART', 'INSPIRADA EN KINGDOM TWO CROWNS', '', 'RITMO', 'INSPIRADO EN PATAPON', '', '', 'GRACIAS POR JUGAR'];
    lineas.forEach((l, i) => { const y = UI.creditosY + i * 14; if (y > -10 && y < H) D.texto(l, W / 2, y, i === 0 || i === 5 ? '#F2C14E' : '#F4F1E6', i === 0 || i === 5 ? 2 : 1, 'centro'); });
    if (UI.creditosY < -lineas.length * 14) UI.creditosY = H;
  }

  UI.dibujar = (dt) => {
    const e = G.estado;
    if (e === 'titulo') { titulo(); G.entrada.zonas = []; }
    else if (e === 'mapa') mapa();
    else if (e === 'juego') hud(dt);
    else if (e === 'pausa') pausa('PAUSA', ['CONTINUAR', 'CALIBRAR RITMO', 'MUSICA: ' + (G.prog.datos.musica ? 'SI' : 'NO'), 'SALIR AL MAPA']);
    else if (e === 'ajustes') { mapa(); pausa('AJUSTES', ['CALIBRAR RITMO', 'MUSICA: ' + (G.prog.datos.musica ? 'SI' : 'NO'), 'VOLVER']); }
    else if (e === 'calibrar') calibrar();
    else if (e === 'victoria') fin(true);
    else if (e === 'derrota') fin(false);
    else if (e === 'creditos') creditos(dt);
  };
  // Tras la victoria/derrota se espera un poco antes de mostrar la pantalla final
  UI.actualizar = (dt) => {
    if (G.estado === 'juego' && G.nivel && G.nivel.fin) {
      UI.finT -= dt;
      if (UI.finT <= 0) { UI.menu = 0; G.cambiarEstado(G.nivel.fin); }
    }
  };
})(window.G);

</script>
<script>
// ---- 99_principal.js
// 99_principal.js — bucle, escalado entero, orden de actualización/dibujo y modos de prueba por URL.
(function (G) {
  const U = G.u, W = G.W, H = G.H, BEAT = G.BEAT, P = G.P;
  const pantalla = document.getElementById('pantalla'), pctx = pantalla.getContext('2d');
  G.pantalla = pantalla;
  let escala = 1;
  function ajustar() {
    escala = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
    if (innerWidth / W < 1 || innerHeight / H < 1) escala = Math.min(innerWidth / W, innerHeight / H);
    pantalla.width = Math.round(W * escala); pantalla.height = Math.round(H * escala);
    pantalla.style.left = Math.round((innerWidth - pantalla.width) / 2) + 'px';
    pantalla.style.top = Math.round((innerHeight - pantalla.height) / 2) + 'px';
    pctx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', ajustar); ajustar();
  G.audio.musica(G.prog.datos.musica);

  const mundoVisible = () => ['juego', 'pausa', 'victoria', 'derrota', 'titulo'].includes(G.estado);

  function actualizar(dt) {
    G.dt = dt;
    G.entrada.actualizar();
    G.audio.actualizar();
    G.ui.actualizar(dt);
    if (G.estado === 'juego' || G.estado === 'victoria' || G.estado === 'derrota') {
      G.ritmo.actualizar();
      G.escena.actualizar(dt);
      G.tropa.actualizar(dt);
      G.enem.actualizar(dt);
      G.combate.actualizar(dt);
      G.actualizarNivel(dt);
      G.actualizarCamara(dt);
    } else if (G.estado === 'titulo') {
      G.escena.actualizar(dt); G.tropa.actualizar(dt);
    }
  }
  function dibujar(dt) {
    G.luces = [];
    if (mundoVisible()) {
      G.escena.dibujarFondo();
      G.enem.dibujar(dt);
      G.tropa.dibujar(dt);
      G.combate.dibujar();
      G.escena.oscuridad();
      G.escena.niebla();
      G.escena.agua();
      G.escena.lluvia(G.estado === 'pausa' ? 0 : dt);
      G.combate.dibujarTextos();
    }
    G.ui.dibujar(dt);
  }
  function presentar() {
    let dx = 0, dy = 0;
    if (G.temblor > 0) { dx = Math.round((Math.random() - 0.5) * 4 * escala); dy = Math.round((Math.random() - 0.5) * 3 * escala); }
    pctx.fillStyle = '#0D0F16'; pctx.fillRect(0, 0, pantalla.width, pantalla.height);
    pctx.drawImage(G.buf, dx, dy, pantalla.width, pantalla.height);
  }
  G.paso = (dt) => { if (G.estado !== 'pausa') G.t += dt; actualizar(dt); dibujar(dt); };

  // ---- Jugador automático (pruebas): elige la orden y toca en el pulso (bien) o con errores grandes (mal)
  function crearBot(modo, seed = 7) {
    const rnd = U.rng(seed), cola = [];
    return (t) => {
      const R = G.ritmo, b = Math.floor(t / BEAT + 0.5);
      if (!cola.length) {
        const ocupado = R.ejec && b < R.ejec.pulso0 + 3;
        if (ocupado) return;
        const inicio = R.ejec ? R.ejec.pulso0 + 4 : Math.floor(t / BEAT) + 1;
        const frente = G.tropa.frente(), j = G.enem.jefe && G.enem.jefe();
        let cerca = false;
        for (const e of G.enem.lista) if (e.vivo && e.x - frente < 125) cerca = true;
        let orden = cerca ? 'atacar' : 'marchar';
        if (j && j.vivo && j.estado === 'activo' && (j.fase === 'golpe' || j.fase === 'pisoton')) orden = 'defender';
        if (cerca && !G.tropa.ej.cargado && R.combo % 4 === 3) orden = 'cargar';
        const clave = Object.keys(R.ORDENES).find((k) => R.ORDENES[k] === orden);
        clave.split(' ').forEach((tipo, i) => {
          const err = modo === 'mal' ? (rnd() - 0.5) * 0.45 : 0;
          cola.push({ tipo, t: (inicio + i) * BEAT + err });
        });
      }
      while (cola.length && t >= cola[0].t) { const g = cola.shift(); R.golpe(g.tipo, t); }
    };
  }

  function salida(texto) { const pre = document.createElement('pre'); pre.id = 'out'; pre.textContent = texto; document.body.appendChild(pre); }

  function simularNivel(idx, modo, maxS, alPaso) {
    G.iniciarNivel(idx); G.cambiarEstado('juego', 'nuevo');
    const bot = modo ? crearBot(modo) : null;
    for (let i = 0; i < maxS * 60; i++) {
      if (bot && G.estado === 'juego' && !G.nivel.fin) bot(G.t);
      G.paso(1 / 60);
      if (alPaso) alPaso();
      if (G.nivel.fin && G.estado !== 'juego') break;
    }
    return G.nivel;
  }

  // ---- Modos de prueba
  if (P.get('prueba') === 'pies') {
    // Mide cuánto se mueve un pie apoyado entre fotogramas (debe ser 0) en los niveles 1 y 4.
    let deriva = 0, pasos = 0, peor = '';
    const prev = new Map();
    const medir = () => {
      const ents = [...G.tropa.unidades, ...G.enem.lista].filter((e) => e.vivo && e.esq && e.esq.pies);
      for (const e of ents) e.esq.pies.forEach((pie, k) => {
        const key = e.bando + e.i + ':' + k, a = prev.get(key);
        if (a && a.arr === e.esq.pies && !pie.sw && !a.sw) { const d = Math.abs(pie.x - a.x); if (d > deriva) { deriva = d; peor = key; } }
        if (pie.sw && !(a && a.sw)) pasos++;
        prev.set(key, { x: pie.x, sw: !!pie.sw, arr: e.esq.pies });
      });
    };
    simularNivel(0, 'bien', 60, medir);
    simularNivel(3, 'bien', 40, medir);
    salida(`deriva máxima de un pie apoyado: ${deriva.toFixed(4)} px (${peor || '-'}) · pasos: ${pasos}`);
    return;
  }
  if (P.get('prueba') === 'ritmo') {
    const R = G.ritmo, res = [];
    G.iniciarNivel(0); G.cambiarEstado('juego', 'nuevo');
    const casos = [[0, 'perfecto'], [0.05, 'perfecto'], [-0.05, 'perfecto'], [0.1, 'bien'], [-0.11, 'bien'], [0.16, 'fallo'], [-0.2, 'fallo']];
    let ok = 0;
    casos.forEach(([err, esperado], i) => { R.sec = []; R.ejec = null; const j = R.golpe('PATA', (40 + i * 4) * BEAT + err).juicio; res.push(`${err >= 0 ? '+' : ''}${err * 1000} ms → ${j}${j === esperado ? '' : ' (esperado ' + esperado + ')'}`); if (j === esperado) ok++; });
    // secuencia completa → orden
    R.reiniciar(); let orden = null; G.on('orden', (o) => { orden = o.orden; });
    ['PATA', 'PATA', 'PATA', 'PON'].forEach((t, i) => R.golpe(t, (100 + i) * BEAT + 0.01));
    res.push('PATA PATA PATA PON → ' + orden);
    // tocar durante la orden rompe el combo y responde "espera"
    const j = R.golpe('PON', 101.5 * BEAT + 0.5 * BEAT).juicio;
    res.push('golpe durante la orden → ' + j);
    salida(`ritmo: ${ok}/${casos.length} juicios correctos · ${orden === 'marchar' && j === 'espera' ? 'órdenes OK' : 'órdenes MAL'}\n` + res.join('\n'));
    return;
  }
  if (P.has('auto')) {
    const idx = (+P.get('nivel') || 1) - 1, modo = P.get('auto') === 'mal' ? 'mal' : 'bien';
    const n = simularNivel(idx, modo, 400);
    const vivos = G.tropa.vivas().length;
    salida(`nivel ${idx + 1} (${n.datos.nombre}) · bot ${modo}: ${n.fin || 'sin terminar'} en ${n.tiempo.toFixed(1)} s · puntos ${n.puntos} · bajas enemigas ${n.bajas} · tropa viva ${vivos}/8 · combo máx ${n.maxCombo}${G.enem.jefe() ? ' · vida del jefe ' + G.enem.jefe().hp : ''}`);
    return;
  }
  if (P.has('bench')) {
    const n = +P.get('bench') || 300;
    G.iniciarNivel(2); G.cambiarEstado('juego', 'nuevo');
    const bot = crearBot('bien');
    for (let i = 0; i < 600; i++) { bot(G.t); G.paso(1 / 60); }
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { bot(G.t); G.paso(1 / 60); }
    salida(`BENCH ${n} frames: ${((performance.now() - t0) / n).toFixed(3)} ms/frame (nivel 3, lluvia, noche)`);
    return;
  }
  if (P.has('shot')) {
    const pant = P.get('pantalla') || 'juego', sim = +P.get('sim') || 3, idx = (+P.get('nivel') || 1) - 1;
    if (pant === 'titulo') { G.cambiarEstado('titulo'); for (let i = 0; i < sim * 60; i++) G.paso(1 / 60); }
    else if (pant === 'mapa') { G.prog.datos.desbloqueado = +P.get('abiertos') || 3; G.prog.datos.records = { 1: 3120, 2: 2890 }; G.cambiarEstado('mapa'); for (let i = 0; i < 30; i++) G.paso(1 / 60); }
    else {
      simularNivel(idx, P.get('bot') || 'bien', sim);
      if (pant === 'pausa') G.cambiarEstado('pausa');
      if (pant === 'victoria' || pant === 'derrota') { G.nivel.fin = pant; G.cambiarEstado(pant); }
      G.paso(1 / 60);
    }
    if (P.has('tactil')) { G.entrada.tactil = true; G.paso(1 / 60); }
    salida(G.buf.toDataURL());
    return;
  }

  // ---- Bucle real (si la pestaña se oculta durante un nivel, se pausa para no perder el ritmo)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.estado === 'juego' && G.nivel && !G.nivel.fin) { G.audio.pausar(true); G.cambiarEstado('pausa'); }
  });
  G.cambiarEstado('titulo');
  let ultimo = performance.now();
  requestAnimationFrame(function cuadro(ahora) {
    let dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora;
    const r = G.audio.reloj();
    if (r !== null && G.estado !== 'pausa') { dt = U.clamp(r - G.t, 0, 0.05); G.t = r; } else if (G.estado !== 'pausa') G.t += dt;
    actualizar(dt); dibujar(dt); presentar();
    requestAnimationFrame(cuadro);
  });
})(window.G);

</script>
