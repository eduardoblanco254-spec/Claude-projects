<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tambores junto al río</title>
<style>
  :root { --fondo: #0d0f16; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fondo: #0d0f16; } }
  :root[data-theme="dark"] { --fondo: #0d0f16; }
  html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden; touch-action: none; user-select: none; }
  canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>

<body>
<canvas id="pantalla"></canvas>
<script>
// ---- agua.js
// agua.js — agua pixel art reutilizable (reflejo invertido, ondas "a saltos" a 10 Hz,
// columnas de luz y espuma en la orilla). Sin dependencias: copia este archivo a tu juego.
//
// Uso mínimo (ver demo.html):
//   const agua = crearAgua({ ancho: 480, alto: 270, yAgua: 190 });
//   // ...dibuja cielo, fondo y personajes en tu buffer (canvas de 480×270)...
//   agua.dibujar(ctxBuffer, { t: segundos, camX, viento: 0.5, oscuridad: 0, luces: [...] });
//
// Idea: las filas justo encima de la línea del agua se copian volteadas debajo de ella; luego se
// trocean en tiras de 16×1 px y cada tira se desplaza unos píxeles según una tabla de ruido que solo
// cambia 10 veces por segundo. Ese "salto" discreto es lo que da el aspecto pixel art.
(function (global) {
  // ---- Utilidades (ruido determinista y color)
  function hash(x, y = 0, s = 0) {
    let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  function noise2(x, y, s = 0) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }
  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  const mezcla = (c1, c2, t) => { const a = rgb(c1), b = rgb(c2); return hex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)); };
  const oscurece = (c, f) => { const a = rgb(c); return hex(a[0] * f, a[1] * f, a[2] * f); };
  function lienzo(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return { c, x: c.getContext('2d') }; }

  function crearAgua(op = {}) {
    const W = op.ancho ?? 480, H = op.alto ?? 270, WY = op.yAgua ?? 190;
    const WH = H - WY;                 // filas de agua
    const SRC_Y = Math.max(0, WY - WH); // primera fila que se refleja
    const CW = op.trozo ?? 16, NCX = Math.ceil(W / CW);
    const BASE = op.color ?? '#686C53';          // color del río
    const LUZ = op.colorLuz ?? '#FC8F53';        // columnas de luz
    const REFLEJO = op.reflejo ?? 0.3;           // 30 % de reflectividad
    const HZ = op.hz ?? 10;                      // frecuencia de las ondas

    const quieta = lienzo(W, WH);
    const salida = quieta.x.createImageData(W, WH);
    const out32 = new Uint32Array(salida.data.buffer);

    // Oscurecimiento hacia el fondo: hasta 40 % de negro en bandas de 4 px.
    const bandas = lienzo(W, WH);
    { const nb = Math.ceil(WH / 4);
      for (let i = 0; i < nb; i++) { bandas.x.fillStyle = `rgba(0,0,0,${(0.4 * i / Math.max(1, nb - 1)).toFixed(3)})`; bandas.x.fillRect(0, i * 4, W, 4); } }

    // Columna de luz: guiones horizontales, núcleo intenso, huecos que crecen hacia abajo.
    function columna(w, h, seed) {
      const { c, x } = lienzo(w, h), img = x.createImageData(w, h), d = img.data, [r, g, b] = rgb(LUZ), half = w / 2;
      for (let y = 0; y < h; y++) {
        const v = y / (h - 1), iv = Math.min(1, (y + 2) / 6) * Math.pow(1 - v, 0.75);
        const hueco = hash(y, 1, seed) < 0.1 + 0.4 * v;
        const L = half * (1 - 0.5 * v) * (0.5 + 0.5 * hash(y, 2, seed));
        const off = w > 8 ? Math.round((hash(y, 3, seed) - 0.5) * 2) : 0;
        for (let i = 0; i < w; i++) {
          const e = Math.abs(i + 0.5 - half - off) / Math.max(1, L);
          if (e >= 1) continue;
          let a = iv * (e < 0.34 ? 1 : e < 0.7 ? 0.55 : 0.28);
          if (hueco) a *= e < 0.34 ? 0.45 : 0;
          a = Math.round(a * 4) / 4;
          if (a <= 0) continue;
          const o = (y * w + i) * 4; d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = Math.round(a * 255);
        }
      }
      x.putImageData(img, 0, 0);
      return c;
    }
    const variantes = (w, s) => [0, 1, 2].map((k) => columna(w, 48, s + k * 101));
    const COL = { chica: variantes(8, 11), grande: variantes(24, 23) };

    // Tabla de ondas: desplazamiento (dx, dy) por trozo de CW×1 px.
    const NT = NCX * WH, TX = new Int8Array(NT), TY = new Int8Array(NT), TN = new Float32Array(NT);
    let tick = -1;
    function tabla(tk, camX, viento) {
      const t = tk / HZ, ox = camX * 1.5;
      for (let y = 0; y < WH; y++) {
        const amp = 0.8 + 0.4 * y / Math.max(1, WH - 1); // más amplitud al fondo
        const ax = viento * 6 * amp, ay = viento * 12 * amp;
        const Y1 = (y - t * 5) / 4, Y2 = (y - t * 9) / 3;
        for (let c = 0; c < NCX; c++) {
          const X = (c * CW + 8 + ox) / 32;
          const n = noise2(X + t * 0.04, Y1, 301) * 0.62 + noise2(X * 1.3 - t * 0.07, Y2, 302) * 0.38;
          const m = noise2(X * 0.9 + 17, Y1 + 5, 303) * 0.62 + noise2(X * 1.4 + 9, Y2 - 3, 304) * 0.38;
          const k = y * NCX + c;
          TX[k] = Math.round(clamp((n - 0.5) * 3, -1, 1) * ax);
          TY[k] = Math.round(clamp((m - 0.5) * 3, -1, 1) * ay);
          TN[k] = n;
        }
      }
    }

    // ctx: el buffer donde ya dibujaste la escena (se lee de él para el reflejo y se escribe el agua).
    // e: { t, camX, viento (0–1), oscuridad (0–1), colorNoche, luces: [{ x, y, tam: 'chica'|'grande', fuerza }] }
    //    x de las luces en coordenadas de pantalla.
    function dibujar(ctx, e = {}) {
      const t = e.t ?? 0, camX = e.camX ?? 0, viento = e.viento ?? 0.5, osc = e.oscuridad ?? 0;
      const base = mezcla(BASE, e.colorNoche ?? '#141A2E', osc * 0.8);
      const s = quieta.x;
      // 1. Agua quieta: color, bandas, reflejo volteado, columnas de luz.
      s.setTransform(1, 0, 0, 1, 0, 0); s.globalCompositeOperation = 'source-over'; s.globalAlpha = 1;
      s.fillStyle = base; s.fillRect(0, 0, W, WH);
      s.drawImage(bandas.c, 0, 0);
      s.globalAlpha = REFLEJO;
      s.setTransform(1, 0, 0, -1, 0, WH); // la fila justo encima del agua queda pegada a ella
      s.drawImage(ctx.canvas, 0, SRC_Y, W, WY - SRC_Y, 0, WH - (WY - SRC_Y), W, WY - SRC_Y);
      s.setTransform(1, 0, 0, 1, 0, 0);
      const tk = Math.floor(t * HZ);
      const k = osc * 0.8 * Math.min(1, viento * 10);
      if (k > 0.003 && e.luces) {
        s.globalCompositeOperation = 'lighter';
        for (const L of e.luces) {
          const set = COL[L.tam ?? 'chica'];
          const spr = set[(tk + Math.floor(hash(Math.round(L.x * 7), 5) * 3)) % 3];
          const x0 = Math.round(L.x) - (spr.width >> 1), top = Math.round((WY - L.y) * 0.3);
          if (x0 + spr.width < 0 || x0 > W || top >= WH) continue;
          s.globalAlpha = clamp(k * (L.fuerza ?? 1), 0, 1);
          s.drawImage(spr, x0, top);
        }
        s.globalCompositeOperation = 'source-over'; s.globalAlpha = 1;
      }
      s.globalAlpha = 1;

      // 2. Ondas: la tabla cambia a HZ; cada trozo se copia desplazado (vecino más cercano, sin mezcla).
      if (tk !== tick) { tick = tk; tabla(tk, camX, viento); }
      const src = new Uint32Array(s.getImageData(0, 0, W, WH).data.buffer);
      for (let y = 0, k2 = 0; y < WH; y++) {
        const row = y * W;
        for (let c = 0; c < NCX; c++, k2++) {
          let sy = y + TY[k2]; sy = sy < 0 ? 0 : sy >= WH ? WH - 1 : sy;
          const srow = sy * W, x0 = c * CW, dx = TX[k2];
          for (let i = 0; i < CW && x0 + i < W; i++) {
            let sx = x0 + i - dx; sx = sx < 0 ? 0 : sx >= W ? W - 1 : sx;
            out32[row + x0 + i] = src[srow + sx];
          }
        }
      }
      ctx.putImageData(salida, 0, WY);

      // 3. Orilla: línea húmeda y espuma que late con la tabla.
      ctx.fillStyle = oscurece(base, 0.72); ctx.fillRect(0, WY, W, 1);
      ctx.fillStyle = mezcla(base, '#C9CDB8', 0.4 * (1 - osc * 0.6));
      ctx.globalAlpha = 0.35 + 0.45 * Math.min(1, viento);
      for (let c = 0; c < NCX; c++) {
        if (TN[c] < 0.6) continue;
        ctx.fillRect(c * CW + Math.floor(hash(c, tick, 9) * 9), WY + 1, 2 + Math.floor(hash(c, tick, 10) * 5), 1);
      }
      ctx.globalAlpha = 1;
    }

    return { dibujar, yAgua: WY };
  }

  global.crearAgua = crearAgua;
})(window);

</script>
<script>
// ---- 00_nucleo.js
// 00_nucleo.js — espacio de nombres G, utilidades, dibujo pixel, fuente 3×5, eventos y registro de módulos.
window.G = (() => {
  const G = {
    W: 480, H: 270, WY: 190, GY: 176, BEAT: 0.5,
    t: 0, dt: 1 / 60, camX: 0,
    P: new URLSearchParams(location.search),
    estado: 'titulo',
    luces: [],
  };
  G.prueba = G.P.has('shot') || G.P.has('prueba') || G.P.has('auto') || G.P.has('bench');

  // ---- Eventos
  const ev = {};
  G.on = (n, f) => (ev[n] = ev[n] || []).push(f);
  G.emit = (n, a) => { for (const f of ev[n] || []) f(a); };

  // ---- Utilidades numéricas y de color
  const U = G.u = {};
  U.hash = (x, y = 0, s = 0) => {
    let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h = Math.imul(h ^ (h >>> 16), 2246822519);
    return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
  };
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.smooth = (u) => { u = U.clamp(u, 0, 1); return u * u * (3 - 2 * u); };
  U.easeOut = (u) => 1 - (1 - u) * (1 - u);
  U.rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  U.hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(U.clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  U.mix = (a, b, t) => { const x = U.rgb(a), y = U.rgb(b); return U.hex(U.lerp(x[0], y[0], t), U.lerp(x[1], y[1], t), U.lerp(x[2], y[2], t)); };
  U.shade = (c, f) => { const x = U.rgb(c); return U.hex(x[0] * f, x[1] * f, x[2] * f); };
  U.noise1 = (x, s = 0) => { const i = Math.floor(x), f = x - i; return U.lerp(U.hash(i, 0, s), U.hash(i + 1, 0, s), f * f * (3 - 2 * f)); };
  U.rng = (seed) => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // ---- Lienzos
  G.lienzo = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return { c, x: c.getContext('2d', { willReadFrequently: true }) }; };
  const buf = G.lienzo(G.W, G.H);
  G.buf = buf.c; G.ctx = buf.x;

  // ---- Dibujo en píxeles enteros
  const D = G.d = {};
  D.rect = (x, y, w, h, c, g = G.ctx) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  D.disco = (cx, cy, r, c, g = G.ctx) => {
    g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
    for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
  };
  // Línea de Bresenham; grosor g ≥ 1 dibuja cuadrados g×g en cada punto.
  D.linea = (x0, y0, x1, y1, c, gr = 1, g = G.ctx) => {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    g.fillStyle = c;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, o = gr >> 1;
    let e = dx + dy, n = 0;
    for (;;) {
      g.fillRect(x0 - o, y0 - o, gr, gr);
      if ((x0 === x1 && y0 === y1) || ++n > 2000) break;
      const e2 = 2 * e;
      if (e2 >= dy) { e += dy; x0 += sx; }
      if (e2 <= dx) { e += dx; y0 += sy; }
    }
  };

  // ---- Fuente pixel 3×5 (cada fila: 3 bits)
  const F = {
    A: [2, 5, 7, 5, 5], B: [6, 5, 6, 5, 6], C: [3, 4, 4, 4, 3], D: [6, 5, 5, 5, 6], E: [7, 4, 6, 4, 7], F: [7, 4, 6, 4, 4],
    G: [3, 4, 5, 5, 3], H: [5, 5, 7, 5, 5], I: [7, 2, 2, 2, 7], J: [1, 1, 1, 5, 2], K: [5, 5, 6, 5, 5], L: [4, 4, 4, 4, 7],
    M: [5, 7, 7, 5, 5], N: [6, 5, 5, 5, 5], O: [2, 5, 5, 5, 2], P: [6, 5, 6, 4, 4], Q: [2, 5, 5, 6, 3], R: [6, 5, 6, 5, 5],
    S: [3, 4, 2, 1, 6], T: [7, 2, 2, 2, 2], U: [5, 5, 5, 5, 7], V: [5, 5, 5, 5, 2], W: [5, 5, 7, 7, 5], X: [5, 5, 2, 5, 5],
    Y: [5, 5, 2, 2, 2], Z: [7, 1, 2, 4, 7],
    0: [7, 5, 5, 5, 7], 1: [2, 6, 2, 2, 7], 2: [6, 1, 2, 4, 7], 3: [6, 1, 2, 1, 6], 4: [5, 5, 7, 1, 1], 5: [7, 4, 6, 1, 6],
    6: [3, 4, 7, 5, 7], 7: [7, 1, 2, 2, 2], 8: [7, 5, 7, 5, 7], 9: [7, 5, 7, 1, 6],
    '!': [2, 2, 2, 0, 2], '¡': [2, 0, 2, 2, 2], '?': [6, 1, 2, 0, 2], '¿': [2, 0, 2, 4, 3], '.': [0, 0, 0, 0, 2], ',': [0, 0, 0, 2, 4],
    ':': [0, 2, 0, 2, 0], '-': [0, 0, 7, 0, 0], '+': [0, 2, 7, 2, 0], '/': [1, 1, 2, 4, 4], '×': [0, 5, 2, 5, 0], '%': [5, 1, 2, 4, 5],
    "'": [2, 2, 0, 0, 0], '(': [1, 2, 2, 2, 1], ')': [4, 2, 2, 2, 4], '<': [1, 2, 4, 2, 1], '>': [4, 2, 1, 2, 4], '=': [0, 7, 0, 7, 0],
    '·': [0, 0, 2, 0, 0], ' ': [0, 0, 0, 0, 0],
  };
  const limpia = (s) => String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  D.anchoTexto = (s, e = 1) => limpia(s).length * 4 * e - e;
  // alin: 'izq' | 'centro' | 'der'; sombra: color de la sombra 1 px abajo
  D.texto = (s, x, y, c = '#FFFFFF', e = 1, alin = 'izq', sombra = null, g = G.ctx) => {
    s = limpia(s);
    let px = Math.round(alin === 'centro' ? x - D.anchoTexto(s, e) / 2 : alin === 'der' ? x - D.anchoTexto(s, e) : x);
    y = Math.round(y);
    if (sombra) D.texto(s, px + (alin === 'izq' ? 0 : 0), y + e, sombra, e, 'izq', null, g);
    g.fillStyle = c;
    for (const ch of s) {
      const f = F[ch] || F[' '];
      for (let r = 0; r < 5; r++) for (let b = 0; b < 3; b++) if (f[r] & (4 >> b)) g.fillRect(px + b * e, y + r * e, e, e);
      px += 4 * e;
    }
  };

  // ---- Módulos: G.registrar(nombre, { orden, iniciar, actualizar(dt), ... })
  G.mods = [];
  G.registrar = (nombre, m) => { m.nombre = nombre; G.mods.push(m); G.mods.sort((a, b) => (a.orden || 0) - (b.orden || 0)); return m; };
  G.llamar = (fn, ...a) => { for (const m of G.mods) if (m[fn]) m[fn](...a); };

  // ---- Estados de pantalla (los define la UI)
  G.cambiarEstado = (e, datos) => { const antes = G.estado; G.estado = e; G.emit('estado', { antes, ahora: e, datos }); };

  return G;
})();

</script>
<script>
// ---- 10_audio.js
// 10_audio.js — motor musical sintetizado (sin archivos) y efectos de sonido.
// Instrumentos: melodía (sierras desafinadas con filtro, flauta o cuadrada), pad de acordes, arpegio,
// bajo con sub-grave y batería (bombo, caja, charles, toms). Bus de efectos con reverberación y eco,
// y compresor en la salida. Canciones compuestas en grados de la escala con acordes por compás.
// El reloj del audio es el reloj del juego: G.t = ac.currentTime - desfase (120 ppm, pulso 0.5 s).
(function (G) {
  const U = G.u, BEAT = G.BEAT, SEMI = BEAT / 4, COMPAS = 16;   // semicorcheas; 16 por compás (2 s)
  const ESCALAS = { eolio: [0, 2, 3, 5, 7, 8, 10], jonico: [0, 2, 4, 5, 7, 9, 11], dorico: [0, 2, 3, 5, 7, 9, 10],
    mixo: [0, 2, 4, 5, 7, 9, 10], armonica: [0, 2, 3, 5, 7, 8, 11] };
  const BATERIAS = {
    suave:   { k: 'x.......x.......', s: '................', h: '..x...x...x...x.', t: '................' },
    marcha:  { k: 'x...x...x...x...', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.', t: '................' },
    bosque:  { k: 'x.....x...x.....', s: '....x.......x...', h: '..x...x...x...x.', t: 'x.x.x.x.x.x.x.x.' },
    noche:   { k: 'x.........x.....', s: '........x.......', h: 'x..x..x..x..x..x', t: '................' },
    heroico: { k: 'x...x...x...x.x.', s: '....x.......x..x', h: 'xxxxxxxxxxxxxxxx', t: '................' },
    jefe:    { k: 'x..xx...x..xx...', s: '....x.......x.x.', h: 'xxxxxxxxxxxxxxxx', t: '..............xx' },
  };
  // Melodías: 8 compases por sección, 8 corcheas por compás. Grado 1–7, ' = octava arriba, , = abajo,
  // . = silencio, - = mantener la nota anterior.
  const CANCIONES = {
    titulo: { raiz: 69, escala: 'eolio', lead: 'flauta', bajo: 'lento', bat: 'suave', vol: 0.8,
      acA: [1, 6, 3, 7, 1, 6, 3, 7], acB: [4, 5, 1, 1, 4, 5, 6, 7],
      A: ['5 - - 3 1 - 2 3', '4 - 3 - 1 - - .', '3 - 5 - 1\' - 7 5', '7 - 5 - 2 - . .', '5 - - 3 1 - 2 3', '4 - 6 - 5 - 4 3', '3 - 2 - 3 5 - .', '2 - 1 - 1 - - .'],
      B: ['1\' - 7 - 6 - 5 -', '6 - 5 - 4 - 3 -', '3 - 1 - 3 5 1\' -', '7 - - 5 3 - - .', '1\' - 7 - 6 - 1\' -', '2\' - 1\' 7 5 - - .', '6 - - 5 4 3 2 3', '1 - - - . . . .'] },
    campamento: { raiz: 60, escala: 'jonico', lead: 'flauta', bajo: 'pulso', bat: 'suave', vol: 0.85,

<script>
// ---- 11_ritmo.js
// 11_ritmo.js — juicio de golpes, secuencias de 4 tambores, órdenes, combo y modo fiebre.
// Ciclo estilo Patapon: el jugador toca 4 golpes seguidos (uno por pulso); la tropa cumple la orden
// durante los 4 pulsos siguientes y la canta; después el jugador vuelve a tocar para mantener el combo.
(function (G) {
  const U = G.u, BEAT = G.BEAT;
  const ORDENES = {
    'PATA PATA PATA PON': 'marchar',
    'PON PON PATA PON': 'atacar',
    'CHAKA CHAKA PATA PON': 'defender',
    'PON PATA PON PATA': 'retroceder',
    'PON PON CHAKA CHAKA': 'cargar',
  };
  const PERFECTO = 0.06, BIEN = 0.13, FIEBRE_COMBO = 4;

  const R = G.ritmo = {
    ORDENES, sec: [], ejec: null, combo: 0, fiebre: false, ultimo: -99, pulsoActual: -1, perfectos: 0, fallos: 0,
    reiniciar() { R.sec = []; R.ejec = null; R.combo = 0; R.fiebre = false; R.ultimo = -99; R.perfectos = 0; R.fallos = 0; G.audio.fiebre(false); },
    latencia: () => (G.prog ? G.prog.datos.latencia : 0) / 1000,
    romper(motivo) {
      if (R.combo > 0 || R.fiebre) G.emit('combo_roto', motivo);
      R.combo = 0;
      if (R.fiebre) { R.fiebre = false; G.audio.fiebre(false); }
    },
    // tiempo: opcional (pruebas); por defecto el reloj del juego
    golpe(tipo, tiempo = G.t) {
      G.audio.tambor(tipo);
      const tt = tiempo - R.latencia(), b = Math.round(tt / BEAT), err = tt - b * BEAT, ae = Math.abs(err);
      const juicio = ae <= PERFECTO ? 'perfecto' : ae <= BIEN ? 'bien' : 'fallo';
      const info = { tipo, juicio, err, b };
      // Tocar mientras la tropa cumple la orden rompe el combo (hay que escuchar).
      if (R.ejec && b < R.ejec.pulso0 + 4) {
        info.juicio = 'espera'; G.emit('golpe', info); R.romper('espera'); R.fallos++; return info;
      }
      if (juicio === 'fallo') {
        R.sec = []; R.fallos++; G.emit('golpe', info); R.romper('fuera de ritmo'); G.audio.sfx('fallo', 0.6); return info;
      }
      const ult = R.sec[R.sec.length - 1];
      if (ult && b === ult.b) { R.sec = []; info.juicio = 'fallo'; R.fallos++; G.emit('golpe', info); R.romper('doble golpe'); return info; }
      if (ult && b !== ult.b + 1) R.sec = [];
      if (juicio === 'perfecto') R.perfectos++;
      R.sec.push(info); R.ultimo = b;
      G.emit('golpe', info);
      if (R.sec.length >= 4) {
        const ult4 = R.sec.slice(-4), clave = ult4.map((s) => s.tipo).join(' '), orden = ORDENES[clave];
        if (orden) {
          const potencia = ult4.reduce((a, s) => a + (s.juicio === 'perfecto' ? 1.2 : 0.9), 0) / 4;
          R.combo++;
          const pulso0 = b + 1;
          R.ejec = { orden, pulso0, inicio: pulso0 * BEAT, fin: (pulso0 + 4) * BEAT, potencia };
          R.sec = [];
          if (!R.fiebre && R.combo >= FIEBRE_COMBO) { R.fiebre = true; G.audio.fiebre(true); G.audio.sfx('fiebre'); G.emit('fiebre', true); }
          G.audio.canto(orden, pulso0);
          G.emit('orden', R.ejec);
        } else if (R.sec.length >= 4) {
          R.sec = R.sec.slice(-3);        // ventana deslizante: los últimos 3 aún pueden empezar una orden
        }
      }
      return info;
    },
    // La orden en curso (solo durante sus 4 pulsos)
    ordenActiva: () => (R.ejec && G.t >= R.ejec.inicio - 0.02 && G.t < R.ejec.fin ? R.ejec : null),
    actualizar() {
      const b = Math.floor(G.t / BEAT);
      if (b !== R.pulsoActual) { R.pulsoActual = b; G.emit('pulso', b); }
      if (R.ejec && G.t >= R.ejec.fin) { G.emit('fin_orden', R.ejec); R.ultimo = R.ejec.pulso0 + 3; R.ejec = null; }
      const ahora = G.t / BEAT;
      if (R.sec.length && ahora > R.sec[R.sec.length - 1].b + 1.6) { R.sec = []; G.emit('secuencia_perdida'); }
      if (!R.ejec && R.combo > 0 && ahora > R.ultimo + 2.6) R.romper('silencio');
    },
  };
})(window.G);

<script>
// ---- 12_entrada.js
// 12_entrada.js — teclado, táctil y mando. Emite:
//   'tambor' (PATA | PON | CHAKA | DON) durante el juego, y 'tecla' (izq | der | arriba | abajo | ok | atras | pausa)
// para los menús. La UI decide qué hacer según G.estado.
(function (G) {
  const TAMBORES = { KeyA: 'PATA', KeyJ: 'PATA', ArrowLeft: 'PATA', KeyD: 'PON', KeyL: 'PON', ArrowRight: 'PON',
    KeyW: 'CHAKA', KeyI: 'CHAKA', ArrowUp: 'CHAKA', KeyS: 'DON', KeyK: 'DON', ArrowDown: 'DON' };
  const MENU = { ArrowLeft: 'izq', KeyA: 'izq', ArrowRight: 'der', KeyD: 'der', ArrowUp: 'arriba', KeyW: 'arriba',
    ArrowDown: 'abajo', KeyS: 'abajo', Enter: 'ok', Space: 'ok', KeyJ: 'ok', Escape: 'atras', Backspace: 'atras',
    KeyP: 'pausa' };
  const E = G.entrada = { tactil: false, ultima: 0 };

  function primerGesto() { G.audio.iniciar(); }
  addEventListener('keydown', (e) => {
    if (e.repeat) return;
    primerGesto();
    E.ultima = performance.now();
    if (G.estado === 'juego') {
      if (e.code === 'Escape' || e.code === 'KeyP') { G.emit('tecla', 'pausa'); e.preventDefault(); return; }
      const t = TAMBORES[e.code];
      if (t) { G.emit('tambor', t); e.preventDefault(); }
      return;
    }
    if (G.estado === 'calibrar' && TAMBORES[e.code]) { G.emit('tambor', TAMBORES[e.code]); e.preventDefault(); }
    const m = MENU[e.code];
    if (m) { G.emit('tecla', m); e.preventDefault(); }
  });

  // ---- Táctil / ratón: la UI define zonas en coordenadas del buffer (480×270)
  E.zonas = [];   // [{ x, y, w, h, tambor?, tecla?, accion? }]
  function aBuffer(ev) {
    const c = G.pantalla, r = c.getBoundingClientRect();
    return { x: (ev.clientX - r.left) / r.width * G.W, y: (ev.clientY - r.top) / r.height * G.H };
  }
  function toque(ev) {
    primerGesto();
    if (ev.pointerType === 'touch') E.tactil = true;
    const p = aBuffer(ev);
    for (const z of E.zonas) {
      if (p.x >= z.x && p.x < z.x + z.w && p.y >= z.y && p.y < z.y + z.h) {
        if (z.tambor) G.emit('tambor', z.tambor);
        else if (z.tecla) G.emit('tecla', z.tecla);
        else if (z.accion) z.accion();
        ev.preventDefault();
        return;
      }
    }
    if (G.estado !== 'juego') G.emit('tecla', 'ok');   // tocar en cualquier sitio = aceptar
  }
  addEventListener('DOMContentLoaded', () => {
    G.pantalla.addEventListener('pointerdown', toque);
    G.pantalla.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  // ---- Mando: X=PATA, B=PON, Y=CHAKA, A=DON, Start=pausa; cruceta para menús
  const antes = {};
  E.actualizar = () => {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) {
      if (!p) continue;
      const bot = (i) => p.buttons[i] && p.buttons[i].pressed;
      const mapa = G.estado === 'juego'
        ? { 2: ['tambor', 'PATA'], 1: ['tambor', 'PON'], 3: ['tambor', 'CHAKA'], 0: ['tambor', 'DON'], 9: ['tecla', 'pausa'] }
        : { 14: ['tecla', 'izq'], 15: ['tecla', 'der'], 12: ['tecla', 'arriba'], 13: ['tecla', 'abajo'], 0: ['tecla', 'ok'], 1: ['tecla', 'atras'], 9: ['tecla', 'ok'] };
      for (const k in mapa) {
        const id = p.index + ':' + k, on = bot(+k);
        if (on && !antes[id]) { primerGesto(); G.emit(mapa[k][0], mapa[k][1]); }
        antes[id] = on;
      }
    }
  };
})(window.G);

// 13_progreso.js — guardado local (niveles superados, récords, ajustes). Si el navegador no deja guardar,
// el juego sigue igual sin guardar.
(function (G) {
  const CLAVE = 'tambores-junto-al-rio-v1';
  const base = () => ({ desbloqueado: 1, records: {}, latencia: 0, musica: true, vistoTutorial: false });
  const P = G.prog = { datos: base() };
  P.cargar = () => {
    if (G.prueba) return;
    try { const s = localStorage.getItem(CLAVE); if (s) P.datos = Object.assign(base(), JSON.parse(s)); } catch (_) {}
  };
  P.guardar = () => { if (G.prueba) return; try { localStorage.setItem(CLAVE, JSON.stringify(P.datos)); } catch (_) {} };
  P.superar = (nivel, puntos) => {
    P.datos.desbloqueado = Math.max(P.datos.desbloqueado, nivel + 1);
    P.datos.records[nivel] = Math.max(P.datos.records[nivel] || 0, puntos);
    P.guardar();
  };
  P.cargar();
})(window.G);

// ---- 20_esqueleto.js
// 20_esqueleto.js — stickman pixel art reutilizable (tropa, enemigos y jefe).

      const atras = Math.min(7, G.GY - 1 - m.y);
      D.linea(m.x - ux * atras, m.y - uy * atras, m.x + ux * 17, m.y + uy * 17, r.col);
      D.linea(m.x + ux * 17, m.y + uy * 17, m.x + ux * 20, m.y + uy * 20, T.ej.cargado ? ORO : METAL);
    } else if (u.tipo === 'escudo') {
      pose.frente = { x: 4 + (ataca ? th * 0.6 : 0), y: defiende ? 1 : 4 };
      pose.atras = { x: -3 + (ataca ? th * 0.4 : 0), y: 6 };
      const r = G.esq.dibujar(u.esq, pose);
      // espada corta en la mano de atrás
      D.linea(r.manoAtras.x, r.manoAtras.y, r.manoAtras.x + r.dir * 3, r.manoAtras.y - 5, r.col);
      D.rect(r.manoAtras.x + r.dir * 3, r.manoAtras.y - 7, 1, 2, METAL);
      // escudo 4×10 delante del cuerpo
      const sx0 = Math.round(r.mano.x + (r.dir > 0 ? 0 : -3)), sy0 = Math.round(r.mano.y - 5);
      D.rect(sx0, sy0, 4, 10, r.col);
      D.rect(sx0 + (r.dir > 0 ? 3 : 0), sy0 + 1, 1, 8, '#2E2A34');
      D.rect(sx0 + 1, sy0 + 4, 2, 2, T.ej.cargado ? ORO : METAL);
    } else if (u.tipo === 'arco') {
      const tensa = ataca ? (p < 0.35 ? U.easeOut(p / 0.35) : Math.max(0, 1 - (p - 0.35) * 6)) : 0;
      pose.frente = { x: 5, y: 2 };
      pose.atras = { x: 2 - tensa * 4, y: 2 };
      const r = G.esq.dibujar(u.esq, pose);
      const m = r.mano, d = r.dir;
      // arco: curva de 13 px hacia delante
      for (let k = -6; k <= 6; k++) D.rect(m.x + d * Math.round(2.2 * (1 - (k * k) / 36)), m.y + k, 1, 1, MADERA);
      const cx = tensa > 0.05 ? r.manoAtras.x : m.x;
      D.linea(m.x, m.y - 6, cx, m.y, '#8A8F99'); D.linea(cx, m.y, m.x, m.y + 6, '#8A8F99');
      if (tensa > 0.05) D.linea(cx, m.y, m.x + d * 5, m.y, r.col);
    } else if (u.tipo === 'bandera') {
      pose.frente = { x: 4, y: 4 - cab - brazosArriba * 6 };
      const r = G.esq.dibujar(u.esq, pose);
      const bx = Math.round(r.mano.x), top = Math.round(r.mano.y) - 22;
      D.linea(bx, Math.min(G.GY - 1, r.mano.y + 8), bx, top, r.col);
      const viento = G.escena ? G.escena.viento : 0.5;
      for (let i = 0; i < 9; i++) {
        const ond = Math.round(Math.sin(G.t * (6 + 4 * viento) - i * 0.7) * (i / 9) * 1.5);
        D.rect(bx + 1 + i, top + ond, 1, i < 7 ? 6 : 6 - (i - 6) * 2, ROJO);
      }
      D.disco(bx + 5, top + 3 + Math.round(Math.sin(G.t * 8 - 3) * 0.6), 1, ORO);
      // farol en la punta: da luz de noche
      D.rect(bx - 1, top - 4, 3, 3, '#FFD27A'); D.rect(bx, top - 5, 1, 1, r.col);
      luz = { x: bx + G.camX, y: top - 3, tipo: 'farol' };
    }
    // Barra de vida al recibir daño
    if (u.verVida > 0) {
      const x0 = Math.round(u.x - G.camX - 4), y0 = G.GY - 34;
      D.rect(x0, y0, 9, 2, '#2A0E0E'); D.rect(x0, y0, Math.max(1, Math.round(9 * u.hp / u.max)), 2, '#7FD06A');
    }
    return luz;
  }
  T.dibujar = (dt) => {
    for (const u of T.unidades) if (u.vivo) { const l = dibujarUnidad(u, dt); if (l) G.luces.push(l); }
  };
})(window.G);

<script>
// ---- 30_enemigos.js
// 30_enemigos.js — enemigos con IA sencilla que actúan al pulso, empalizadas y el jefe gigante.
(function (G) {
  const U = G.u, D = G.d, BEAT = G.BEAT;
  const PIEL = '#3A1616', HUESO = '#D8CBB0', METAL = '#B7B9BE', MADERA = '#6A4A30', MADERA2 = '#4A3220';
  const TIPOS = {
    bruto:      { hp: 36, dano: 7, alcance: 14, vel: 18, aggro: 190, ancho: 6, puntos: 100, monedas: 5 },
    lancero:    { hp: 26, dano: 9, alcance: 20, vel: 22, aggro: 200, ancho: 6, puntos: 120, monedas: 6 },
    arquero:    { hp: 20, dano: 5, alcance: 150, vel: 14, aggro: 210, ancho: 6, puntos: 120, monedas: 6 },
    escudado:   { hp: 44, dano: 7, alcance: 14, vel: 15, aggro: 190, ancho: 8, puntos: 150, monedas: 8 },
    caudillo:   { hp: 190, dano: 14, alcance: 20, vel: 14, aggro: 230, ancho: 11, puntos: 600, monedas: 40 },
    empalizada: { hp: 70, dano: 0, alcance: 0, vel: 0, aggro: 0, ancho: 14, puntos: 80, monedas: 4 },
    jefe:       { hp: 450, dano: 18, alcance: 75, vel: 14, aggro: 400, ancho: 22, puntos: 2000, monedas: 0 },
  };
  const E = G.enem = { lista: [], TIPOS };

  E.reiniciar = (defs, dif = { vida: 1, dano: 1 }) => {
    E.lista = defs.map((d, i) => {
      const t = TIPOS[d.tipo], hp = Math.round(t.hp * dif.vida);
      const e = { i, tipo: d.tipo, x: d.x, x0: d.x, vx: 0, hp, max: hp, danoM: dif.dano, vivo: true, bando: 'enem', ancho: t.ancho,
        estado: 'espera', herido: 0, verVida: 0, ataque: null, cooldown: 0, anim: 0 };
      if (d.tipo !== 'empalizada') {
        e.esq = G.esq.crear({ dir: -1, color: PIEL, cuernos: HUESO, retraso: U.hash(i, 21) * 0.08, torso: 9 + Math.floor(U.hash(i, 22) * 2),
          escala: d.tipo === 'jefe' ? 2.4 : d.tipo === 'caudillo' ? 1.6 : 1, oido: 0.3 });
        e.gorro = { tipo: 'mascara', col: '#E8DCC0', cuerno: '#C9B79A', corona: d.tipo === 'caudillo' || d.tipo === 'jefe' ? '#F2C14E' : null };
      }
      if (d.tipo === 'jefe') { e.patron = 0; e.pulsosEnFase = 0; }
      return e;
    });
  };
  // Posición del primer obstáculo vivo delante del ejército (para que la marcha se detenga)
  E.bloqueo = () => {
    let m = null;
    for (const e of E.lista) if (e.vivo && (m === null || e.x - e.ancho / 2 < m)) m = e.x - e.ancho / 2;
    return m;
  };
  E.jefe = () => E.lista.find((e) => e.tipo === 'jefe');
  E.mult = (e) => 1;

  function objetivo(e) {
    let mejor = null, dm = 1e9;
    for (const u of G.tropa.unidades) {
      if (!u.vivo) continue;
      const d = e.x - e.ancho / 2 - u.x;
      if (d > -10 && d < dm) { dm = d; mejor = u; }
    }
    return mejor ? { u: mejor, d: dm } : null;
  }

  // ---- IA por pulso: cada enemigo decide en el golpe de tambor
  G.on('pulso', (b) => {
    if (G.estado !== 'juego') return;
    for (const e of E.lista) {
      if (!e.vivo || e.tipo === 'empalizada') continue;
      const t = TIPOS[e.tipo], ob = objetivo(e);
      if (e.tipo === 'jefe') { pulsoJefe(e, b, ob); continue; }
      if (!ob) { e.estado = 'espera'; continue; }
      const aggro = t.aggro + (G.nivel ? G.nivel.tiempo * 2.5 : 0);          // con el tiempo salen a buscarte
      if (e.estado === 'espera' && ob.d < aggro) e.estado = 'avanza';
      if (e.estado === 'avanza' && ob.d <= t.alcance + 2) e.estado = 'ataca';
      if (e.estado === 'ataca' && ob.d > t.alcance + 8) e.estado = 'avanza';
      if (e.estado === 'ataca') {
        // Ataque en 2 pulsos: preparar (b) y golpear (b+1)
        if (!e.ataque && e.cooldown <= 0) { e.ataque = { b0: b, obj: ob.u }; }
        else if (e.ataque && b === e.ataque.b0 + 1) {
          if (e.tipo === 'arquero') G.combate.flecha(e.x - 6, G.GY - 22, e.ataque.obj, 'enem', t.dano * e.danoM);
          else if (Math.abs(e.x - e.ancho / 2 - e.ataque.obj.x) <= t.alcance + 4) { G.combate.danar(e.ataque.obj, t.dano * e.danoM, e); if (e.tipo === 'caudillo') { G.temblor = 0.15; G.combate.polvo(e.x - 16, 6); } }
          e.ataque = null; e.cooldown = e.tipo === 'arquero' ? 2 : 1;
        }
      }
      if (e.cooldown > 0 && !e.ataque) e.cooldown--;
      // Lancero: embestida si está a media distancia
      if (e.tipo === 'lancero' && e.estado === 'avanza' && ob.d < 110 && ob.d > 30 && !e.carga) e.carga = 2;
      else if (e.carga) e.carga--;
    }
  });

  function pulsoJefe(e, b, ob) {
    if (!ob) return;
    if (e.estado === 'espera' && ob.d < TIPOS.jefe.aggro) { e.estado = 'activo'; G.emit('jefe_despierta'); }
    if (e.estado !== 'activo') return;
    const furia = e.hp < e.max * 0.5;
    const PATRON = furia ? ['camina', 'golpe', 'pisoton', 'golpe', 'camina', 'pisoton'] : ['camina', 'golpe', 'camina', 'pisoton'];
    const DUR = { camina: furia ? 2 : 3, golpe: 3, pisoton: 2 };
    if (!e.fase) { e.fase = PATRON[e.patron % PATRON.length]; e.pulsosEnFase = 0; }
    e.pulsosEnFase++;
    if (e.fase === 'golpe') {
      if (e.pulsosEnFase === 1) G.audio.sfx('aviso');
      if (e.pulsosEnFase === DUR.golpe) {        // cae el garrote en el tercer pulso
        G.audio.sfx('jefe'); G.temblor = 0.35;
        for (const u of G.tropa.unidades) if (u.vivo && e.x - u.x < TIPOS.jefe.alcance && e.x - u.x > -20) G.combate.danar(u, TIPOS.jefe.dano * e.danoM, e);
        G.combate.polvo(e.x - 55, 14);
      }
    } else if (e.fase === 'pisoton') {
      if (e.pulsosEnFase === 1) G.audio.sfx('aviso');
      if (e.pulsosEnFase === DUR.pisoton) { G.audio.sfx('jefe', 0.6); G.temblor = 0.2; G.combate.onda(e.x - 18, -110, 9 * e.danoM, 'enem'); }
    }
    if (e.pulsosEnFase >= DUR[e.fase]) { e.patron++; e.fase = null; }
  }

  E.actualizar = (dt) => {
    for (const e of E.lista) {
      e.herido = Math.max(0, e.herido - dt); e.verVida = Math.max(0, e.verVida - dt);
      if (!e.vivo || e.tipo === 'empalizada') continue;
      const t = TIPOS[e.tipo], ob = objetivo(e);
      let vx = 0;
      if (ob && e.tipo !== 'jefe' && e.estado === 'avanza') vx = -(e.carga ? 55 : t.vel);
      if (e.tipo === 'jefe' && e.estado === 'activo' && e.fase === 'camina' && ob && ob.d > 45) vx = -t.vel * (e.hp < e.max * 0.5 ? 1.5 : 1);
      // No atravesar a la tropa ni a otros enemigos
      if (ob && vx < 0 && ob.d + vx * dt < (e.tipo === 'jefe' ? 30 : 7)) vx = 0;
      for (const o of E.lista) if (o !== e && o.vivo && o.x < e.x && e.x - o.x < (e.ancho + o.ancho) / 2 + 5 && vx < 0) vx = 0;
      e.vx = vx; e.x += vx * dt;
    }
  };

  // ---- Dibujo
  function dibujarEmpalizada(e) {
    const x = Math.round(e.x - G.camX), col = e.herido > 0 ? '#E8E4DA' : MADERA;
    const alto = [22, 26, 20, 25, 21];
    alto.forEach((h, k) => {
      const hh = Math.round(h * (0.4 + 0.6 * e.hp / e.max));
      D.rect(x - 7 + k * 3, G.GY - hh, 2, hh, col);
      D.rect(x - 7 + k * 3, G.GY - hh - 1, 1, 1, col);
      D.rect(x - 6 + k * 3, G.GY - hh + 2, 1, hh - 2, MADERA2);
    });
    D.rect(x - 8, G.GY - 15, 16, 2, MADERA2); D.rect(x - 8, G.GY - 7, 16, 2, MADERA2);
  }
  function dibujarEnemigo(e, dt) {
    const t = TIPOS[e.tipo], jefe = e.tipo === 'jefe';
    const p = ((G.t % BEAT) + BEAT) % BEAT / BEAT;
    let prep = 0, golpe = 0;
    if (e.ataque) prep = U.smooth(p);                                    // levanta el arma en el pulso de preparación
    else if (e.cooldown > 0 && e.estado === 'ataca') golpe = Math.max(0, 1 - p * 3);
    let alza = 0;
    if (jefe && e.fase === 'golpe') alza = e.pulsosEnFase < 3 ? U.smooth((e.pulsosEnFase - 1 + p) / 2) : 0;
    if (jefe && e.fase === 'pisoton' && e.pulsosEnFase < 2) alza = -U.smooth(p);
    const pose = {
      hipW: e.x, vx: e.vx, dt, hop: jefe && e.fase === 'pisoton' && e.pulsosEnFase < 2 ? U.smooth(p) * 3 : 0,
      incl: 1 + golpe * 2 - prep, cab: 0, agache: 0, reposo: [-2, 3],
      atras: { x: -1, y: 8 }, frente: { x: 4 + golpe * 6 - prep * 3, y: 5 - prep * 8 },
      color: e.herido > 0 ? '#E8E4DA' : null, gorro: e.gorro,
    };
    if (jefe) { pose.frente = { x: 3 - alza * 6, y: 4 - alza * 13 }; pose.atras = { x: -2 - alza * 3, y: 6 - alza * 10 }; }
    const r = G.esq.dibujar(e.esq, pose);
    const m = r.mano, d = r.dir;
    if (e.tipo === 'bruto') {
      const ang = -Math.PI / 2 + (golpe * 1.6 - prep * 0.8) * 1;
      const ex = m.x + Math.cos(ang) * d * 9, ey = m.y + Math.sin(ang) * 9;
      D.linea(m.x, m.y, ex, ey, MADERA); D.disco(ex, ey, 2, MADERA2);
    } else if (e.tipo === 'escudado' || e.tipo === 'caudillo') {
      const gr = e.tipo === 'caudillo' ? 2 : 1, L = e.tipo === 'caudillo' ? 16 : 8;
      const ang = -Math.PI / 2 + (golpe * 1.7 - prep * 0.9);
      const ex = m.x + Math.cos(ang) * d * L, ey = m.y + Math.sin(ang) * L;
      D.linea(m.x, m.y, ex, ey, MADERA, gr);
      D.rect(ex - (d > 0 ? 0 : 3 * gr), ey - 2 * gr, 3 * gr, 4 * gr, METAL);     // hacha
      if (e.tipo === 'escudado') {                                             // escudo grande delante
        const sx0 = Math.round(r.shx + d * 5 - (d > 0 ? 0 : 5)), sy0 = Math.round(r.shy - 2);
        D.rect(sx0, sy0, 5, 13, '#5A3A2A'); D.rect(sx0 + (d > 0 ? 4 : 0), sy0, 1, 13, '#3A2418'); D.rect(sx0 + 1, sy0 + 5, 3, 3, METAL);
      }
    } else if (e.tipo === 'lancero') {
      const ang = golpe > 0 ? 0 : -Math.PI / 2 + (e.carga ? Math.PI / 2 : 0.2);
      const ux = Math.cos(ang) * d, uy = Math.sin(ang);
      D.linea(m.x - ux * 6, m.y - uy * 6, m.x + ux * 15, m.y + uy * 15, r.col);
      D.linea(m.x + ux * 15, m.y + uy * 15, m.x + ux * 18, m.y + uy * 18, METAL);
    } else if (e.tipo === 'arquero') {
      for (let k = -6; k <= 6; k++) D.rect(m.x + d * Math.round(2.2 * (1 - (k * k) / 36)), m.y + k, 1, 1, MADERA);
      D.linea(m.x, m.y - 6, m.x - d * prep * 4, m.y, '#8A8F99'); D.linea(m.x - d * prep * 4, m.y, m.x, m.y + 6, '#8A8F99');
    } else if (jefe) {
      // garrote enorme
      const ang = -Math.PI / 2 - alza * 0.9 * -1 + (e.fase === 'golpe' && e.pulsosEnFase >= 3 ? 1.5 : 0);
      const L = 30, ex = m.x + Math.cos(ang) * d * L, ey = m.y + Math.sin(ang) * L;
      D.linea(m.x, m.y, ex, ey, MADERA, 3); D.disco(ex, ey, 5, MADERA2);
      D.rect(ex - 1, ey - 6, 2, 2, HUESO); D.rect(ex + 3, ey - 2, 2, 2, HUESO);
      // aviso "!" sobre la cabeza durante la preparación
      if ((e.fase === 'golpe' && e.pulsosEnFase < 3) || (e.fase === 'pisoton' && e.pulsosEnFase < 2)) {
        if (Math.floor(G.t * 8) % 2 === 0) D.texto('!', r.cx, r.cy - 22, '#FF5A3A', 3, 'centro', '#2A0E0E');
      }
      // zona de impacto del garrote
      if (e.fase === 'golpe' && e.pulsosEnFase === 2) {
        G.ctx.globalAlpha = 0.25 + 0.2 * Math.sin(G.t * 20);
        D.rect(e.x - TIPOS.jefe.alcance - G.camX, G.GY - 1, TIPOS.jefe.alcance - 10, 2, '#FF5A3A');
        G.ctx.globalAlpha = 1;
      }
    }
    if (!jefe && e.verVida > 0) {
      const x0 = Math.round(e.x - G.camX - 4), y0 = G.GY - 34;
      D.rect(x0, y0, 9, 2, '#1A0A0A'); D.rect(x0, y0, Math.max(1, Math.round(9 * e.hp / e.max)), 2, '#E0503A');
    }
  }
  E.dibujar = (dt) => {
    for (const e of E.lista) {
      if (!e.vivo) continue;
      if (e.x - G.camX < -60 || e.x - G.camX > G.W + 60) { if (e.esq) e.esq.pies = null; continue; }
      if (e.tipo === 'empalizada') dibujarEmpalizada(e); else dibujarEnemigo(e, dt);
    }
  };
})(window.G);

<script>
// ---- 31_combate.js
// 31_combate.js — daño, proyectiles (flechas en arco, ondas del jefe), partículas y textos flotantes.
(function (G) {
  const U = G.u, D = G.d, GRAV = 150;
  const C = G.combate = { proy: [], part: [], textos: [] };
  G.temblor = 0;

  C.reiniciar = () => { C.proy = []; C.part = []; C.textos = []; G.temblor = 0; };

  C.danar = (obj, cantidad, fuente) => {
    if (!obj.vivo) return 0;
    let m = obj.bando === 'tropa' ? G.tropa.mult(obj) : 1;
    if (obj.tipo === 'escudado' && fuente && fuente.tipo !== 'flecha' && !G.tropa.ej.cargado) m = 0.25;
    const d = Math.round(cantidad * m);
    if (d <= 0) {
      G.audio.sfx('escudo');
      C.texto('BLOQ', obj.x - G.camX, G.GY - 36, '#C9CCD2');
      return 0;
    }
    obj.hp -= d; obj.herido = 0.08; obj.verVida = 2.5;
    C.texto(String(d), obj.x - G.camX, G.GY - 38, obj.bando === 'tropa' ? '#FF8A6A' : '#FFF1C2');
    G.audio.sfx(m < 0.5 ? 'escudo' : 'golpe', 0.8);
    for (let k = 0; k < 5; k++) C.part.push({ x: obj.x, y: G.GY - 16, vx: (Math.random() - 0.5) * 60, vy: -30 - Math.random() * 40, vida: 0.4, col: '#E8E4DA' });
    if (obj.hp <= 0) morir(obj);
    return d;
  };
  function morir(obj) {
    obj.vivo = false; obj.hp = 0;
    G.audio.sfx('muerte');
    // se deshace en píxeles del color del cuerpo
    const col = obj.bando === 'tropa' ? '#15131A' : obj.tipo === 'empalizada' ? '#6A4A30' : '#3A1616';
    const alto = obj.tipo === 'jefe' ? 70 : 28, n = obj.tipo === 'jefe' ? 90 : 26;
    for (let k = 0; k < n; k++) {
      C.part.push({ x: obj.x + (Math.random() - 0.5) * (obj.tipo === 'jefe' ? 30 : 8), y: G.GY - Math.random() * alto,
        vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 50, vida: 0.8 + Math.random() * 0.8, col, suelo: true });
    }
    if (obj.bando === 'enem') C.monedas(obj.x, G.enem.TIPOS[obj.tipo].monedas || 0);
    G.emit('muere', obj);
  }
  // Monedas: saltan del enemigo y vuelan al marcador
  C.monedas = (x, n) => {
    for (let k = 0; k < Math.min(n, 12); k++) C.part.push({ x, y: G.GY - 14, vx: (Math.random() - 0.3) * 50, vy: -60 - Math.random() * 40, vida: 1.4, col: '#F2C14E', moneda: Math.ceil(n / Math.min(n, 12)), t: 0 });
  };
  C.texto = (s, x, y, col) => C.textos.push({ s, x, y, col, vida: 0.8 });
  C.polvo = (x, n) => { for (let k = 0; k < n; k++) C.part.push({ x: x + (Math.random() - 0.5) * 40, y: G.GY - 1, vx: (Math.random() - 0.5) * 50, vy: -10 - Math.random() * 30, vida: 0.6, col: '#8A7A60' }); };

  // Flecha balística que apunta a donde estará el objetivo (tiempo de vuelo fijo 0.7 s)

  // ---------------- Objetos del nivel
  function fogata(xw) {
    const x = Math.round(xw - G.camX); if (x < -20 || x > W + 20) return;

    D.rect(x, GY - 62, 2, 56, '#4A3A2A'); D.rect(x - 1, GY - 64, 4, 2, '#F2C14E');
    for (let i = 0; i < 18; i++) { const ond = Math.round(Math.sin(G.t * 5 - i * 0.5) * (i / 18) * 2); D.rect(x + 2 + i, GY - 60 + ond, 1, 13 - (i > 14 ? (i - 14) * 3 : 0), i % 9 < 5 ? '#F4F1E6' : '#E4DCC8'); }
    D.disco(x + 10, GY - 54 + Math.round(Math.sin(G.t * 5 - 4)), 2, '#F2C14E');

  }
  function prop(p) {
    const x = Math.round(p.x - G.camX); if (x < -60 || x > W + 60) return;
    if (p.tipo === 'tienda') {
      const col = p.col || '#C8A870', osc = U.shade(col, 0.7);
      for (let y = 0; y < 26; y++) { const hw = Math.round(y * 0.8) + 2; D.rect(x - hw, GY - 26 + y, hw * 2 + 1, 1, y % 5 === 0 ? osc : col); }
      D.rect(x - 3, GY - 12, 7, 12, '#2A1E16'); D.rect(x, GY - 30, 1, 5, '#4A3A2A'); D.rect(x + 1, GY - 30, 5, 3, p.bandera || '#B8322A');
    } else if (p.tipo === 'yunque') {
      D.rect(x - 6, GY - 8, 12, 3, '#3A3C44'); D.rect(x - 3, GY - 5, 6, 5, '#2A2C34'); D.rect(x - 8, GY - 8, 3, 2, '#3A3C44');
      if (Math.floor(G.t * 2) % 4 === 0) { D.rect(x - 1, GY - 11, 1, 1, '#FFD27A'); D.rect(x + 2, GY - 12, 1, 1, '#FFB060'); }

  // ---------------- Partículas del bioma
  function particulasBioma(dt, ctx) {

  };

    S.relampago = Math.max(0, S.relampago - dt);

    }

<script>
// ---- 45_agua_gl.js
// 45_agua_gl.js — composición final con WebGL: mundo pixel art (vecino más cercano) arriba del agua,
// agua realista a resolución de pantalla (reflejo suave y deformado por olas, espejo según la profundidad,
// destellos del sol/luna, columnas de luz de hogueras, ondas de lluvia, espuma en la orilla) y la capa de

(function (G) {
  const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

    } else {
      float d = b.y - uWY, prof = d / (uTam.y - uWY);
      float wx = b.x + uCam;

                + (lin(vec2(rx - r * 2.2, ry)) + lin(vec2(rx + r * 2.2, ry))) * 0.1;
      float fres = mix(0.9, 0.38, pow(prof, 0.55));

      col = mix(hondo, refl * vec3(0.9, 0.96, 1.0), fres * 0.92);

      col += uCielo * cresta * 0.10 * (1.0 - uOsc * 0.6) * (0.5 + prof);
      // destellos del sol o la luna

        float s = exp(-pow((b.x + dx * 2.0 - uSol.x) / (8.0 + d * 0.8), 2.0));
        float g = pow(max(0.0, olas(q * 1.7 + 3.0) - 0.52) * 2.4, 3.0);
        col += uSolC * s * g * 1.6 * uSol.z;
      }
      // columnas de luz de hogueras y faroles
      for (int i = 0; i < 10; i++) {
        if (float(i) >= uNL) break;
        vec4 L = uL[i];
        float w = exp(-pow((b.x + dx * 1.7 - L.x) / (L.w * (0.55 + prof * 0.9)), 2.0));
        float br = smoothstep(0.35, 0.75, noise(vec2(d * 0.5 - uT * 2.6, L.x * 0.13 + floor(d * 0.25) * 0.37)));
        col += vec3(1.0, 0.6, 0.28) * w * br * pow(1.0 - prof, 0.7) * L.z * 0.95;

<script>
// ---- 50_niveles.js
// 50_niveles.js — desarrollo de cada fase de la campaña (inicio, puntos, monedas, victoria, derrota),
// el campamento y la cámara.
(function (G) {
  G.NIVELES = G.campana.FASES;

  G.iniciarNivel = (idx) => {
    const d = G.campana.FASES[idx];
    G.nivel = { idx, datos: d, puntos: 0, bajas: 0, tiempo: 0, fin: null, maxCombo: 0, monedas: 0, premio: 0 };
    G.escena.configurar(d);
    G.tropa.reiniciar(60);
    G.enem.reiniciar(d.enemigos, G.campana.dificultad(idx));
    G.combate.reiniciar();
    G.ritmo.reiniciar();
    G.audio.tema(d.cancion);
    G.camX = 0;
  };

  // Campamento: tiendas, herrería, maniquí, carro y la tropa descansando junto al fuego
  G.iniciarCampamento = () => {
    G.escena.configurar({ bioma: 'campamento', largo: 1000, fogatas: [300], meta: null,
      props: [{ tipo: 'tienda', x: 170, col: '#C8A870' }, { tipo: 'tienda', x: 214, col: '#A88A5A', bandera: '#F2C14E' }, { tipo: 'estandarte', x: 250 },
        { tipo: 'yunque', x: 372 }, { tipo: 'maniqui', x: 420 }, { tipo: 'carro', x: 470 }, { tipo: 'tienda', x: 520, col: '#B89868' }] });
    G.tropa.reiniciar(330);
    G.enem.reiniciar([]); G.combate.reiniciar(); G.ritmo.reiniciar();
    G.camX = 150; G.nivel = null;
    G.audio.tema('campamento'); G.audio.fiebre(false);
  };

  G.on('muere', (o) => {
    const n = G.nivel; if (!n || n.fin) return;
    if (o.bando === 'enem') { n.puntos += G.enem.TIPOS[o.tipo].puntos; n.bajas++; }
  });
  G.on('golpe', (g) => { const n = G.nivel; if (n && !n.fin && g.juicio === 'perfecto') n.puntos += 10; });
  G.on('orden', () => { const n = G.nivel; if (n && !n.fin) { n.puntos += 20 * G.ritmo.combo; n.maxCombo = Math.max(n.maxCombo, G.ritmo.combo); } });

  G.actualizarNivel = (dt) => {
    const n = G.nivel; if (!n || n.fin) return;
    n.tiempo += dt;
    const ab = G.tropa.abanderado();
    if (!ab.vivo || G.tropa.vivas().length === 0) {
      n.fin = 'derrota'; G.campana.ganar(n.monedas); G.emit('fin_nivel', n); return;
    }
    const d = n.datos;
    const gana = d.jefe ? !G.enem.jefe().vivo : G.tropa.ej.x + G.tropa.frenteOff >= d.meta;
    if (gana) {
      n.puntos += G.tropa.vivas().length * 150 + Math.max(0, 600 - Math.floor(n.tiempo) * 3);
      n.premio = d.recompensa;
      n.fin = 'victoria'; G.campana.ganar(n.monedas + n.premio); G.emit('fin_nivel', n);
    }
  };

  // Cámara: sigue al ejército con el abanderado a un tercio de la pantalla
  G.actualizarCamara = (dt) => {
    const n = G.nivel; if (!n) return;
    let objetivo = G.tropa.ej.x - 150;
    const j = n.datos.jefe && G.enem.jefe();
    if (j && j.vivo && j.estado === 'activo') objetivo = Math.min(objetivo + 60, j.x - 380);
    objetivo = G.u.clamp(objetivo, 0, n.datos.largo - G.W);
    G.camX += (objetivo - G.camX) * Math.min(1, dt * 4);
  };
})(window.G);

</script>
<script>
// ---- 60_ui.js

  // ---- Fondo de título: la tropa junto al río en la pradera

  });
  function accionCampamento() {
    const pest = PESTANAS[UI.pest], C = G.campana;
    if (pest === 'MEJORAR') {
      const c = CLASES_M[UI.fila];
      if (C.mejorar(c)) { G.audio.sfx('mejora'); UI.aviso = { s: C.CLASES[c].nombre + ' NIVEL ' + C.datos().niveles[c], t: 1.6 }; G.tropa.reiniciar(330); }

// ---- 99_principal.js

        });
      }
      while (cola.length && t >= cola[0].t) { const g = cola.shift(); R.golpe(g.tipo, t); }
    };
  }

  function salida(texto) { const pre = document.createElement('pre'); pre.id = 'out'; pre.textContent = texto; document.body.appendChild(pre); }

  function simularNivel(idx, modo, maxS, alPaso) {
    G.iniciarNivel(idx); G.cambiarEstado('juego', 'nuevo');
    const bot = modo ? crearBot(modo) : null;
    for (let i = 0; i < maxS * 60; i++) {
      if (bot && G.estado === 'juego' && !G.nivel.fin) bot(G.t);
      G.paso(1 / 60);
      if (alPaso) alPaso();
      if (G.nivel.fin && G.estado !== 'juego') break;
    }
    return G.nivel;
  }

  // ---- Modos de prueba
  if (P.get('prueba') === 'pies') {
    // Mide cuánto se mueve un pie apoyado entre fotogramas (debe ser 0) en los niveles 1 y 4.
    let deriva = 0, pasos = 0, peor = '';
    const prev = new Map();
    const medir = () => {
      const ents = [...G.tropa.unidades, ...G.enem.lista].filter((e) => e.vivo && e.esq && e.esq.pies);
      for (const e of ents) e.esq.pies.forEach((pie, k) => {
        const key = e.bando + e.i + ':' + k, a = prev.get(key);
        if (a && a.arr === e.esq.pies && !pie.sw && !a.sw) { const d = Math.abs(pie.x - a.x); if (d > deriva) { deriva = d; peor = key; } }
        if (pie.sw && !(a && a.sw)) pasos++;
        prev.set(key, { x: pie.x, sw: !!pie.sw, arr: e.esq.pies });
      });
    };
    simularNivel(0, 'bien', 60, medir);
    simularNivel(6, 'bien', 40, medir);
    salida(`deriva máxima de un pie apoyado: ${deriva.toFixed(4)} px (${peor || '-'}) · pasos: ${pasos}`);
    return;
  }
  if (P.get('prueba') === 'ritmo') {
    const R = G.ritmo, res = [];
    G.iniciarNivel(0); G.cambiarEstado('juego', 'nuevo');
    const casos = [[0, 'perfecto'], [0.05, 'perfecto'], [-0.05, 'perfecto'], [0.1, 'bien'], [-0.11, 'bien'], [0.16, 'fallo'], [-0.2, 'fallo']];
    let ok = 0;
    casos.forEach(([err, esperado], i) => { R.sec = []; R.ejec = null; const j = R.golpe('PATA', (40 + i * 4) * BEAT + err).juicio; res.push(`${err >= 0 ? '+' : ''}${err * 1000} ms → ${j}${j === esperado ? '' : ' (esperado ' + esperado + ')'}`); if (j === esperado) ok++; });
    // secuencia completa → orden
    R.reiniciar(); let orden = null; G.on('orden', (o) => { orden = o.orden; });
    ['PATA', 'PATA', 'PATA', 'PON'].forEach((t, i) => R.golpe(t, (100 + i) * BEAT + 0.01));
    res.push('PATA PATA PATA PON → ' + orden);
    // tocar durante la orden rompe el combo y responde "espera"
    const j = R.golpe('PON', 101.5 * BEAT + 0.5 * BEAT).juicio;
    res.push('golpe durante la orden → ' + j);
    salida(`ritmo: ${ok}/${casos.length} juicios correctos · ${orden === 'marchar' && j === 'espera' ? 'órdenes OK' : 'órdenes MAL'}\n` + res.join('\n'));
    return;
  }
  if (P.has('auto')) {
    const idx = (+P.get('nivel') || 1) - 1, modo = P.get('auto') === 'mal' ? 'mal' : 'bien';
    if (P.get('mejoras') !== 'no') G.campana.progresoEsperado(idx);
    const n = simularNivel(idx, modo, 400);
    const vivos = G.tropa.vivas().length;
    salida(`nivel ${idx + 1} (${n.datos.nombre}) · bot ${modo}: ${n.fin || 'sin terminar'} en ${n.tiempo.toFixed(1)} s · puntos ${n.puntos} · bajas enemigas ${n.bajas} · tropa viva ${vivos}/${G.tropa.unidades.length} · combo máx ${n.maxCombo}${G.enem.jefe() ? ' · vida del jefe ' + G.enem.jefe().hp : ''}`);
    return;
  }
  if (P.has('bench')) {
    const n = +P.get('bench') || 300;
    G.iniciarNivel(2); G.cambiarEstado('juego', 'nuevo');
    const bot = crearBot('bien');
    for (let i = 0; i < 600; i++) { bot(G.t); G.paso(1 / 60); }
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { bot(G.t); G.paso(1 / 60); }
    salida(`BENCH ${n} frames: ${((performance.now() - t0) / n).toFixed(3)} ms/frame (nivel 3, lluvia, noche)`);
    return;
  }
  if (P.get('prueba') === 'musica') {
    G.audio.renderizar(P.get('cancion') || 'pradera', +P.get('seg') || 36, P.has('fiebre')).then((r) => {
      salida(JSON.stringify({ pico: r.pico, rms: r.rms.map((x) => +x.toFixed(3)), wav: r.wav }));
    }).catch((e) => salida('ERROR ' + e.message));
    return;
  }
  if (P.has('capa')) {                      // depuración: una capa de fondo sola
    const [b, i] = P.get('capa').split(':'); const c = G.escena._capas(b)[+i].c;
    G.ctx.fillStyle = '#FF00FF'; G.ctx.fillRect(0, 0, W, H); G.ctx.drawImage(c, -(+P.get('x') || 0), 0);
    salida(G.buf.toDataURL()); return;
  }
  if (P.has('shot')) {
    const pant = P.get('pantalla') || 'juego', sim = +P.get('sim') || 3, idx = (+P.get('nivel') || 1) - 1;
    if (pant === 'titulo') { G.cambiarEstado('titulo'); for (let i = 0; i < sim * 60; i++) G.paso(1 / 60); }
    else if (pant === 'campamento') { G.prog.datos.monedas = 230; G.cambiarEstado('campamento'); for (let i = 0; i < sim * 60; i++) G.paso(1 / 60); }
    else if (pant === 'mapa') { G.prog.datos.desbloqueado = +P.get('abiertos') || 4; G.prog.datos.records = { 1: 3120, 2: 2890, 3: 4100 }; G.cambiarEstado('campamento'); G.cambiarEstado('mapa'); for (let i = 0; i < 30; i++) G.paso(1 / 60); }
    else {
      simularNivel(idx, P.get('bot') || 'bien', sim);
      if (pant === 'pausa') G.cambiarEstado('pausa');
      if (pant === 'victoria' || pant === 'derrota') { G.nivel.fin = pant; G.cambiarEstado(pant); }
      G.paso(1 / 60);
    }
    if (P.has('tactil')) { G.entrada.tactil = true; G.paso(1 / 60); }
    presentar();
    salida(pantalla.toDataURL());
    return;
  }

  // ---- Bucle real (si la pestaña se oculta durante un nivel, se pausa para no perder el ritmo)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.estado === 'juego' && G.nivel && !G.nivel.fin) { G.audio.pausar(true); G.cambiarEstado('pausa'); }
  });
  G.cambiarEstado('titulo');
  let ultimo = performance.now();
  requestAnimationFrame(function cuadro(ahora) {
    let dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora;
    const r = G.audio.reloj();
    if (r !== null && G.estado !== 'pausa') { dt = U.clamp(r - G.t, 0, 0.05); G.t = r; } else if (G.estado !== 'pausa') G.t += dt;
    actualizar(dt); dibujar(dt); presentar();
    requestAnimationFrame(cuadro);
  });
})(window.G);

</script>
